name: Android build

# Elle çalıştırılır (Actions sekmesi → Run workflow), izlenen dallara push'ta
# ve HER pull request'te.
# Amaç: Android Studio kurmadan indirilebilir bir APK üretmek.
on:
  workflow_dispatch:
  push:
    # upgrade/** buraya Capacitor 8 yükseltmesi için eklenmişti: native tarafı
    # değiştiren bir dal, main'e girmeden önce derlendiğini görmek zorunda.
    # chore/** aynı gerekçeyle var — android/ projesinin kendisini taşıyan dal
    # da o gruba giriyor.
    # feat/** ve fix/** sonradan eklendi: ödeme ve düzeltme dalları bugüne kadar
    # hiçbir otomatik kontrolden geçmiyordu, oysa native tarafa ve satın alma
    # akışına dokunan çalışma tam olarak orada yapılıyor.
    branches: [main, 'upgrade/**', 'chore/**', 'feat/**', 'fix/**']
  # Dal adı kalıbına uymayan bir katkı da kontrolsüz kalmasın diye PR'lar hedef
  # dala bakılmadan kapsanıyor. pull_request kullanılıyor, pull_request_target
  # DEĞİL: ikincisi PR'ın kodunu deponun yazma yetkili bağlamında çalıştırır ve
  # burada kazanılacak hiçbir şey yok — bu doğrulamanın sırra ihtiyacı yok.
  pull_request:

# Varsayılan GITHUB_TOKEN yetkisi en aza indiriliyor. İki iş de yalnız depoyu
# okuyor; artifact yükleme Actions çalışma zamanı tokenini kullanıyor, bu izni
# değil. Fork'tan gelen PR'larda token zaten salt okunur ve sır verilmiyor.
permissions:
  contents: read

# Eski koşuları iptal etmek için, AMA yalnız kendi kapsamında: anahtar olayı da
# içeriyor, çünkü push ile PR aynı şeyi sınamıyor. Push kaynak commit'ini
# derler; PR'ın varsayılan checkout'u hedef dalla oluşturulan MERGE ref'ini
# derler. İkisi farklı ağaçlar, dolayısıyla biri diğerini iptal etmemeli.
#
# PR tarafında anahtar dal adı değil PR NUMARASI: farklı fork'lardaki aynı adlı
# dallardan (herkeste bulunan "fix/typo" gibi) açılan PR'lar aynı kovaya
# düşmesin. workflow_dispatch de kendi event_name'iyle ayrı kalıyor.
#
# Bunun kabul edilen sonucu: bir dal hem push hem PR olayı ürettiğinde iki
# doğrulama koşuyor. Bu aşamada kabul ediliyor — ayrı bir deduplikasyon
# düzeneği kurulmadı.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Capacitor 8 → NodeJS 22 veya üstü
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # Capacitor 8 → Android Gradle Plugin 8.13 + Gradle 8.14 → JDK 21
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # Kilit dosyası depoda: npm ci onu birebir kuruyor, böylece CI derlemesi
      # tekrar üretilebilir oluyor. npm install olsaydı her koşu farklı yama
      # sürümü çekebilirdi.
      # --foreground-scripts: postinstall (patch-package) çıktısı loga düşsün.
      # Yama uygulanamazsa bunu bir satır uyarı olarak değil, adımın kendi
      # çıktısında görmek gerekiyor.
      - name: Bağımlılıklar
        run: npm ci --foreground-scripts

      # npm ci sessizce yamasız bir ağaç bırakabilir: eklenti sürümü kayarsa
      # patch-package uyarır ve akış devam eder. O paket iki şeyi birden
      # kaybeder — ödeme hatalarını ayıran npx: kodu ve satın alma tokenini
      # logdan çıkaran redaksiyon. Kontrol KURULU kaynağı okur, patches/
      # dosyasını değil: yamanın kendisi silinen satırları taşıdığı için orayı
      # taramak her koşuda yanlış alarm verirdi.
      - name: Native yama kontrolü
        run: node tools/check-native-patch.js

      - name: Web varlıklarını hazırla
        run: npm run www

      # android/ artık depoda. Eskiden burada "cap add android" vardı ve proje
      # her koşuda şablondan yeniden üretiliyordu; native tarafa yazılan hiçbir
      # şey (imza, versionCode, manifest meta-data'sı, ikonlar) bir sonraki
      # derlemeye kadar yaşayamıyordu. Artık yalnız senkronizasyon var: cap sync
      # web varlıklarını ve üretilen dosyaları tazeler, gradle yapılandırmasına
      # dokunmaz.
      - name: Senkronize et
        run: npx cap sync android

      # cap sync'in depodaki native projede kalıcı bir fark bırakmadığını kanıtla.
      # Bıraksaydı, her CI koşusu commit'lenmemiş bir değişiklikle derliyor
      # olurdu ve depodaki proje ile derlenen proje sessizce ayrışırdı.
      # İki ayrı soru, iki ayrı komut. "git diff" içerik farkını sorar ve satır
      # sonu filtrelerini uygular; "ls-files --others" yalnız takip edilmeyen ve
      # ignore edilmeyen dosyaları listeler. Burada "git status --porcelain"
      # kullanılmıyor: o ikisini birbirine karıştırır ve Windows'ta checkout
      # CRLF, cap sync LF yazdığı için içerik aynıyken bile dosyayı değişmiş
      # gösterir — CI'ı yanlış yerden kırardı.
      - name: Native projede fark yok
        run: |
          git diff --exit-code -- android || {
            echo "::error::cap sync android/ altında takipli dosyaları değiştirdi"; exit 1; }
          STRAY=$(git ls-files --others --exclude-standard -- android)
          if [ -n "$STRAY" ]; then
            echo "::error::cap sync takip edilmeyen dosya bıraktı:"; echo "$STRAY"; exit 1
          fi
          echo "android/ temiz"

      # variables.gradle artık depoda, yani bu adım şablonu değil kendi
      # dosyamızı denetliyor: elle düşürülmüş ya da yükseltme sırasında geri
      # gelmiş bir sürüm, Play'in 31 Ağustos 2026 sonrası reddettiği paketi
      # üretirdi. Kontrol derlemeden önce, çünkü asıl maliyet derlemek değil
      # yanlış paketi yüklemek.
      - name: SDK sürümlerini doğrula
        run: |
          cat android/variables.gradle
          grep -q 'compileSdkVersion = 36' android/variables.gradle || { echo "::error::compileSdkVersion 36 degil"; exit 1; }
          grep -q 'targetSdkVersion = 36'  android/variables.gradle || { echo "::error::targetSdkVersion 36 degil"; exit 1; }
          grep -q 'minSdkVersion = 24'     android/variables.gradle || { echo "::error::minSdkVersion 24 degil"; exit 1; }

      - name: APK derle
        run: chmod +x android/gradlew && cd android && ./gradlew assembleDebug --no-daemon --warning-mode all

      # Derleme başarılıysa APK'yı her hâlükârda sakla — doğrulama adımı
      # düşse bile paket elde kalsın, tanı için gerekiyor.
      - name: APK'yı yükle
        uses: actions/upload-artifact@v4
        with:
          name: menajer-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # Asıl kanıt gradle değişkeni değil, paketin kendisi.
      #
      # Doğrulama bilerek küçük adımlara bölündü ve adlar ne kontrol edildiğini
      # söylüyor: iş logları özel, ama adım adları ve sonuçları herkese açık
      # API'den okunabiliyor. Tek büyük adım düştüğünde hangi satırda kırıldığı
      # görünmüyordu; böyle, sonuç listesi tanının kendisi oluyor.
      - name: dogrula-1-aapt2-bulundu
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "SDK=$SDK"; ls -1 "$SDK/build-tools" || true
          AAPT2=$(find "$SDK" -name aapt2 -type f 2>/dev/null | sort -V | tail -1)
          echo "aapt2='$AAPT2'"
          test -n "$AAPT2"
          echo "AAPT2=$AAPT2" >> "$GITHUB_ENV"

      - name: dogrula-2-badging-alindi
        run: |
          "$AAPT2" dump badging android/app/build/outputs/apk/debug/app-debug.apk > badging.txt
          wc -l badging.txt
          grep -E "SdkVersion|sdkVersion|^package:" badging.txt || true

      - name: dogrula-3-targetSdk-36
        run: grep -q "targetSdkVersion:'36'" badging.txt

      # Yeni build-tools'un aapt2'si minSdk'yi "minSdkVersion:'24'" diye
      # yazıyor; eski biçim "sdkVersion:'24'" idi. Büyük/küçük harfe
      # duyarsız arama iki biçimi de yakalıyor.
      - name: dogrula-4-minSdk-24
        run: grep -qi "sdkVersion:'24'" badging.txt

      # Beklenen değer buraya sabit yazılmıyor, capacitor.config.json'dan
      # okunuyor. Sabit yazılsaydı kimliği değiştiren kişinin iki ayrı yeri
      # hatırlaması gerekirdi ve unutulan taraf sessizce yanlış olurdu; böyle,
      # kontrol "paket kimliği doğru mu" değil "üretilen paket yapılandırmanın
      # söylediği şey mi" diye soruyor — asıl cevabı istediğimiz soru bu.
      # applicationId gradle'da, appId config'de: ikisi ayrışırsa burada düşer.
      - name: dogrula-5-paket-ve-etiket
        run: |
          APPID=$(node -p "require('./capacitor.config.json').appId")
          APPNAME=$(node -p "require('./capacitor.config.json').appName")
          echo "beklenen paket='$APPID' etiket='$APPNAME'"
          grep -q "package: name='$APPID'" badging.txt || {
            echo "::error::APK paket kimliği capacitor.config.json ile uyuşmuyor"; exit 1; }
          grep -q "application-label:'$APPNAME'" badging.txt || {
            echo "::error::APK uygulama etiketi capacitor.config.json ile uyuşmuyor"; exit 1; }

      # Bağımsız ikinci kaynak: AGP'nin ürettiği birleştirilmiş manifest düz
      # XML. aapt2 tarafı ne olursa olsun bu her zaman çalışıyor ve sonucu
      # artifact olarak dışarı taşıyor.
      - name: dogrula-6-merged-manifest
        if: always()
        run: |
          M=$(find android/app/build/intermediates -name AndroidManifest.xml -path '*merged*' 2>/dev/null | head -1)
          echo "manifest=$M"
          test -n "$M"
          grep -o 'android:[a-zA-Z]*SdkVersion="[0-9]*"' "$M" | tee sdk-versions.txt
          grep -q 'android:targetSdkVersion="36"' "$M"
          grep -q 'android:minSdkVersion="24"' "$M"
          APPID=$(node -p "require('./capacitor.config.json').appId")
          grep -q "package=\"$APPID\"" "$M" || {
            echo "::error::birleştirilmiş manifest paket kimliği uyuşmuyor"; exit 1; }

      # Bugün paket saf Java/Kotlin: lib/ altında tek bir .so yok. Bu, 64-bit ve
      # 16 KB bellek sayfası şartlarının yapısal olarak karşılanmasının sebebi —
      # Play'in kuralı native kodu olmayan uygulamaları zaten uyumlu sayıyor.
      # Bir bağımlılık native kütüphane getirdiği gün bu adım düşer ve o gün
      # ELF hizalamasının (align 2**14) ölçülmesi gerekir.
      - name: dogrula-7-native-so-yok
        run: |
          unzip -l android/app/build/outputs/apk/debug/app-debug.apk > apk-list.txt
          wc -l apk-list.txt
          if grep -qE '\.so$| lib/' apk-list.txt; then
            echo "::error::APK içinde beklenmeyen native kütüphane var"
            grep -E '\.so$| lib/' apk-list.txt; exit 1
          fi
          echo "native kütüphane yok"

      # ===== RELEASE YAPILANDIRMASI =====
      #
      # Buraya kadar her şey DEBUG paketini ölçüyordu. Debug, release'in yanlış
      # olabileceği iki şeyi hiç görmüyor: release kaynak kümesinin derlenip
      # derlenmediğini ve ads-testcfg.js ayrımını (debug AEA test coğrafyası
      # taşır, release null taşımak zorundadır).
      #
      # Bu TAM PAKET DERLEMESİ DEĞİL, üç belirli Gradle görevi. Sebebi kasıtlı:
      # assembleRelease/bundleRelease/packageRelease, android/app/build.gradle
      # içindeki taskGraph kapısını tetikler ve keystore.properties yoksa düşer.
      # O kapı doğru — sessizce imzasız paket üretmemek için var — ve bu kontrol
      # uğruna zayıflatılmadı. Aşağıdaki görevler kapının desenine girmediği
      # için sırsız çalışıyor, yani PR doğrulaması upload keystore istemiyor.
      - name: release-1-gradle-gorevleri
        run: |
          cd android && ./gradlew --no-daemon --warning-mode all \
            :app:compileReleaseJavaWithJavac \
            :app:mergeReleaseAssets \
            :app:processReleaseMainManifest

      # isTesting:true burada hata SAYILMAZ: paket hâlâ bilerek test reklam
      # birimleriyle çalışıyor. Sorulan tek şey debug ayarının release'e
      # taşınmadığı.
      - name: release-2-yapilandirma
        run: node tools/check-release-config.js

      - name: dogrulama-ciktilarini-yukle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sdk-dogrulama
          path: |
            badging.txt
            sdk-versions.txt
            apk-list.txt
            android/variables.gradle
          if-no-files-found: warn

  # Kayıt katmanının testleri native derlemeden bağımsız; ayrı iş olarak
  # koşuyor ki APK derlemesi düşse bile sonucu görünür kalsın.
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Bağımlılıklar
        run: npm ci --foreground-scripts
      - name: Kayıt testleri
        run: node tools/savetest.js
