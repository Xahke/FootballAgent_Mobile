name: Android build

# Elle çalıştırılır (Actions sekmesi → Run workflow) ya da main'e push'ta.
# Amaç: Android Studio kurmadan indirilebilir bir APK üretmek.
on:
  workflow_dispatch:
  push:
    branches: [main, 'upgrade/**']

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Capacitor 8 → NodeJS 22 veya üstü
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # Capacitor 8 → Android Gradle Plugin 8.13 + Gradle 8.14 → JDK 21
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # Kilit dosyası depoda: npm ci onu birebir kuruyor, böylece CI derlemesi
      # tekrar üretilebilir oluyor. npm install olsaydı her koşu farklı yama
      # sürümü çekebilirdi.
      - name: Bağımlılıklar
        run: npm ci

      - name: Web varlıklarını hazırla
        run: npm run www

      # android/ artık depoda. Eskiden burada "cap add android" vardı ve proje
      # her koşuda şablondan yeniden üretiliyordu; native tarafa yazılan hiçbir
      # şey (imza, versionCode, manifest meta-data'sı, ikonlar) bir sonraki
      # derlemeye kadar yaşayamıyordu. Artık yalnız senkronizasyon var: cap sync
      # web varlıklarını ve üretilen dosyaları tazeler, gradle yapılandırmasına
      # dokunmaz.
      - name: Senkronize et
        run: npx cap sync android

      # cap sync'in depodaki native projede kalıcı bir fark bırakmadığını kanıtla.
      # Bıraksaydı, her CI koşusu commit'lenmemiş bir değişiklikle derliyor
      # olurdu ve depodaki proje ile derlenen proje sessizce ayrışırdı.
      - name: Native projede fark yok
        run: |
          git diff --exit-code -- android || {
            echo "::error::cap sync android/ altında takipli dosyaları değiştirdi"; exit 1; }
          UNTRACKED=$(git status --porcelain -uall -- android)
          if [ -n "$UNTRACKED" ]; then
            echo "::error::cap sync takip edilmeyen dosya bıraktı:"; echo "$UNTRACKED"; exit 1
          fi
          echo "android/ temiz"

      # variables.gradle artık depoda, yani bu adım şablonu değil kendi
      # dosyamızı denetliyor: elle düşürülmüş ya da yükseltme sırasında geri
      # gelmiş bir sürüm, Play'in 31 Ağustos 2026 sonrası reddettiği paketi
      # üretirdi. Kontrol derlemeden önce, çünkü asıl maliyet derlemek değil
      # yanlış paketi yüklemek.
      - name: SDK sürümlerini doğrula
        run: |
          cat android/variables.gradle
          grep -q 'compileSdkVersion = 36' android/variables.gradle || { echo "::error::compileSdkVersion 36 degil"; exit 1; }
          grep -q 'targetSdkVersion = 36'  android/variables.gradle || { echo "::error::targetSdkVersion 36 degil"; exit 1; }
          grep -q 'minSdkVersion = 24'     android/variables.gradle || { echo "::error::minSdkVersion 24 degil"; exit 1; }

      - name: APK derle
        run: chmod +x android/gradlew && cd android && ./gradlew assembleDebug --no-daemon --warning-mode all

      # Derleme başarılıysa APK'yı her hâlükârda sakla — doğrulama adımı
      # düşse bile paket elde kalsın, tanı için gerekiyor.
      - name: APK'yı yükle
        uses: actions/upload-artifact@v4
        with:
          name: menajer-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # Asıl kanıt gradle değişkeni değil, paketin kendisi.
      #
      # Doğrulama bilerek küçük adımlara bölündü ve adlar ne kontrol edildiğini
      # söylüyor: iş logları özel, ama adım adları ve sonuçları herkese açık
      # API'den okunabiliyor. Tek büyük adım düştüğünde hangi satırda kırıldığı
      # görünmüyordu; böyle, sonuç listesi tanının kendisi oluyor.
      - name: dogrula-1-aapt2-bulundu
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "SDK=$SDK"; ls -1 "$SDK/build-tools" || true
          AAPT2=$(find "$SDK" -name aapt2 -type f 2>/dev/null | sort -V | tail -1)
          echo "aapt2='$AAPT2'"
          test -n "$AAPT2"
          echo "AAPT2=$AAPT2" >> "$GITHUB_ENV"

      - name: dogrula-2-badging-alindi
        run: |
          "$AAPT2" dump badging android/app/build/outputs/apk/debug/app-debug.apk > badging.txt
          wc -l badging.txt
          grep -E "SdkVersion|sdkVersion|^package:" badging.txt || true

      - name: dogrula-3-targetSdk-36
        run: grep -q "targetSdkVersion:'36'" badging.txt

      # Yeni build-tools'un aapt2'si minSdk'yi "minSdkVersion:'24'" diye
      # yazıyor; eski biçim "sdkVersion:'24'" idi. Büyük/küçük harfe
      # duyarsız arama iki biçimi de yakalıyor.
      - name: dogrula-4-minSdk-24
        run: grep -qi "sdkVersion:'24'" badging.txt

      # Bağımsız ikinci kaynak: AGP'nin ürettiği birleştirilmiş manifest düz
      # XML. aapt2 tarafı ne olursa olsun bu her zaman çalışıyor ve sonucu
      # artifact olarak dışarı taşıyor.
      - name: dogrula-5-merged-manifest
        if: always()
        run: |
          M=$(find android/app/build/intermediates -name AndroidManifest.xml -path '*merged*' 2>/dev/null | head -1)
          echo "manifest=$M"
          test -n "$M"
          grep -o 'android:[a-zA-Z]*SdkVersion="[0-9]*"' "$M" | tee sdk-versions.txt
          grep -q 'android:targetSdkVersion="36"' "$M"
          grep -q 'android:minSdkVersion="24"' "$M"

      # Bugün paket saf Java/Kotlin: lib/ altında tek bir .so yok. Bu, 64-bit ve
      # 16 KB bellek sayfası şartlarının yapısal olarak karşılanmasının sebebi —
      # Play'in kuralı native kodu olmayan uygulamaları zaten uyumlu sayıyor.
      # Bir bağımlılık native kütüphane getirdiği gün bu adım düşer ve o gün
      # ELF hizalamasının (align 2**14) ölçülmesi gerekir.
      - name: dogrula-6-native-so-yok
        run: |
          unzip -l android/app/build/outputs/apk/debug/app-debug.apk > apk-list.txt
          wc -l apk-list.txt
          if grep -qE '\.so$| lib/' apk-list.txt; then
            echo "::error::APK içinde beklenmeyen native kütüphane var"
            grep -E '\.so$| lib/' apk-list.txt; exit 1
          fi
          echo "native kütüphane yok"

      - name: dogrulama-ciktilarini-yukle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sdk-dogrulama
          path: |
            badging.txt
            sdk-versions.txt
            apk-list.txt
            android/variables.gradle
          if-no-files-found: warn

  # Kayıt katmanının testleri native derlemeden bağımsız; ayrı iş olarak
  # koşuyor ki APK derlemesi düşse bile sonucu görünür kalsın.
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Bağımlılıklar
        run: npm ci
      - name: Kayıt testleri
        run: node tools/savetest.js
