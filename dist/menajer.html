<!DOCTYPE html>
<html lang="tr" data-theme="dosya">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#f7f8f9">
<meta name="description" content="Futbolcu menajerliği simülasyonu — genç yetenekleri bul, geliştir, kariyerlerini yönet.">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Menajer">
<title>Menajer</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png" sizes="192x192">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
/* OTOMATİK ÜRETİLDİ — bu dosyayı elle düzenleme.
   Kaynak: css/themes/saha.css, css/themes/gazete.css, css/themes/terminal.css, css/themes/dosya.css
   Yeniden üretmek için: node tools/build-themes.js
   Tema, <html data-theme="..."> ile seçilir (js/ui.js → applyTheme). */
/* ===== tema: saha ===== */
html[data-theme="saha"]{
  --bg:#0b111e;             
  --bg2:#0e1526;
  --sur:#131b2e;            
  --sur2:#1a2439;           
  --sur3:#233049;           
  --sur4:#2c3b59;
  --line:rgba(148,168,205,.10);
  --line2:rgba(148,168,205,.20);
  --txt:#edf2fa; --txt2:#a7b3c9; --txt3:#66738d;
  --acc:#1ec97e; --accD:#12a866; --accT:#04160c;
  --acc-soft:rgba(30,201,126,.12);
  --blue:#4d9fff; --blue-soft:rgba(77,159,255,.12);
  --gold:#e9bc5a; --gold-soft:rgba(233,188,90,.12);
  --warn:#e6a23c; --warn-soft:rgba(230,162,60,.12);
  --bad:#f0555d;  --bad-soft:rgba(240,85,93,.12);
  --r:16px; --r-s:12px;
  --sh:0 2px 10px rgba(3,7,15,.45);
  --sh-el:0 6px 22px rgba(3,7,15,.55);
  --tap:.15s cubic-bezier(.3,.7,.4,1);

   
  --sk-hub:var(--txt2); --sk-tb:#4d9fff; --sk-fd:#1ec97e; --sk-ag:#e9bc5a; --sk-nw:#b07cf0;

   
  --map-sea:#070c17; --map-land:#131d33; --map-fog:#0e1526; --map-coast:#23314e;
}
html[data-theme="saha"] *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html[data-theme="saha"]{scrollbar-width:thin;scrollbar-color:var(--sur3) transparent}
html[data-theme="saha"] body{background:var(--bg);color:var(--txt);
  background-image:radial-gradient(900px 340px at 50% -120px,rgba(30,201,126,.07),transparent 70%),
                   radial-gradient(700px 500px at 110% 10%,rgba(77,159,255,.045),transparent 60%);
  background-attachment:fixed;
  font-family:-apple-system,'Segoe UI',Roboto,Helvetica,sans-serif;
  font-size:14.5px;line-height:1.45;max-width:520px;margin:0 auto;min-height:100vh;padding-bottom:92px}
html[data-theme="saha"] b,html[data-theme="saha"] strong{font-weight:700}
html[data-theme="saha"] .num{font-variant-numeric:tabular-nums}
html[data-theme="saha"] header{position:sticky;top:0;z-index:60;background:rgba(11,17,30,.82);backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);padding:9px 12px}
html[data-theme="saha"] .hrow{display:flex;align-items:center;gap:8px}
html[data-theme="saha"] .hback{width:36px;height:36px;border-radius:11px;background:var(--sur2);border:none;color:var(--txt);
  font-size:19px;cursor:pointer;display:none;align-items:center;justify-content:center;flex-shrink:0}
html[data-theme="saha"] .hback.show{display:flex}
html[data-theme="saha"] .hback:active{transform:scale(.92)}
html[data-theme="saha"] .htitle{flex:1;min-width:0}
html[data-theme="saha"] .htitle .t1{font-size:15px;font-weight:800;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
html[data-theme="saha"] .htitle .t2{font-size:10.5px;color:var(--txt3);margin-top:1px;font-variant-numeric:tabular-nums;font-weight:600;
  text-transform:uppercase;letter-spacing:.05em}
html[data-theme="saha"] .hstat{display:flex;align-items:center;gap:5px;background:var(--sur2);border-radius:10px;
  padding:6px 9px;flex-shrink:0;line-height:1}
html[data-theme="saha"] .hstat svg{width:13px;height:13px;flex-shrink:0}
html[data-theme="saha"] .hstat .v{font-size:12.5px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
html[data-theme="saha"] .hstat .l{display:none}
html[data-theme="saha"] .hstat.cash svg{color:var(--acc)}
html[data-theme="saha"] .hstat.rep svg{color:var(--gold)}
html[data-theme="saha"] #btnNext{background:linear-gradient(160deg,var(--acc),var(--accD));color:var(--accT);border:none;border-radius:11px;
  padding:0 15px;height:36px;font-weight:800;font-size:13px;cursor:pointer;flex-shrink:0;font-family:inherit;
  letter-spacing:.01em;box-shadow:0 3px 12px rgba(30,201,126,.28);transition:transform var(--tap)}
html[data-theme="saha"] #btnNext:active{transform:scale(.94)}
html[data-theme="saha"] .langbtn{background:none;border:none;color:var(--txt3);font-size:10.5px;font-weight:800;cursor:pointer;
  padding:4px 2px;letter-spacing:.05em;font-family:inherit}
html[data-theme="saha"] nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:520px;z-index:60;
  padding:0 10px calc(10px + env(safe-area-inset-bottom));pointer-events:none}
html[data-theme="saha"] nav .navin{pointer-events:auto;display:flex;background:rgba(19,27,46,.96);border:1px solid var(--line);
  border-radius:20px;padding:7px 6px;box-shadow:var(--sh-el)}
html[data-theme="saha"] nav button{flex:1;background:none;border:none;color:var(--txt3);font-size:9.5px;font-weight:700;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;gap:3px;padding:2px 0;position:relative;
  letter-spacing:.02em;font-family:inherit;transition:color var(--tap)}
html[data-theme="saha"] nav button .icw{width:44px;height:27px;display:flex;align-items:center;justify-content:center;
  border-radius:13px;transition:background var(--tap)}
html[data-theme="saha"] nav button svg{width:20px;height:20px;transition:transform var(--tap)}
html[data-theme="saha"] nav button.on{color:var(--acc)}
html[data-theme="saha"] nav button.on .icw{background:var(--acc-soft)}
html[data-theme="saha"] nav button:active svg{transform:scale(.88)}
html[data-theme="saha"] nav .nbadge{position:absolute;top:-3px;right:20%;background:var(--bad);color:#fff;font-size:9px;font-weight:800;
  border-radius:9px;min-width:17px;height:17px;padding:0 4px;display:flex;align-items:center;justify-content:center;
  border:2px solid var(--sur);box-shadow:0 2px 6px rgba(240,85,93,.4)}
html[data-theme="saha"] main{padding:14px 14px 20px}
html[data-theme="saha"] #view.vin{animation:vIn__saha .18s ease}
@keyframes vIn__saha{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
html[data-theme="saha"] .card{background:var(--sur);border:none;border-radius:var(--r);padding:15px;margin-bottom:12px;box-shadow:var(--sh)}
html[data-theme="saha"] .card.tight{padding:6px 14px}
html[data-theme="saha"] .list{background:linear-gradient(180deg,var(--sur2),var(--sur));border:none;border-radius:var(--r);
  overflow:hidden;margin-bottom:12px;box-shadow:var(--sh)}
html[data-theme="saha"] .hero{background:linear-gradient(155deg,#182541 0%,#111a2e 55%,#0f1728 100%);
  border:none;border-radius:18px;padding:18px 16px;margin-bottom:12px;position:relative;overflow:hidden;
  box-shadow:var(--sh-el)}
html[data-theme="saha"] .hero::before{content:'';position:absolute;left:0;right:0;top:0;height:2px;
  background:linear-gradient(90deg,transparent,rgba(30,201,126,.65),transparent)}
html[data-theme="saha"] .hero .stripe{position:absolute;left:0;top:0;bottom:0;width:4px;opacity:.9}
html[data-theme="saha"] .hero .hname{font-size:20px;font-weight:800;letter-spacing:-.02em}
html[data-theme="saha"] .hero .hsub{font-size:12px;color:var(--txt2);margin-top:3px;font-variant-numeric:tabular-nums}
html[data-theme="saha"] .sect{font-size:10.5px;color:var(--txt3);text-transform:uppercase;letter-spacing:.1em;font-weight:800;margin-bottom:11px;
  position:relative;padding-left:11px}
html[data-theme="saha"] .sect::before{content:'';position:absolute;left:0;top:50%;transform:translateY(-50%);
  width:3px;height:11px;border-radius:2px;background:var(--acc)}
html[data-theme="saha"] .row{display:flex;align-items:center;gap:10px}
html[data-theme="saha"] .spacer{flex:1}
html[data-theme="saha"] .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
html[data-theme="saha"] .grid3{display:grid;grid-template-columns:1fr 1fr 1fr}
html[data-theme="saha"] .grid4{display:grid;grid-template-columns:repeat(4,1fr)}
html[data-theme="saha"] .stat{text-align:center;padding:4px 2px}
html[data-theme="saha"] .stat .v{font-size:16.5px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
html[data-theme="saha"] .stat .l{font-size:9px;color:var(--txt3);margin-top:3px;text-transform:uppercase;letter-spacing:.07em;font-weight:700}
html[data-theme="saha"] .sub{color:var(--txt2);font-size:12px}
html[data-theme="saha"] .faint{color:var(--txt3)}
html[data-theme="saha"] h2.sec{font-size:17px;font-weight:800;margin:2px 0 12px;letter-spacing:-.02em}
html[data-theme="saha"] .divider{height:1px;background:var(--line);margin:13px 0}
html[data-theme="saha"] .kv{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line);font-size:13px;gap:10px}
html[data-theme="saha"] .kv:last-child{border-bottom:none}
html[data-theme="saha"] .kv .k{color:var(--txt2)}
html[data-theme="saha"] .kv .v{font-weight:700;font-variant-numeric:tabular-nums;text-align:right}
html[data-theme="saha"] .empty{text-align:center;color:var(--txt3);padding:30px 14px;font-size:13px;line-height:1.6}
html[data-theme="saha"] .estate{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;padding:30px 18px}
html[data-theme="saha"] .estate svg{width:34px;height:34px;color:var(--txt3);opacity:.8}
html[data-theme="saha"] .estate b{font-size:14.5px;color:var(--txt);font-weight:800}
html[data-theme="saha"] .estate span{font-size:12px;color:var(--txt3);max-width:250px;line-height:1.55}
html[data-theme="saha"] .tb{border-radius:9px;display:flex;align-items:center;justify-content:center;font-weight:800;flex-shrink:0;
  letter-spacing:.02em;position:relative;overflow:hidden;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.09),0 2px 6px rgba(0,0,0,.35)}
html[data-theme="saha"] .tb i{position:absolute;left:0;right:0;bottom:0;height:22%;font-style:normal}
html[data-theme="saha"] .pitem{display:flex;align-items:center;gap:11px;padding:11px 13px;cursor:pointer;border-bottom:1px solid var(--line);
  position:relative;transition:background var(--tap)}
html[data-theme="saha"] .pitem:last-child{border-bottom:none}
html[data-theme="saha"] .pitem:active{background:var(--sur3)}
html[data-theme="saha"] .pitem.mine{background:linear-gradient(90deg,rgba(30,201,126,.06),transparent 45%)}
html[data-theme="saha"] .pitem.mine::before{content:'';position:absolute;left:0;top:10px;bottom:10px;width:3px;border-radius:0 2px 2px 0;
  background:var(--acc);opacity:.85}
html[data-theme="saha"] .pinfo{flex:1;min-width:0}
html[data-theme="saha"] .pname{font-weight:700;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.01em;
  display:flex;align-items:center;gap:5px}
html[data-theme="saha"] .psub{font-size:11px;color:var(--txt3);margin-top:2.5px;font-variant-numeric:tabular-nums}
html[data-theme="saha"] .rt{font-weight:800;font-size:13.5px;min-width:34px;text-align:center;padding:6px 0;border-radius:10px;
  flex-shrink:0;font-variant-numeric:tabular-nums;color:#fff;letter-spacing:-.01em}
html[data-theme="saha"] .rt.g{background:linear-gradient(160deg,#1ec97e,#0e9c60);box-shadow:0 2px 8px rgba(30,201,126,.25)}
html[data-theme="saha"] .rt.y{background:linear-gradient(160deg,#e6a23c,#c07c10);box-shadow:0 2px 8px rgba(230,162,60,.22)}
html[data-theme="saha"] .rt.o{background:linear-gradient(160deg,#f0555d,#c73940);box-shadow:0 2px 8px rgba(240,85,93,.22)}
html[data-theme="saha"] .mood{width:4px;height:24px;border-radius:3px;flex-shrink:0;background:var(--sur3);position:relative;overflow:hidden}
html[data-theme="saha"] .mood i{position:absolute;left:0;right:0;bottom:0;border-radius:3px;transition:height .25s ease}
html[data-theme="saha"] .star{color:var(--gold);font-size:11px;flex-shrink:0}
html[data-theme="saha"] .gem{width:12px;height:12px;color:var(--gold);flex-shrink:0;filter:drop-shadow(0 0 3px rgba(233,188,90,.5))}
html[data-theme="saha"] .natc{font-size:8.5px;font-weight:800;color:var(--txt3);letter-spacing:.05em;flex-shrink:0}
html[data-theme="saha"] .bigrt{width:60px;height:60px;border-radius:16px;display:flex;flex-direction:column;align-items:center;
  justify-content:center;flex-shrink:0;background:linear-gradient(160deg,var(--sur3),var(--sur2));
  box-shadow:inset 0 0 0 1px var(--line2),0 4px 12px rgba(0,0,0,.4)}
html[data-theme="saha"] .bigrt .n{font-size:23px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
html[data-theme="saha"] .bigrt .l{font-size:7.5px;color:var(--txt3);text-transform:uppercase;margin-top:3px;letter-spacing:.09em;font-weight:800}
html[data-theme="saha"] .bigrt.g{background:linear-gradient(160deg,rgba(30,201,126,.22),rgba(14,156,96,.10));box-shadow:inset 0 0 0 1px rgba(30,201,126,.35)}
html[data-theme="saha"] .bigrt.g .n{color:var(--acc)}
html[data-theme="saha"] .bigrt.y{background:linear-gradient(160deg,rgba(230,162,60,.2),rgba(192,124,16,.08));box-shadow:inset 0 0 0 1px rgba(230,162,60,.32)}
html[data-theme="saha"] .bigrt.y .n{color:var(--warn)}
html[data-theme="saha"] .bigrt.o{background:linear-gradient(160deg,rgba(240,85,93,.2),rgba(199,57,64,.08));box-shadow:inset 0 0 0 1px rgba(240,85,93,.32)}
html[data-theme="saha"] .bigrt.o .n{color:var(--bad)}
html[data-theme="saha"] table{width:100%;border-collapse:collapse;font-size:12.5px;font-variant-numeric:tabular-nums}
html[data-theme="saha"] th{color:var(--txt3);font-size:9px;text-transform:uppercase;letter-spacing:.08em;text-align:left;
  padding:9px 5px;border-bottom:1px solid var(--line);font-weight:800}
html[data-theme="saha"] th.c,html[data-theme="saha"] td.c{text-align:center}
html[data-theme="saha"] td{padding:8.5px 5px;border-bottom:1px solid var(--line)}
html[data-theme="saha"] tr.click{cursor:pointer}
html[data-theme="saha"] tr.click:active td{background:var(--sur3)}
html[data-theme="saha"] tr.hl td{background:rgba(30,201,126,.06)}
html[data-theme="saha"] tr:last-child td{border-bottom:none}
html[data-theme="saha"] .posn{font-weight:700;width:20px;display:inline-flex;align-items:center;justify-content:center;color:var(--txt3);
  position:relative;font-variant-numeric:tabular-nums}
html[data-theme="saha"] tr .posn.zone1,html[data-theme="saha"] tr .posn.zone2,html[data-theme="saha"] tr .posn.zoneR{border-radius:6px;width:20px;height:20px;font-size:11px;color:#fff}
html[data-theme="saha"] .posn.zone1{background:linear-gradient(160deg,var(--gold),#c99334)}
html[data-theme="saha"] .posn.zone2{background:linear-gradient(160deg,var(--blue),#2e77d0)}
html[data-theme="saha"] .posn.zoneR{background:linear-gradient(160deg,var(--bad),#c73940)}
html[data-theme="saha"] .top3 td{background:rgba(233,188,90,.05)}
html[data-theme="saha"] .tabs{display:flex;gap:0;margin-bottom:12px;background:none;border:none;border-bottom:1px solid var(--line);
  padding:0;overflow-x:auto;scrollbar-width:none}
html[data-theme="saha"] .tabs::-webkit-scrollbar{display:none}
html[data-theme="saha"] .tabs button{flex:1;background:none;border:none;color:var(--txt3);border-radius:0;
  padding:9px 10px 9px;font-size:11.5px;cursor:pointer;white-space:nowrap;font-weight:800;font-family:inherit;
  position:relative;letter-spacing:.02em;transition:color var(--tap)}
html[data-theme="saha"] .tabs button.on{color:var(--txt)}
html[data-theme="saha"] .tabs button.on::after{content:'';position:absolute;left:22%;right:22%;bottom:-1px;height:2.5px;border-radius:2px;
  background:var(--acc);box-shadow:0 0 8px rgba(30,201,126,.5)}
html[data-theme="saha"] .chips{display:flex;gap:6px;margin-bottom:11px;flex-wrap:wrap}
html[data-theme="saha"] .chips button{background:var(--sur2);border:none;color:var(--txt2);border-radius:16px;
  padding:6.5px 13px;font-size:11.5px;cursor:pointer;white-space:nowrap;font-weight:700;font-family:inherit;
  transition:all var(--tap)}
html[data-theme="saha"] .chips button:active{transform:scale(.95)}
html[data-theme="saha"] .chips button.on{background:var(--acc-soft);color:var(--acc);box-shadow:inset 0 0 0 1px rgba(30,201,126,.4)}
html[data-theme="saha"] .btn{border:none;border-radius:12px;padding:12px 14px;font-weight:800;font-size:13px;cursor:pointer;
  width:100%;font-family:inherit;letter-spacing:0;transition:transform var(--tap),opacity var(--tap)}
html[data-theme="saha"] .btn:active:not(:disabled){transform:scale(.97)}
html[data-theme="saha"] .btn.p{background:linear-gradient(160deg,var(--acc),var(--accD));color:var(--accT);
  box-shadow:0 3px 14px rgba(30,201,126,.25)}
html[data-theme="saha"] .btn.b{background:var(--sur3);color:var(--txt)}
html[data-theme="saha"] .btn.s{background:none;color:var(--txt2);box-shadow:inset 0 0 0 1px var(--line2)}
html[data-theme="saha"] .btn.d{background:var(--bad-soft);color:var(--bad)}
html[data-theme="saha"] .btn:disabled{opacity:.42;cursor:default}
html[data-theme="saha"] .modal{position:fixed;inset:0;background:rgba(4,8,16,.7);z-index:100;display:none;align-items:flex-end;justify-content:center}
html[data-theme="saha"] .modal.open{display:flex}
html[data-theme="saha"] .sheet{background:linear-gradient(180deg,var(--sur2),var(--sur));border-radius:22px 22px 0 0;width:100%;max-width:520px;
  max-height:88vh;overflow-y:auto;padding:12px 16px calc(22px + env(safe-area-inset-bottom));
  box-shadow:0 -10px 40px rgba(0,0,0,.6)}
html[data-theme="saha"] .sheet.sin{animation:sheetIn__saha .22s cubic-bezier(.2,.8,.3,1)}
@keyframes sheetIn__saha{from{opacity:.4;transform:translateY(26px)}to{opacity:1;transform:none}}
html[data-theme="saha"] .sheet h2{font-size:16.5px;font-weight:800;letter-spacing:-.01em}
html[data-theme="saha"] .handle{width:38px;height:4px;background:var(--sur4);border-radius:2px;margin:0 auto 14px}
html[data-theme="saha"] .negbox{background:var(--bg2);border:none;border-radius:var(--r-s);padding:14px;margin:12px 0;
  box-shadow:inset 0 0 0 1px var(--line)}
html[data-theme="saha"] .roundPill{display:inline-flex;align-items:center;background:var(--sur3);color:var(--txt2);border-radius:9px;
  padding:3px 9px;font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase}
html[data-theme="saha"] .counterCard{margin-top:12px;padding:11px 13px;background:var(--warn-soft);border-radius:11px;font-size:12.5px;
  box-shadow:inset 0 0 0 1px rgba(230,162,60,.3);animation:vIn__saha .2s ease}
html[data-theme="saha"] input[type=range]{width:100%;accent-color:var(--acc);margin-top:8px;height:26px}
html[data-theme="saha"] .moodbar{height:8px;border-radius:5px;background:var(--bg2);overflow:hidden;margin-top:8px;
  box-shadow:inset 0 0 0 1px var(--line)}
html[data-theme="saha"] .moodbar div{height:100%;border-radius:5px;transition:width .28s ease,background .28s ease}
html[data-theme="saha"] .attr{margin-bottom:11px}
html[data-theme="saha"] .attr:last-child{margin-bottom:2px}
html[data-theme="saha"] .attr .arow{display:flex;justify-content:space-between;font-size:11.5px;margin-bottom:5px}
html[data-theme="saha"] .attr .arow b{font-variant-numeric:tabular-nums;font-weight:800}
html[data-theme="saha"] .abar{height:6px;border-radius:4px;background:var(--bg2);overflow:hidden;box-shadow:inset 0 0 0 1px var(--line)}
html[data-theme="saha"] .abar div{height:100%;border-radius:4px;transition:width .3s ease}
html[data-theme="saha"] .tag{display:inline-flex;align-items:center;gap:4px;font-size:10px;font-weight:800;padding:3.5px 9px;border-radius:8px;
  margin:0 5px 5px 0;letter-spacing:.02em}
html[data-theme="saha"] .tag.pos{background:var(--blue-soft);color:var(--blue)}
html[data-theme="saha"] .tag.w{background:var(--warn-soft);color:var(--warn)}

html[data-theme="gazete"]{
   
  --n0:#faf8f4; --n1:#f4f1ea; --n2:#ece8df; --n3:#ded9cd;
  --n4:#c4bdad; --n5:#8c877a; --n6:#5d594f; --n7:#33312b; --n8:#1a1916;

  --bg:var(--n0); --bg2:var(--n1);
  --sur:var(--n0); --sur2:var(--n1); --sur3:var(--n2); --sur4:var(--n3);
  --line:#e2ddd2; --line2:#cec8ba;
  --txt:var(--n8); --txt2:var(--n6); --txt3:var(--n5);

   
  --acc:#1f6b4a; --accD:#17553a; --accT:#faf8f4;
  --acc-soft:#e6efe9;
  --bad:#a3271c;  --bad-soft:#f4e6e3;
  --warn:#7d6320; --warn-soft:#f1ebda;
  --blue:var(--n7); --blue-soft:var(--n2);
  --gold:var(--n8); --gold-soft:var(--n2);

  --r:6px; --r-s:4px;
  --sh:none; --sh-el:none;
  --tap:.12s ease;
  --sans:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;
  --serif:Georgia,'Iowan Old Style','Times New Roman',serif;

   
  --sk-hub:var(--n7); --sk-tb:#3a5a76; --sk-fd:#1f6b4a; --sk-ag:#7d6320; --sk-nw:#a3271c;

   
  --map-sea:#e5dfd1; --map-land:#dcd5c5; --map-fog:#ebe6da; --map-coast:#bfb7a4;
}

html[data-theme="dosya"]{
  --n0:#ffffff; --n1:#f7f8f9; --n2:#eef0f2; --n3:#e2e5e8;

let L='tr';
const t=k=>STR[L][k]||k;
/* inline links inside news: player → profile, team → team page, league → standings, cup → bracket */
function goLg(i){S.curLg=i;S.curCtry=LEAGUES[i].ctry;S.curCon=LEAGUES[i].con;S.ltab='table';S.vSe=undefined;navTo('league');}
function goCup(i){S.curCon='cup';S.curCup=i;navTo('league');}
const lkP=(id,n)=>id!==undefined?`<span class="lnk" onclick="pushV('player',${id})">${n}</span>`:n;
const lkT=(id,n)=>id!==undefined?`<span class="lnk" onclick="pushV('team',${id})">${n}</span>`:n;
const lkL=(i,n)=>i!==undefined?`<span class="lnk" onclick="goLg(${i})">${n}</span>`:n;
const lkC=(ci,n)=>ci!==undefined?`<span class="lnk" onclick="goCup(${ci})">${n}</span>`:n;
/* Rakip ajans adı → ajans sayfası. Çok eski kayıtlarda ajans olmayabilir; o zaman
   haber yine okunabilir olsun diye düz metne düşüyor. */
const lkR=(ri,n)=>ri!==undefined&&n?`<span class="lnk" onclick="pushV('rival',${ri})">${n}</span>`:(n||'');

/* js/saves.js — kayıt yuvaları ve cihaz tercihleri.

   Neden ayrı bir katman:

   1) Ana menü üç yuvayı da özetlemek zorunda, ama tam kayıt ~7000 oyuncu tutuyor.
      Menüyü her açışta üç kaydı da ayrıştırmak telefonda gözle görülür bir
      bekleme demekti. Bu yüzden her yazışta küçük bir özet ayrı bir anahtara
      düşüyor; menü yalnızca onu okuyor. Yuva sayısı artarsa maliyet değişmez.

   2) Tema, dil ve ses artık kayıttan bağımsız. Ana menüde açık bir kariyer yok —
      S null — ama Ayarlar oradan da açılabilmeli. Cihaza ait olan bu üç tercih
      PREFS'e taşındı. Kariyere ait olanlar (hafta raporu, olaylar) S'de kaldı.

   Eski tek kayıtlı sürümden gelenler 1. yuvaya devredilir; kimsenin ilerlemesi
   silinmez. */
const SLOTS=3;
const LEGACYKEY='menajerSaveV9';        // tek kayıtlı sürümün anahtarı
const SLOTKEY=n=>'menajerSaveV9s'+n;
const METAKEY='menajerMetaV1';
const PREFKEY='menajerPrefsV1';
/* 0 = açık kariyer yok (ana menüdeyiz). save() nereye yazacağını buradan bilir. */
let curSlot=0;
/* Kullanıcı depolamayı kapatmış ya da kota dolmuş olabilir — hiçbiri oyunu
   çökertmemeli, kayıt sessizce başarısız olur. */
function lsGet(k){try{return localStorage.getItem(k);}catch(e){return null;}}
function lsSet(k,v){try{localStorage.setItem(k,v);return true;}catch(e){return false;}}
function lsDel(k){try{localStorage.removeItem(k);}catch(e){}}
function jparse(s){try{return JSON.parse(s);}catch(e){return null;}}
/* ================= CİHAZ TERCİHLERİ ================= */
let PREFS=jparse(lsGet(PREFKEY))||{};
function savePrefs(){lsSet(PREFKEY,JSON.stringify(PREFS));}
function pref(k,d){return PREFS[k]===undefined?d:PREFS[k];}
function setPref(k,v){PREFS[k]=v;savePrefs();}
/* dil tercihi kayıttan önce gelir: menü daha S yüklenmeden doğru dilde açılmalı */
if(PREFS.lang)L=PREFS.lang;
/* ================= YUVA ÖZETLERİ ================= */
function readMeta(){return jparse(lsGet(METAKEY))||{};}
function writeMeta(m){lsSet(METAKEY,JSON.stringify(m));}
function allMeta(){return readMeta();}                 // menü tek okumayla dönsün
function slotMeta(n){return readMeta()['s'+n]||null;}
function slotUsed(n){return !!slotMeta(n);}
function anySlot(){const m=readMeta();for(let n=1;n<=SLOTS;n++)if(m['s'+n])return true;return false;}
/* Özet menüde gösterilen her şeyi taşır; tam kaydı açmaya gerek kalmaz.
   totalWeeks() global S'yi okuduğu için burada fikstürden yeniden hesaplanıyor —
   bu fonksiyon her zaman kendisine verilen duruma bakmalı. */
function metaOf(st){
  const tw=(st.fx&&st.fx.length)?Math.max.apply(null,st.fx.map(f=>f.length)):st.week;
  return {agent:st.agent?(st.agent.fn+' '+st.agent.ln):'',
          agency:st.agent?st.agent.agency:'',
          season:st.season,week:Math.min(st.week,tw),
          cash:st.cash,rep:Math.round(st.rep),
          clients:(st.clients||[]).length,
          ts:Date.now()};
}
/* ================= YUVA İŞLEMLERİ ================= */
/* Kayıt biçimi eski sürümle aynı: {S,PID}. Yalnızca anahtar yuvaya göre değişiyor. */
function validSave(d){return !!(d&&d.S&&d.S.players&&d.S.fx&&d.S.fx.length===LEAGUES.length);}
function saveToSlot(n){
  if(!n||typeof S==='undefined'||!S)return false;
  if(!lsSet(SLOTKEY(n),JSON.stringify({S,PID})))return false;
  const m=readMeta();m['s'+n]=metaOf(S);writeMeta(m);
  return true;
}
function loadSlot(n){
  const d=jparse(lsGet(SLOTKEY(n)));
  if(!validSave(d)){
    /* özet var ama kayıt bozuk/eksik: yuvayı boş göster, menü yalan söylemesin */
    const m=readMeta();if(m['s'+n]){delete m['s'+n];writeMeta(m);}
    return false;
  }
  S=d.S;PID=d.PID;curSlot=n;
  /* Dil cihaz tercihi; yoksa kaydın kendi dili devralınır (eski kayıtlar). */
  L=PREFS.lang||S.lang||'tr';
  return true;
}
function deleteSlot(n){
  lsDel(SLOTKEY(n));
  const m=readMeta();delete m['s'+n];writeMeta(m);
  if(curSlot===n){curSlot=0;S=null;}
}
/* ================= ESKİ KAYDIN DEVRİ =================
   Tek kayıtlı sürümden güncelleyen oyuncu ana menüde kariyerini 1. yuvada bulur.
   Yazma başarısız olursa eski anahtar silinmez — ilerleme kaybolmaktansa iki kez
   denenmesi yeğdir. */
function migrateLegacy(){
  const raw=lsGet(LEGACYKEY);
  if(!raw)return false;
  if(lsGet(SLOTKEY(1))){lsDel(LEGACYKEY);return false;}   // yuva zaten dolu
  const d=jparse(raw);
  if(!validSave(d)){lsDel(LEGACYKEY);return false;}
  if(!lsSet(SLOTKEY(1),raw))return false;
  const m=readMeta();m.s1=metaOf(d.S);writeMeta(m);
  /* Cihaz tercihleri o güne dek kaydın içindeydi; ilk kez dışarı taşınıyor. */
  if(PREFS.theme===undefined&&d.S.theme)PREFS.theme=d.S.theme;
  if(PREFS.lang===undefined&&d.S.lang)PREFS.lang=d.S.lang;
  if(PREFS.sfxOn===undefined&&d.S.sfxOn!==undefined)PREFS.sfxOn=d.S.sfxOn;
  savePrefs();
  if(PREFS.lang)L=PREFS.lang;
  lsDel(LEGACYKEY);
  return true;
}

/* js/atlas.js — keşif ağı haritası.

   Oyunun keşif birimi lig; harita ise BÖLGE gösteriyor. 22 lig 16 bölgeye
   düşüyor (altı ülkenin iki kademesi var, bkz. LEAGUES[].ctry). Bir bölgenin
   işareti tektir, satın alma ligler üzerinden yürür.

   ===== tek doğruluk kaynağı =====
   Bölge durumu hiçbir yerde saklanmıyor. S.known lig indekslerini tutmaya devam
   ediyor — kayıt biçimi bu — ve buradaki her şey ondan türetiliyor. Bu dosya
   duruma yazmaz, yalnız okur.

   ===== coğrafya oynanışı kısıtlamaz =====
   Harita saf bir sunum katmanı. Keşfedilmemiş her lig, parası yetiyorsa,
   dünyanın neresinde olursa olsun satın alınabilir; komşuluk koşulu yok.
   Bu yüzden "ulaşılamaz bölge" diye bir durum da yok — olsaydı ekran yalan
   söylerdi. Bölge renkleri yalnızca ne kadar ilerlediğini anlatıyor:

     full     bölgedeki tüm ligler keşfedildi
     partial  bir kısmı keşfedildi, alınacak lig kaldı
     scouting bölgede ağ kurulumu sürüyor
     open     hiçbir ligi keşfedilmedi — alınmayı bekliyor

   Kamera (kaydırma/yakınlaştırma) modül değişkeninde duruyor, S'ye yazılmıyor:
   oturuma ait bir görünüm ayarı, kaydın parçası değil. */

/* ===== lig ↔ bölge =====
   Bölge listesi LEAGUES'ten türetiliyor: veri iki yerde durmasın. */
let ATL_CACHE=null;
function atlCache(){
  if(ATL_CACHE)return ATL_CACHE;
  const byTerr={}, order=[];
  LEAGUES.forEach((l,i)=>{
    if(!byTerr[l.ctry]){byTerr[l.ctry]=[];order.push(l.ctry);}
    byTerr[l.ctry].push(i);
  });
  ATL_CACHE={byTerr,order};
  return ATL_CACHE;
}
function terrList(){return atlCache().order;}
function terrOf(i){const l=LEAGUES[i];return l?l.ctry:null;}
function terrLeagues(c){return atlCache().byTerr[c]||[];}
function terrName(c){return CTRYS[c]?CTRYS[c][L]:c;}

/* ===== türetilmiş durum ===== */
function terrDiscovered(c){return terrLeagues(c).some(i=>knownLg(i));}
function terrRemaining(c){return terrLeagues(c).filter(i=>!knownLg(i));}
/* "Açık" = alınacak ligi var. Coğrafi bir koşul değil. */
function terrOpen(c){return terrRemaining(c).length>0;}
function terrScouting(c){return terrLeagues(c).some(i=>scoutPending(i));}
/* Sıra önemli. fog en sonda duruyor ve bugünkü veriyle hiç çalışmıyor: on altı
   bölgenin hepsinin en az bir ligi var. Yine de duruyor — haritada karşılığı olup
   oyunda hiç ligi olmayan bir bölge eklenirse (ya da GEO'da öksüz bir şekil
   kalırsa) o bölge yeşile boyanmak yerine nötr kalsın. */
function terrState(c){
  if(terrScouting(c))return 'scouting';
  const total=terrLeagues(c).length;
  if(!total)return 'fog';                       // ilerleyecek bir şeyi yok
  if(!terrRemaining(c).length)return 'full';    // hepsi keşfedildi
  return terrDiscovered(c)?'partial':'open';    // bir kısmı / hiçbiri
}
/* Bir ligin ağı şu anda kurulabilir mi? Arayüz bunu sorar; parayı buyScout
   kendi kontrol eder, burada kasaya bakılmıyor. */
function canScout(i){return !!LEAGUES[i]&&!knownLg(i)&&!scoutPending(i);}

/* ================= ÇİZİM =================
   Coğrafya js/worldgeo.js'ten geliyor (üretilmiş dosya). */
function atlasHasGeo(){return typeof GEO!=='undefined'&&GEO&&GEO.t;}
function atlasMapSvg(){
  if(!atlasHasGeo())return '';
  const vb=GEO.vb;
  const terrs=terrList().filter(c=>GEO.t[c]).map(c=>
    `<path class="mapterr ${terrState(c)}" d="${GEO.t[c].d}" fill-rule="evenodd"/>`).join('');
  const marks=terrList().filter(c=>GEO.t[c]).map(c=>{
    const a=GEO.t[c].a;
    return `<g class="mapmark ${terrState(c)}" data-t="${c}" data-x="${a[0]}" data-y="${a[1]}"
       transform="translate(${a[0]},${a[1]})">
      <circle class="mk" r="30"/><circle class="mkdot" r="11"/></g>`;
  }).join('');
  /* Kamera tek bir grubu dönüştürüyor: kaydırma ve yakınlaştırma sırasında
     SVG yeniden kurulmuyor, yalnız bu transform yazılıyor. */
  return `<svg class="mapsvg" id="mapSvg" viewBox="${vb.join(' ')}"
    preserveAspectRatio="xMidYMid meet" role="img" aria-label="${esc(t('scoutNet'))}">
    <rect class="mapsea" x="${vb[0]-vb[2]}" y="${vb[1]-vb[3]}" width="${vb[2]*3}" height="${vb[3]*3}"/>
    <g id="mapCam">
      <path class="mapland" d="${GEO.ctx}" fill-rule="evenodd"/>
      <g class="mapterrs">${terrs}</g>
      <g class="mapmarks" id="mapMarks">${marks}</g>
    </g>
  </svg>`;
}
function atlasLegend(){
  const cnt={};
  terrList().forEach(c=>{const s=terrState(c);cnt[s]=(cnt[s]||0)+1;});
  const item=(st,lbl)=>cnt[st]?`<span class="mapkey ${st}"><i></i>${lbl} <b>${cnt[st]}</b></span>`:'';
  return `<div class="maplegend">
    ${item('full',t('mapFull'))}${item('partial',t('mapPartial'))}
    ${item('scouting',t('scoutPendingT'))}${item('open',t('mapOpen'))}${item('fog',t('mapFog'))}
  </div>`;
}
function atlasView(){
  if(!atlasHasGeo())
    return `<h2 class="sec">${t('scoutNet')}</h2><div class="card"><div class="empty">—</div></div>`;
  const known=(S.known||[]).length;
  return `<h2 class="sec">${t('scoutNet')}</h2>
  <div class="mapwrap" id="mapWrap">
    ${atlasMapSvg()}
    <div class="mapzoom">
      <button onclick="mapZoom(1)" aria-label="+">+</button>
      <button onclick="mapZoom(-1)" aria-label="−">−</button>
      <button onclick="mapHome()" aria-label="${esc(t('mapRecentre'))}">⌂</button>
    </div>
  </div>
  ${atlasLegend()}
  <div class="card tight" style="padding:14px">
    <div class="kv"><span class="k">${t('knownLbl')}</span>
      <span class="v">${known}/${LEAGUES.length}</span></div>
    <div class="kv"><span class="k">${t('cash')}</span><span class="v">${fmtK(S.cash)}</span></div>
  </div>
  <div class="sub" style="margin:0 2px 10px">${t('mapHint')}</div>
  <!-- GEÇİCİ: satın alma paneli 6. adımda gelecek. O gelene kadar mevcut liste
       erişilebilir kalsın ki ağ kurma özelliği kaybolmasın. -->
  <button class="btn b" onclick="openScout()">${t('scoutBuild')} · ${t('mapListTmp')}</button>`;
}

/* ================= KAMERA =================
   Yalnız modül değişkeni: kayda yazılmıyor, kariyerle taşınmıyor.
   Dönüşüm doğrudan DOM'a yazılıyor; her harekette görünümü yeniden çizmek
   telefonda gözle görülür bir takılma demek. */
let CAM={x:0,y:0,k:1};
const CAM_K={min:1,max:12};
/* Ev çerçevesi bir ülkeyi yapıştırmasın: en az bu kadar genişlik gösterilsin,
   böylece komşuları da görünür ve nereye gidebileceğin belli olur. */
const CAM_SPAN=1000;
function mapSvgEl(){return document.getElementById('mapSvg');}
function mapCamEl(){return document.getElementById('mapCam');}
/* Ekranda gerçekten görünen viewBox penceresi. preserveAspectRatio="meet"
   kutuyu ortalayıp boşluk bıraktığı için görünen alan viewBox'tan geniş
   olabiliyor; sınırlama bunu bilmek zorunda. */
function mapWindow(){
  const vb=GEO.vb, el=mapSvgEl();
  const r=el&&el.getBoundingClientRect?el.getBoundingClientRect():null;
  if(!r||!r.width||!r.height)return {x:vb[0],y:vb[1],w:vb[2],h:vb[3],sc:1};
  const sc=Math.min(r.width/vb[2],r.height/vb[3])||1;
  const w=r.width/sc, h=r.height/sc;
  return {x:vb[0]+(vb[2]-w)/2, y:vb[1]+(vb[3]-h)/2, w:w, h:h, sc:sc, rect:r};
}
/* Harita tamamen ekrandan çıkmasın. Kural "içerik pencereyi tümüyle örtsün"
   değil "en az yarısı görünsün": kuzeydeki Hollanda ya da güneydeki Arjantin
   ancak haritanın kenarının ötesinde bir miktar boşluk gösterilerek ortalanabilir.
   O boşluk boş değil — deniz katmanı kameranın dışında ve tüm görünümü kaplıyor,
   yani haritanın dışı okyanus olarak çiziliyor. */
const CAM_KEEP=0.5;
function mapClamp(){
  CAM.k=Math.max(CAM_K.min,Math.min(CAM_K.max,CAM.k));
  const vb=GEO.vb, w=mapWindow();
  const axis=(camv,vb0,vbLen,win0,winLen)=>{
    const keep=Math.min(vbLen*CAM.k,winLen)*CAM_KEEP;
    const lo=win0+keep-CAM.k*(vb0+vbLen);
    const hi=win0+winLen-keep-CAM.k*vb0;
    return lo>hi?(lo+hi)/2:Math.max(lo,Math.min(hi,camv));
  };
  CAM.x=axis(CAM.x,vb[0],vb[2],w.x,w.w);
  CAM.y=axis(CAM.y,vb[1],vb[3],w.y,w.h);
}
/* İşaretler haritayla birlikte büyümesin: uzakta küçük nokta, yakında okunur
   bir işaret. Üs 1 olsaydı ekran boyutu sabit kalır, 0 olsaydı harita kadar
   büyürdü; arası ikisini de vermiyor ama ikisine de yaklaşıyor. */
function mapMarkScale(){
  const g=document.getElementById('mapMarks');
  if(!g||!g.children)return;
  const s=Math.pow(CAM.k,-0.45);
  Array.prototype.forEach.call(g.children,el=>{
    if(!el.getAttribute)return;
    el.setAttribute('transform',
      'translate('+el.getAttribute('data-x')+','+el.getAttribute('data-y')+') scale('+s.toFixed(3)+')');
  });
}
function mapApply(){
  const g=mapCamEl();
  if(g&&g.setAttribute)
    g.setAttribute('transform','translate('+CAM.x.toFixed(1)+' '+CAM.y.toFixed(1)+') scale('+CAM.k.toFixed(4)+')');
  mapMarkScale();
}
/* Ekran noktası → viewBox koordinatı */
function mapToVb(sx,sy){
  const w=mapWindow();
  if(!w.rect)return {x:0,y:0};
  return {x:w.x+(sx-w.rect.left)/w.sc, y:w.y+(sy-w.rect.top)/w.sc};
}
/* Verilen ekran noktası sabit kalacak şekilde yakınlaştır. */
function mapZoomAt(factor,sx,sy){
  const v=(sx===undefined)?null:mapToVb(sx,sy);
  const p=v||(function(){const w=mapWindow();return {x:w.x+w.w/2,y:w.y+w.h/2};})();
  const lx=(p.x-CAM.x)/CAM.k, ly=(p.y-CAM.y)/CAM.k;
  CAM.k=Math.max(CAM_K.min,Math.min(CAM_K.max,CAM.k*factor));
  CAM.x=p.x-lx*CAM.k;
  CAM.y=p.y-ly*CAM.k;
  mapClamp();mapApply();
}
function mapZoom(dir){mapZoomAt(dir>0?1.45:1/1.45);}
function mapFitWorld(){CAM.k=1;CAM.x=0;CAM.y=0;mapClamp();mapApply();}
/* Ekranı oyuncunun kendi bölgesine çerçevele. Hiç ağı yoksa dünya. */
function mapHome(){
  if(!atlasHasGeo())return;
  const own=terrList().filter(c=>GEO.t[c]&&terrDiscovered(c));
  if(!own.length){mapFitWorld();return;}
  let x0=Infinity,y0=Infinity,x1=-Infinity,y1=-Infinity;
  own.forEach(c=>{const b=GEO.t[c].bb;
    x0=Math.min(x0,b[0]);y0=Math.min(y0,b[1]);x1=Math.max(x1,b[2]);y1=Math.max(y1,b[3]);});
  const cx=(x0+x1)/2, cy=(y0+y1)/2;
  /* dar bölgeleri en az CAM_SPAN genişliğinde bir alana yay */
  const w=mapWindow();
  const spanX=Math.max(x1-x0,CAM_SPAN), spanY=Math.max(y1-y0,CAM_SPAN*(w.h/w.w));
  CAM.k=Math.min(w.w/spanX,w.h/spanY);
  CAM.k=Math.max(CAM_K.min,Math.min(CAM_K.max,CAM.k));
  CAM.x=w.x+w.w/2-CAM.k*cx;
  CAM.y=w.y+w.h/2-CAM.k*cy;
  mapClamp();mapApply();
}
/* Olay bağlama. render() her çizimden sonra çağırıyor: innerHTML eski
   dinleyicileri sildiği için yeniden bağlanmak zorunda. */
function mapMount(){
  const el=mapSvgEl();
  if(!el||!el.addEventListener)return;
  mapApply();
  const pts=new Map();
  let base=null, drag=null;
  const two=()=>{const a=[...pts.values()];return {d:Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y),
    mx:(a[0].x+a[1].x)/2,my:(a[0].y+a[1].y)/2};};
  el.addEventListener('pointerdown',e=>{
    pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(el.setPointerCapture)try{el.setPointerCapture(e.pointerId);}catch(_){}
    if(pts.size===1)drag={x:e.clientX,y:e.clientY,ox:CAM.x,oy:CAM.y};
    else if(pts.size===2){const m=two();base={d:m.d,k:CAM.k,p:mapToVb(m.mx,m.my)};drag=null;}
  });
  el.addEventListener('pointermove',e=>{
    if(!pts.has(e.pointerId))return;
    pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
    const w=mapWindow();
    if(pts.size>=2&&base){
      const m=two();
      if(base.d>6){
        const lx=(base.p.x-CAM.x)/CAM.k, ly=(base.p.y-CAM.y)/CAM.k;
        CAM.k=Math.max(CAM_K.min,Math.min(CAM_K.max,base.k*(m.d/base.d)));
        /* iki parmağın ortası hangi noktayı tutuyorsa orada kalsın */
        const now=mapToVb(m.mx,m.my);
        CAM.x=now.x-lx*CAM.k;CAM.y=now.y-ly*CAM.k;
        mapClamp();mapApply();
      }
      return;
    }
    if(!drag)return;
    CAM.x=drag.ox+(e.clientX-drag.x)/w.sc;
    CAM.y=drag.oy+(e.clientY-drag.y)/w.sc;
    mapClamp();mapApply();
  });
  const up=e=>{
    pts.delete(e.pointerId);
    if(pts.size<2)base=null;
    if(pts.size===0)drag=null;
  };
  el.addEventListener('pointerup',up);
  el.addEventListener('pointercancel',up);
  el.addEventListener('wheel',e=>{
    e.preventDefault();
    mapZoomAt(e.deltaY<0?1.18:1/1.18,e.clientX,e.clientY);
  },{passive:false});
}

};
const RIV_SFXK=Object.keys(RIV_SFX);
function rivalName(r){
  if(!r)return '';
  const sfx=RIV_SFX[r.sfx]||RIV_SFX.mg;
  return r.base+' '+sfx[L];
}

/* ================= KURULUŞ ================= */
/* Ajansın yuva bölgesi hangi uyruğun soyadını kullanacağını belirliyor: Batı Afrika'da
   kurulu bir ajansın adı da oradan gelsin. pickNat core.js'te ve yalnızca çağrı
   anında okunuyor — dosya sırası bir bağ getirmiyor. */
function rivNatOf(ctry){
  const lg=LEAGUES.find(l=>l.ctry===ctry);
  const d=lg?lg.nat:'en';
  /* pickNat kullanılmıyor: o %38 ihtimalle yabancı uyruk döndürüyor ve Suudi
     Arabistan merkezli ajansın adı Fransızca çıkabiliyordu. Ajans yerlidir; yalnızca
     bölgesel havuzlar (af/afN) tek bir ülkeye indirilir. */
  if(d==='af')return AFR[R(0,AFR.length-1)];
  if(d==='afN')return NAF[R(0,NAF.length-1)];
  return d;
}
/* Tek bir ajans kaydı. id dışarıdan veriliyor: kadroya sonradan eklenen ajansın
   id'si dizideki yeri olmalı, yoksa eski kayıtlardaki p.ra başka birini gösterir. */
function makeRival(a,id,ctry,used){
  const nat=rivNatOf(ctry);
  let base=NATS[nat].l[0];
  /* aynı soyadı iki ajansa düşmesin — oyuncu adları zaten aynı havuzdan geliyor.
     Deneme sayısı sınırlı: küçük bir soyadı havuzu döngüyü kilitlemesin. */
  for(let k=0;k<40;k++){
    const b=NATS[nat].l[R(0,NATS[nat].l.length-1)];
    if(!used[b]){base=b;break;}
  }
  used[base]=1;
  return {id,base,sfx:RIV_SFXK[R(0,RIV_SFXK.length-1)],arch:a.id,ctry,
          rep:R(a.rep[0],a.rep[1]),rel:0,won:0,lost:0};
}
/* Ajansların yuva bölgeleri: her ajans ayrı bir bölgede kurulsun ki harita üzerinde
   de dağılmış görünsünler. RIV_ARCH bölge sayısını (16) geçerse baştan sarılır. */
function rivCtrys(){return Object.keys(CTRYS).sort(()=>RF()-0.5);}
function newRivals(){
  /* Her arketipten bir tane: on dört ajans on dört ayrı karakter demek. Aynı
     arketipten iki tane olsaydı oyuncu ikisini birbirinden ayıramazdı. */
  const ctrys=rivCtrys(),used={};
  return RIV_ARCH.map((a,i)=>makeRival(a,i,ctrys[i%ctrys.length],used));
}
/* Kadro eksikse tamamla. Yeni ajans dizinin sonuna ekleniyor: mevcut id'ler yerinde
   kalır, dolayısıyla eski kayıttaki her p.ra hâlâ aynı ajansı gösterir. Yeni gelenler
   portföysüz başlamaz — RIV.notable eşiği de düştüğü için claimNotable() bu turda
   sahipsiz kalmış oyuncuları dağıtırken onlar da payını alır. */
function growRivals(){
  const have={};S.rivals.forEach(r=>have[r.arch]=1);
  const used={};S.rivals.forEach(r=>used[r.base]=1);
  const free=rivCtrys().filter(c=>!S.rivals.some(r=>r.ctry===c));
  let k=0;
  RIV_ARCH.forEach(a=>{
    if(have[a.id])return;
    const ctry=free.length?free[k++%free.length]:rivCtrys()[0];
    S.rivals.push(makeRival(a,S.rivals.length,ctry,used));
  });
  RIVCNT=null;
}
/* Her giriş kapısında çağrılır: yeni oyun, eski kayıt, bozuk kayıt. Kurulum bir kez
   olur; kadro tamsa hiçbir şey yapmaz. */
function ensureRivals(){
  if(!S)return;
  if(!S.rivals||!S.rivals.length){
    S.rivals=newRivals();
    claimNotable();
  } else if(S.rivals.length<RIV_ARCH.length){
    growRivals();
    claimNotable();
  }
  S.chase=S.chase||[];
}
function rivalById(i){return (S&&S.rivals&&S.rivals[i])||null;}
/* Oyuncunun ajansı — yoksa null. p.ra taşımayan eski kayıtlar için de doğru cevap. */
function rivalOf(p){
  if(!p||p.agent!=='rival'||p.ra===undefined)return null;
  return rivalById(p.ra);
}
function rivalArch(r){return archById(r&&r.arch);}
/* Portföy türetiliyor, saklanmıyor. Hafta içinde değişmediği için sonuç haftaya
   göre bir kez sayılıyor: sıralama ekranı 7000 oyuncuyu her çizimde taramasın. */
let RIVCNT=null;
function rivalCounts(){
  const key=(S.tw||0)+':'+(S.season||0)+':'+(S.week||0);
  if(RIVCNT&&RIVCNT.key===key)return RIVCNT.v;
  const v=(S.rivals||[]).map(()=>0);
  S.players.forEach(p=>{if(p.ra!==undefined&&v[p.ra]!==undefined&&p.agent==='rival')v[p.ra]++;});
  RIVCNT={key,v};
  return v;
}
function rivalCount(i){return rivalCounts()[i]||0;}
function rivalClients(i){return S.players.filter(p=>p.agent==='rival'&&p.ra===i);}
/* Sıralama: sen de listedesin. Ekranda da, panelde gösterilen sıra da buradan okunur. */
function rivalRank(){
  const rows=(S.rivals||[]).map(r=>({r,rep:r.rep}));
  rows.push({r:null,rep:S.rep});
  rows.sort((a,b)=>b.rep-a.rep);
  return rows;
}
function myRank(){return rivalRank().findIndex(x=>!x.r)+1;}

/* ================= SAHİPLENME =================
   Adlı bir ajans yalnızca dikkat çekici oyuncuyu alır: dünyada ~3000 rakip menajerli
   oyuncu var, hepsini altı ajansa bölmek "butik ajans"ı anlamsız kılardı. Geri kalanı
   isimsiz yerel menajerinde kalıyor — bugünkü davranışın aynısı. */
function notable(p){
  /* Genç kanadı dar tutuluyor: yalnızca "pot-r büyük" demek 16 yaşındaki her
     oyuncuyu içeri alıyor ve butik ajansın portföyü yüzleri buluyordu. Gerçekten
     adı duyulacak gençler aranıyor. */
  return p.agent==='rival'&&
    (profileOf(p)>=RIV.notable||(p.age<=21&&p.pot-p.r>=14&&p.pot>=RIV.notable+6));
}
/* Hangi ajans alır: arketip ağırlıkları + portföy eğilimi + yuva bölgesi yakınlığı. */
function claimWeight(r,p){
  const a=rivalArch(r);
  const young=(p.age<=21&&p.pot-p.r>=10)?1:0;
  const elite=Math.max(0,(p.r-72)/12);
  /* Tecrübe ekseni: yıldızı ve genci kovalayan ajansların yanında kariyerinin
     sonundaki oyuncuyla ilgilenen biri de olsun. vet taşımayan arketipte terim
     sıfır, yani eski altı arketibin ağırlıkları değişmedi. */
  const vet=p.age>=29?Math.min(1,(p.age-28)/3):0;
  let w=(0.5+young*a.youth+elite*a.elite+vet*(a.vet||0))*a.size;
  if(teamOf(p).lg>=0&&LEAGUES[teamOf(p).lg].ctry===r.ctry)w*=(a.home||1.6);
  else w*=(a.away||1);   // aile ajansı kendi şehrinden çıkmaz, hat kendi bölgesinden besler
  return Math.max(0.02,w);
}
function claimFor(p){
  const rs=S.rivals||[];
  if(!rs.length)return;
  let tot=0;rs.forEach(r=>tot+=claimWeight(r,p));
  let x=RF()*tot;
  for(const r of rs){x-=claimWeight(r,p);if(x<=0){p.ra=r.id;return;}}
  p.ra=rs[rs.length-1].id;
}
/* Bütün dünyayı tarayan tek geçiş: yeni oyunda ve her sezon sonunda çalışır.
   Eşiğin altına düşen oyuncunun ajansı da düşer — yıldızlığı biten oyuncuyla
   butik ajansın işi kalmaz. */
function claimNotable(){
  if(!S||!S.rivals)return;
  S.players.forEach(p=>{
    if(p.agent!=='rival'){if(p.ra!==undefined)delete p.ra;return;}
    if(notable(p)){if(p.ra===undefined)claimFor(p);}
    else if(p.ra!==undefined)delete p.ra;
  });
  RIVCNT=null;
}

/* ================= İMZA YARIŞI ================= */
function chaseFor(pid){return (S.chase||[]).find(x=>x.pid===pid);}
function chaseLeft(c){return Math.max(1,c.until-(S.tw||0));}
/* pitchChance'in tek okuma yeri buradan besleniyor: rakip aynı oyuncuyla
   görüşüyorsa oyuncunun kafası karışık, senin şansın düşük. */
function chasePenalty(p){
  const c=chaseFor(p.id);
  if(!c)return 0;
  const r=rivalById(c.ri);
  return RIV.chasePen*(r?rivalArch(r).chase:1);
}
/* Rakiplerin ilgilendiği taban: bu eşiğin altındaki oyuncu ne yarışa ne de arka plan
   imzasına konu olur. Yeni menajerin tutunduğu alt uç böylece kalabalık kalıyor. */
function rivInterest(p){return p.agent===null&&profileOf(p)>=52;}
/* Dünyayı baştan sona taramak yerine örnekle — market.js'in alıcı arama kalıbı.
   7000 oyuncuyu her hafta birkaç kez filtrelemek telefonda görünür bir maliyet. */
function rivSample(test,tries,want){
  const out=[];
  for(let i=0;i<tries&&out.length<want;i++){
    const p=S.players[R(0,S.players.length-1)];
    if(test(p)&&out.indexOf(p)<0)out.push(p);
  }
  return out;
}
/* Yarış yalnızca senin gördüğün liglerde ve senin uzanabileceğin seviyede açılır.
   Göremediğin ya da imzalayamayacağın bir oyuncu için yarışmak yarış değil, dipnot:
   ölçüldü, altı sezonda 88 yarışın yalnızca 5'i oyuncunun ekranına düşüyordu. */
function chaseTarget(r){
  const ceil=repCap()+RIV.reach;
  const cands=rivSample(p=>rivInterest(p)&&!chaseFor(p.id)&&knownLg(teamOf(p).lg)
                            &&profileOf(p)<=ceil,90,12);
  if(!cands.length)return null;
  return pickWeighted(cands,p=>claimWeight(r,p));
}
function openChase(r){
  const p=chaseTarget(r);
  if(!p)return;
  S.chase.push({pid:p.id,ri:r.id,until:(S.tw||0)+R(RIV.chaseLen[0],RIV.chaseLen[1])});
  /* Haber yalnızca itibarının yettiği oyuncu için. Kapasite koşulu bilerek yok:
     kadron doluyken de kimin gittiğini bilmek istersin, üstelik bir müşteriyi
     bırakıp o oyuncuya gitmek geçerli bir karar. */
  if(profileOf(p)<=repCap())
    pushNews('chaseOn',{n:p.n,pid:p.id,a:rivalName(r),ri:r.id},'warn');
}
/* Süresi dolan yarışı rakip kazanır. Sen imzaladıysan kayıt zaten düşmüştür. */
function resolveChases(){
  (S.chase||[]).slice().forEach(c=>{
    const p=byId(c.pid);
    if(!p||p.agent!==null){S.chase=S.chase.filter(x=>x!==c);return;}
    if(c.until>(S.tw||0))return;
    S.chase=S.chase.filter(x=>x!==c);
    const r=rivalById(c.ri);
    if(!r)return;
    p.agent='rival';
    if(notable(p))p.ra=r.id;
    RIVCNT=null;
    if(knownLg(teamOf(p).lg)&&profileOf(p)<=repCap())
      pushNews('chaseLost',{n:p.n,pid:p.id,a:rivalName(r),ri:r.id},'bad');
  });
}

/* ================= AYARTMA =================
   Rakip önce duyulur, sonra masaya gelir: tehdit birkaç hafta birikir ki oyuncu
   müşterisinin güvenine bakacak vakti olsun. */
function poachChance(p,r){
  const a=rivalArch(r);
  /* İtibar farkı sınırlanıyor: rakipler 60-90 itibarla başlıyor, yeni menajer 5 ile.
     Sınırsız bırakıldığında ilk sezonlarda her ayartma neredeyse kesin kayıpla
     bitiyordu — ölçüldü: %60 kayıp, itibar altı sezon boyunca yerinde saydı. Fark
     bir etken olmalı, tek etken değil. */
  const gap=clamp((r.rep-S.rep)/RIV.repGap,-0.15,0.18);
  /* skillBonus('loy') — ayartma riskine dokunan tek yer (bkz. SK_KEY.loy). */
  return clamp(RIV.poachBase+a.poach*RIV.poachArch+gap
    -(trustOf(p)-55)/RIV.trustDiv
    -(p.morale-55)/RIV.morDiv
    -clamp(skillBonus('loy'),0,0.6),0.05,0.90);
}
/* Hedef seçimi: güveni düşük, morali kırık ya da fazla değerli müşteri. Yeni imza
   atmış oyuncuya kimse yaklaşmaz (honeymoon).

   RIV.worth eşiği asıl koruma: büyük ajanslar alt ligdeki bir oyuncu için telefon
   açmaz. Bu olmadan iki müşterilik yeni menajer sürekli ayartılıyor ve hiç
   büyüyemiyordu. Ayartma, adın duyulduktan sonra başlayan bir sorun. */
/* p.sa — müşterinin imzalandığı hafta. Yalnızca burada okunuyor; eski kayıtlarda
   yok, o zaman koruma da yok (ilk ayartmadan sonra kendiliğinden oluşur). */
function poachGraced(p){return (p.sa||0)+RIV.poachGrace>(S.tw||0);}
function poachTarget(){
  const cands=S.clients.map(byId).filter(p=>p&&!honeymoon(p)&&!poachGraced(p)&&
    (profileOf(p)>=RIV.worth||(p.age<=21&&p.pot-p.r>=12))&&
    (trustOf(p)<70||p.morale<50||p.r>=74));
  if(!cands.length)return null;
  return pickWeighted(cands,p=>1+Math.max(0,(70-trustOf(p))/20)+Math.max(0,(50-p.morale)/20)
                                +Math.max(0,(p.r-72)/8));
}
function openPoach(){
  const p=poachTarget();
  if(!p)return;
  const rs=(S.rivals||[]).filter(r=>rivalArch(r).poach>=0.5);
  if(!rs.length)return;
  const r=pickWeighted(rs,x=>rivalArch(x).poach*claimWeight(x,p));
  S.poach={pid:p.id,ri:r.id,at:(S.tw||0)+R(RIV.poachWarn[0],RIV.poachWarn[1])};
  S.poachAt=(S.tw||0)+RIV.poachGap;
  pushNews('poachWarn',{n:p.n,pid:p.id,a:rivalName(r),ri:r.id},'warn');
}
/* Masadaki üç seçenek. EVENTS ile aynı dil: her seçenek bir sonuç nesnesi döner,
   uygulaması applyEff'ten geçer (bkz. poachChoose — js/ui.js).
     d   : kaybetme olasılığına eklenen pay
     eff : applyEff'in anladığı sonuç (cash/rep/trust/morale)
   Karar burada duruyor çünkü denge verisi; çizimi arayüzün işi. */
const POACH_OPT=[
 {t:{tr:'Komisyonundan feda et',en:'Give up part of your cut'},
  run:c=>({d:-0.35,
    eff:{cash:-Math.max(30,Math.round(c.p.wage*10)),trust:10,morale:3},
    msg:{tr:'Rakamı gösterdin. "Bu adam benim için ne kadar önemli, gör." Cebinden çıktı ama masada kaldı.',
         en:'You showed him the number. "See how much you matter to me." It cost you, but he stayed at your table.'}})},
 {t:{tr:'Yüz yüze konuş, ilişkiye güven',en:'Sit down with him and trust the relationship'},
  run:c=>RF()<0.35+trustOf(c.p)/160
    ?{d:-0.30,eff:{trust:8},
      msg:{tr:'Uzun bir akşam yemeği. Anlattıklarını dinledi, sen de onunkileri. Aranızdaki bağ para istemedi.',
           en:'A long dinner. He listened, and so did you. The bond held without money changing hands.'}}
    :{d:-0.05,eff:{trust:-4},
      msg:{tr:'Konuştunuz ama karşındaki zaten kararını vermiş gibiydi. Sözlerin havada kaldı.',
           en:'You talked, but he seemed to have made his mind up already. Your words hung in the air.'}}},
 {t:{tr:'Aldırma, işini yapmaya devam et',en:'Ignore it and get on with your work'},
  run:()=>({d:0.12,eff:{},
    msg:{tr:'Telefonu açmadın, konuyu hiç açmadın. Bazen doğru olan budur — bazen değil.',
         en:'You didn\'t call and never raised it. Sometimes that\'s right — sometimes it isn\'t.'}})}
];
/* Müşteriyi kaybetmenin tek yolu: burada toplanıyor ki itibar kaybı ve haber
   tek yerden geçsin. */
function losePlayerTo(p,r){
  p.agent='rival';
  S.clients=S.clients.filter(c=>c!==p.id);
  if(notable(p))p.ra=r.id;
  r.won=(r.won||0)+1;
  r.rel=clamp((r.rel||0)-12,-100,100);
  RIVCNT=null;
  /* Kayıp zaten müşteriyi, geliri ve kadro yerini götürüyor; itibar bedeli üçüncü
     ceza olduğu için ölçülü tutuluyor (bkz. RIV.poachRep). */
  repEvent(-RIV.poachRep);
  pushNews('poached',{n:p.n,pid:p.id,a:rivalName(r),ri:r.id},'bad');
}

/* ================= HAFTALIK MOTOR =================
   nextWeek() içinden, transfer piyasasından önce çağrılır. */
function simRivals(){
  ensureRivals();
  const rs=S.rivals||[];
  if(!rs.length)return;
  resolveChases();
  /* Oranlar ajans başına değil dünya başına sabit: bkz. rivScale(). */
  const sc=rivScale();
  rs.forEach(r=>{
    const a=rivalArch(r);
    /* --- arka plan imzaları: piyasadaki temsilcisiz oyuncudan biri --- */
    if(RF()<RIV.signRate*sc*a.chase){
      const pool=rivSample(p=>rivInterest(p)&&!chaseFor(p.id),60,10);
      if(pool.length){
        const p=pickWeighted(pool,x=>claimWeight(r,x));
        p.agent='rival';
        if(notable(p))p.ra=r.id;
        RIVCNT=null;
      }
    }
    /* --- müşteri kaybı: sadık ajans daha az kaybeder --- */
    if(RF()<RIV.loseRate*sc/Math.max(0.3,a.loyal)){
      const mine=rivalClients(r.id);
      if(mine.length){
        const p=mine[R(0,mine.length-1)];
        p.agent=null;delete p.ra;
        RIVCNT=null;
      }
    }
    /* --- yeni yarış --- */
    if((S.chase||[]).length<RIV.chaseMax&&RF()<RIV.chaseW*sc*a.chase)openChase(r);
  });
  /* --- ayartma: aynı anda tek tehdit, aralarında bekleme var --- */
  if(!S.poach&&S.clients.length&&(S.poachAt||0)<=(S.tw||0)&&RF()<0.30)openPoach();
}
/* Sezon sonu tek geçiş: itibar portföyün kalitesine doğru kayar, böylece sıralama
   tablosu kariyer boyunca gerçekten hareket eder. Haftalık hesaplamak pahalı olurdu. */
function rivalSeason(){
  ensureRivals();
  (S.rivals||[]).forEach(r=>{
    const mine=rivalClients(r.id);
    const top=mine.slice().sort((a,b)=>b.r-a.r).slice(0,10);
    const q=top.length?top.reduce((s,p)=>s+p.r,0)/top.length:55;
    /* hedef: portföy kalitesi + genişliği. Kimseyi taşımayan ajans sönüyor. */
    const target=clamp((q-58)*2.6+Math.min(20,mine.length*0.6),5,120);
    r.rep=Math.round(clamp(r.rep+(target-r.rep)*RIV.repMove,3,140)*10)/10;
    /* husumet zamanla soğur — kimse on sezon boyunca aynı öfkeyi taşımaz */
    if(r.rel)r.rel=Math.round(r.rel*0.75);
  });
  claimNotable();
}

'use strict';
/* js/core.js — oyun durumu, yardımcılar, fikstür/kupa kurulumu, keşif ağı, ekonomi formülleri */
/* ================= STATE / HELPERS ================= */
let S=null, negCtx=null;
let stack=[{v:'dash'}];
const R=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const RF=()=>Math.random();
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const fmtK=v=>v>=1000?(v/1000).toFixed(2).replace(/\.?0+$/,'')+'M €':Math.round(v)+'K €';
const fmtM=v=>v.toFixed(1).replace(/\.0$/,'')+'M €';
/* ===== piyasa eğrileri =====
   Modern futbolun ölçeğine yakın dursun: alt liglerde birkaç bin, üst düzeyde
   yüz binlerce euro haftalık; bonservisler on milyonlarla yüz milyonlar arasında.
   Referans: 60 ≈ ikinci lig oturmuş oyuncu, 70 ≈ üst lig ilk 11, 80 ≈ üst lig
   yıldızı, 88+ ≈ dünya çapında. Değer maaştan daha dik artar — futbolda da öyle. */
const marketWage=r=>Math.max(1,Math.round(8*Math.pow(1.129,r-60)));
const marketValue=r=>{
  const v=2*Math.pow(1.145,r-60);
  return v<10?+v.toFixed(1):Math.round(v);   // küçük değerlerde ondalık, büyükte tam sayı
};
/* ===== oyuncunun güncel piyasa değeri =====
   Güç tek başına yetmiyor: aynı güçte iki oyuncudan sezonu domine eden daha pahalı,
   sönük geçen daha ucuz olmalı. Bu yüzden her oyuncunun bir değer çarpanı var ve
   belirli maç aralıklarıyla sahadaki işine göre güncelleniyor (bkz. updateValue).

   Beklenen puan oyuncunun seviyesinden türetiliyor — yoksa iyi oyuncular zaten
   yüksek puan aldığı için sürekli değerlenir, kötüler sürekli değer kaybederdi. */
const VAL={every:12, gain:0.18, lo:0.62, hi:1.60, revert:0.70};
function expectedRating(r){return 6.10+(r-50)*0.045;}
function valueMult(p){return p&&p.vm?p.vm:1;}
function valueOf(p){const v=marketValue(p.r)*valueMult(p)*(1+(p.agent==='you'?skillBonus('val'):0));return +v.toFixed(v<10?1:0);}
/* Her VAL.every maçta bir çalışır. Dönüşü: değer arttı mı azaldı mı (bildirim için). */
function updateValue(p){
  if(!p.rtN||p.rtN<VAL.every)return 0;
  if((p.vmAt||0)+VAL.every>p.rtN)return 0;
  p.vmAt=p.rtN;
  const avg=p.rtSum/p.rtN;
  const diff=avg-expectedRating(p.r);
  const before=valueMult(p);
  p.vm=+clamp(before+diff*VAL.gain,VAL.lo,VAL.hi).toFixed(3);
  return p.vm-before;
}
/* Menajerlik komisyonu itibara bağlıdır: adı olmayan menajer düşük oranla çalışır,
   aranan menajer masaya kendi oranını koyar. */
/* Ajansın kalıcı değiştiricileri. Yetenek ağacından gelen bonusun yanında,
   olaylarda verdiğin kararlar da buraya yazar (bkz. applyEff). */
function agMod(k){return (S&&S.ag&&S.ag[k])||0;}
function commissionRate(){return +clamp(0.05+(S.rep/100)*0.10+skillBonus('comm')+agMod('comm'),0.03,0.25).toFixed(3);}
function commissionPct(){return Math.round(commissionRate()*100);}
/* Bonservisten aldığın pay ayrı bir oran: sözleşme imza payını değil yalnızca
   transferi büyütür. skillBonus('fee') buradan okunur, ekranda da bu oran yazar. */
function transferRate(){return +clamp(commissionRate()*(1+skillBonus('fee')),0.03,0.35).toFixed(3);}
function transferPct(){return Math.round(transferRate()*100);}
function lum(hex){const n=parseInt(hex.slice(1),16);return 0.299*(n>>16)+0.587*((n>>8)&255)+0.114*(n&255);}
function tmBadge(tm,size){

function pickNat(domestic){
  if(domestic==='af')domestic=AFR[R(0,AFR.length-1)];
  else if(domestic==='afN')domestic=NAF[R(0,NAF.length-1)];
  if(RF()<0.62)return domestic;
  const others=NATKEYS.filter(n=>n!==domestic);
  const w={br:3,ar:2,fr:1.5,es:1.2,nl:1.2,de:1,it:1,en:0.8,tr:0.8,pt:1,mx:0.8,us:0.5,jp:0.3,sa:0.2,eg:0.4,ma:0.4,ng:0.5,sn:0.5,gh:0.4,cm:0.4,be:0.8,hr:0.6,rs:0.6,pl:0.6,cz:0.4,gr:0.4,no:0.4,se:0.5,dk:0.5,ch:0.5,at:0.4,ua:0.5,ro:0.3,sct:0.4,ie:0.3,ru:0.4,co:0.9,uy:0.6,cl:0.5,pe:0.4,ec:0.4,py:0.3,ve:0.3,ci:0.6,dz:0.5,tn:0.4,ml:0.4,cd:0.4,kr:0.4,ir:0.3,au:0.3,cn:0.2};
  let tot=0;others.forEach(n=>tot+=w[n]||1);
  let x=RF()*tot;
  for(const n of others){x-=(w[n]||1);if(x<=0)return n;}
  return others[0];
}
/* yaş → güç eğrisi: genç oyuncu kulübünün seviyesinin belirgin altında başlar,
   zirveye 24-30 arasında ulaşır, sonra geriler. forceAge verilirse r/pot O yaşa göre hesaplanır. */
function genPlayer(team,pos,forceAge){
  const str=team.str;
  const nat=pickNat(LEAGUES[team.lg].nat);
  const low=str<=60;
  const age=forceAge||(low?(RF()<0.5?R(16,21):R(22,32)):R(17,34));
  let r;
  if(age<=17)r=clamp(R(str-24,str-14),35,70);
  else if(age<=19)r=clamp(R(str-19,str-10),35,78);
  else if(age<=21)r=clamp(R(str-14,str-4),35,84);
  else if(age<=23)r=clamp(R(str-9,str+2),38,88);
  else if(age<=30)r=clamp(R(str-7,str+4),40,93);
  else r=clamp(R(str-9,str+2),38,90);
  let pot;
  if(age<=21){
    pot=r+(age<=17?R(8,20):age<=19?R(6,17):R(4,13));
    const w=RF();
    if(w<0.007)pot=r+R(30,45);      // gerçek wonderkid — çok nadir
    else if(w<0.045)pot=r+R(18,30); // yüksek potansiyel — nadir
  } else if(age<=23)pot=r+R(2,9);
  else if(age<=26)pot=r+R(0,4);
  else pot=r+R(0,1);
  pot=clamp(pot,r,96);
  /* 90+ potansiyel gerçekten nadir olsun: yolu ne olursa olsun küresel eleme */
  if(pot>=90&&r<88&&RF()>0.15)pot=clamp(89-R(0,4),r,96);
  return {id:PID++,n:genName(nat),nat,age,pos:pos||POS[R(0,3)],r,pot,
    team:team.id,wage:Math.max(1,Math.round(marketWage(r)*(0.75+RF()*0.35))),yrs:R(1,4),
    morale:R(55,85),form:R(40,70),g:0,a:0,app:0,min:0,rtSum:0,rtN:0,l5:[],agent:RF()<(low?0.25:0.45)?'rival':null,ignored:0,
    h:R(168,196),ft:RF()<0.74?'R':'L',hist:[],seasons:[]};
}
/* ===== kariyer sonu & kadro yenilenmesi =====
   Kulüpler her sezon kadronun bir kısmını yeniler: yaşlananlar bırakır,
   seviyeyi hiç yakalayamayanlar sessizce elenir. Yerlerine çoğunlukla genç,
   bir kısmı hazır oyuncu gelir — böylece yaş piramidi kendini korur. */
function careerEndProb(p,lvl){
  if(p.age>=38)return 1;
  if(p.age>=34)return 0.30+(p.age-34)*0.20+(p.r<lvl-5?0.18:0);
  if(p.age>=31)return 0.08+(p.r<lvl-6?0.12:0);
  if(p.age>=24&&p.pot<lvl-11)return 0.13; // seviyeyi yakalayamadı
  return 0;
}
function intakeAge(){const w=RF();return w<0.66?R(16,20):w<0.89?R(21,24):R(25,28);}
/* Sözleşmesi biten oyuncuyu kulüp tutar mı? Seviyeye katkısı, yaşı ve potansiyeli belirler. */
function renewProb(p,lvl){
  let q=0.74+(p.r-lvl)*0.045;
  if(p.age<=23&&p.pot-p.r>=6)q+=0.22;  // geleceği olan genç bırakılmaz
  if(p.age>=33)q-=0.38;
  if(p.r<lvl-6)q-=0.28;                // kadroya katkısı yok
  return clamp(q,0.04,0.96);
}
/* Kulüpten ayrıldı: artık kulüpsüz. Kadroda açılan yeri sezon sonu dengelemesi doldurur. */
function releaseToFree(p){
  p.team=-1;p.yrs=0;p.freeFor=0;
  p.morale=clamp(p.morale-10,0,100);
  delete p.grp;
}
/* ayrılan oyuncunun yerine yeni bir oyuncu doğar — id korunur, eski kayıtlar silinir */
function regenPlayer(p){
  Object.assign(p,genPlayer(teamOf(p),p.pos,intakeAge()),{id:p.id});
  delete p.so;delete p.cd;delete p.hm; // önceki oyuncudan miras kalan durumlar
  delete p.ra;                         // artık başka bir insan; eski ajansıyla işi yok
}
function newGame(){
  PID=1;
  S={lang:L,week:1,season:1,cash:250,rep:5,tw:0,curLg:0,curCon:'eu',curCtry:'TR',mLg:'all',agent:null,known:[],scout:[],clients:[],inbox:[],players:[],teams:[],fx:[],offers:[],pending:[],pendC:[],pendPay:[],deals:[],lgHist:LEAGUES.map(()=>[])};
  TEAMS.forEach((lgTeams,lg)=>{
    lgTeams.forEach(([n,ab,c1,c2,str])=>{
      const tm={id:S.teams.length,n,ab,c1,c2,lg,str,bud:clamp((str-55)/30,0.4,1.05),pts:0,w:0,d:0,l:0,gf:0,ga:0};
      S.teams.push(tm);
      [['KL',2],['DF',5],['OS',5],['FV',4]].forEach(([p,cnt])=>{for(let k=0;k<cnt;k++)S.players.push(genPlayer(tm,p));});
    });
  });

  ensureRivals();

}
const SEASONW=38;   // sezon uzunluğu hedefi (en kalabalık ligin çift devresi)
function makeFixtures(idList,targetW){
  let ids=[...idList];
  if(ids.length%2)ids.push(-1); // bye for odd-sized groups
  const n=ids.length,rounds=[];
  for(let r=0;r<n-1;r++){
    const ms=[];
    for(let i=0;i<n/2;i++){
      const h=ids[i],a=ids[n-1-i];
      if(h!==-1&&a!==-1)ms.push(r%2?{h:a,a:h}:{h,a});
    }
    rounds.push(ms);ids.splice(1,0,ids.pop());
  }
  /* Ligler farklı uzunlukta olabilir — 18 takımlı lig 34, 20 takımlı 38 hafta oynar,
     bu gerçekçidir. Sorun yalnızca çift devrenin sezona sığmadığı liglerde: 24 takımlı
     bir lig tek devrede 23 haftada biter, kalan 15 hafta boş geçerdi. Orada rövanşların
     sığdığı kadarı eklenir; her takım yine eşit sayıda maç yapar. */
  const rev=rounds.map(ms=>ms.map(m=>({h:m.a,a:m.h})));
  const cap=targetW||Infinity;
  const all=(2*rounds.length<=cap)?[...rounds,...rev]
           :[...rounds,...rev.slice(0,Math.max(0,cap-rounds.length))];
  return all.map(ms=>ms.map(m=>({...m,hg:null,ag:null})));
}
/* ===== continental cups ===== */
function seedPair(ids){const r=[];for(let i=0;i<ids.length/2;i++)r.push({h:ids[i],a:ids[ids.length-1-i],hg:null,ag:null});return r;}
function consPair(ids){const r=[];for(let i=0;i<ids.length;i+=2)r.push({h:ids[i],a:ids[i+1],hg:null,ag:null});return r;}
function seedCups(){
  /* katılım: 8 Avrupa liginin bitiş sıralamasından — 1-2. sıra EC1, 3-4. EC2, 5-6. EC3 */
  const order=['EN1','ES1','DE1','IT1','FR1','TR1','NL1','PT1'];
  const perLg=order.map(c=>{
    const i=LEAGUES.findIndex(l=>l.c===c);
    return leagueTable(i).map(tm=>tm.id);
  });
  const pool=[];
  for(let pos=0;pos<6;pos++)perLg.forEach(lst=>{if(lst[pos]!==undefined)pool.push(lst[pos]);});
  S.cups=CUPS.map((cp,ci)=>({c:cp.c,rounds:[seedPair(pool.slice(ci*16,ci*16+16))]}));
}
function playKO(sh,sa){
  let g1=poisson(clamp(1.3*Math.pow(sh/sa,2.4),0.3,4)),g2=poisson(clamp(1.1*Math.pow(sa/sh,2.4),0.3,4));
  if(g1===g2){if(RF()<0.5)g1++;else g2++;}
  return [g1,g2];
}
function simCups(){
  (S.cups||[]).forEach((cp,cci)=>{
    const ri=cp.rounds.length-1;
    const round=cp.rounds[ri];
    if(!round||!round.length||round[0].hg!==null)return;
    if(S.week!==CUPWKS[ri])return;
    const winners=[];
    round.forEach(m=>{
      const [g1,g2]=playKO(teamStr(m.h),teamStr(m.a));
      m.hg=g1;m.ag=g2;winners.push(g1>g2?m.h:m.a);
    });
    if(winners.length>1)cp.rounds.push(consPair(winners));
    else{
      const champ=S.teams[winners[0]];
      const cupN=CUPS.find(x=>x.c===cp.c).n[L];
      pushNews('cupWin',{c:champ.n,tid:champ.id,cup:cupN,ci:cci},'good');
      S.cupHist=S.cupHist||{};
      (S.cupHist[cp.c]=S.cupHist[cp.c]||[]).push({se:S.season,tid:champ.id});
      if(S.cupHist[cp.c].length>20)S.cupHist[cp.c].shift();
      if(S.clients.some(id=>byId(id).team===champ.id))repEvent(1.5);
    }
  });
}
function buildAllFixtures(){
  LEAGUES.forEach((lg,i)=>{
    const tms=S.teams.filter(tm=>tm.lg===i);
    if(lg.grp){
      tms.forEach((tm,k)=>{tm.grp=k%2;}); // alternate by strength order → balanced groups
      const A=tms.filter(tm=>tm.grp===0).map(tm=>tm.id);
      const B=tms.filter(tm=>tm.grp===1).map(tm=>tm.id);
      /* gruplu liglerde grup aşamasının bitişini finalin takip etmesi gerekiyor —
         doğal çift devrede bırakılır, uzatılmaz */
      const fa=makeFixtures(A),fb=makeFixtures(B);
      S.fx[i]=fa.map((r,w)=>r.concat(fb[w]||[]));
    } else S.fx[i]=makeFixtures(tms.map(tm=>tm.id),SEASONW);
  });
}
function totalWeeks(){return Math.max(...S.fx.map(f=>f.length));}
function lgWeeks(lg){return S.fx[lg].length;}
/* Lig adı ülke adı + kademeden üretilir: hem iki dilli olur hem de gerçek lig

function byId(id){return S.players.find(p=>p.id===id);}
/* ===== serbest oyuncular =====
   Sözleşmesi biten ve yenilenmeyen oyuncu team=-1 olur. Kulübü yoktur ama arayüzün
   her yerinde tm.n / tm.c1 / tm.lg okunuyor; bu yüzden gerçek bir takım nesnesi yerine

const FREETM={id:-1,n:'—',ab:'—',c1:'#6b7280',c2:'#3f444c',lg:-1,str:50,bud:0,pts:0,w:0,d:0,l:0,gf:0,ga:0};
function isFree(p){return !p||p.team<0;}
function teamOf(p){return p.team<0?FREETM:S.teams[p.team];}
function freeAgents(){return S.players.filter(p=>p.team<0);}
/* Moralin tek giriş noktası. Maç performansı, transferler, sözleşmeler ve ileride
   eklenecek olaylar hep buradan geçsin — böylece morali etkileyen her şey tek yerde
   sınırlanır ve dengelenebilir. */
/* ===== itibar =====
   Kariyer boyu süren tek ilerleme çizgisi: müşteri kalitesini, kapasiteni ve
   komisyon oranını o belirliyor. Bu yüzden tırmanışın uzun olması gerekiyor.

   Azalan verim: yükseldikçe aynı iş daha az getirir. Adı olmayan menajer için
   orta seviye bir transfer olaydır; adı olan için rutindir. Kayıplar tam değerde
   işler — skandal her seviyede aynı zarar. */
const REP_SOFT=125;          // büyüdükçe kazanç bu eğriyle sönümlenir
function repFactor(){return clamp(1-(S.rep||0)/REP_SOFT,0.15,1);}
function repEvent(delta,raw){
  if(!delta)return S.rep;
  /* skillBonus('repg') — yetenek ağacının itibar kazancına tek dokunduğu yer.
     Kayıplara uygulanmıyor: skandal her seviyede aynı zarar. */
  const gain=delta>0?delta*(1+skillBonus('repg')):delta;
  const d=delta>0&&!raw?gain*repFactor():gain;
  const before=agentLevel();
  S.rep=stat(S.rep+d,0);
  /* Ulaşılan en yüksek itibar ayrıca tutuluyor: yetenek puanları buradan sayılır,
     yoksa itibar düştüğünde harcanmış puanlar borca dönüşürdü. */
  if(S.rep>(S.repMax||0))S.repMax=S.rep;
  /* Seviye atlama haftanın sonunda gösterilecek; burada yalnızca sayılıyor. */
  const up=agentLevel()-before;
  if(up>0)S.lvUp=(S.lvUp||0)+up;
  return S.rep;
}
/* ===== güven =====
   Oyuncuyla aranızdaki ilişki. Moralden ayrı: moral kulübünden ve sahadan gelir,
   güven senden. Olaylar, tuttuğun sözler ve pazarlıklar burayı hareket ettirir. */
function trustOf(p){return p&&p.trust===undefined?55:(p?p.trust:0);}
function trustEvent(p,delta){
  if(!p)return;
  p.trust=stat(trustOf(p)+(delta>0?delta*(1+skillBonus('trust')):delta),0);
  return p.trust;
}
function trustLabel(v){return v>=75?'trHigh':v>=55?'trGood':v>=35?'trMid':'trLow';}
function moraleEvent(p,delta){
  if(!p)return;
  /* skillBonus('mor') — yalnız kendi müşterinin moral kayıplarını yumuşatır.
     Kazançlara dokunmuyor: iyi haberin değeri menajerine göre değişmez. */
  const d=(delta<0&&p.agent==='you')?delta*(1-clamp(skillBonus('mor'),0,0.6)):delta;
  p.morale=stat(p.morale+d,0);
  return p.morale;
}
/* Form ve moral kesirli katkılarla besleniyor; tek ondalıkta tutuluyor ki kayıt
   dosyasında 50.66495834095 gibi değerler birikmesin. Ekranda tam sayı gösterilir. */
function stat(v,lo){return Math.round(clamp(v,lo===undefined?0:lo,100)*10)/10;}
function pushNews(key,params,type,action){
  S.inbox.unshift({w:S.week,se:S.season,key,params,type:type||'info',action,read:false});
