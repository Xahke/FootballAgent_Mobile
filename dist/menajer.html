<!DOCTYPE html>
<html lang="tr" data-theme="dosya">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#f7f8f9">
<meta name="description" content="Futbolcu menajerliği simülasyonu — genç yetenekleri bul, geliştir, kariyerlerini yönet.">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Menajer">
<title>Menajer</title>
<style>
/* OTOMATİK ÜRETİLDİ — bu dosyayı elle düzenleme.
   Kaynak: css/themes/saha.css, css/themes/gazete.css, css/themes/terminal.css, css/themes/dosya.css
   Yeniden üretmek için: node tools/build-themes.js
   Tema, <html data-theme="..."> ile seçilir (js/ui.js → applyTheme). */
/* ===== tema: saha ===== */
html[data-theme="saha"]{
  --bg:#0b111e;             
  --bg2:#0e1526;
  --sur:#131b2e;            
  --sur2:#1a2439;           
  --sur3:#233049;           
  --sur4:#2c3b59;
  --line:rgba(148,168,205,.10);
  --line2:rgba(148,168,205,.20);
  --txt:#edf2fa; --txt2:#a7b3c9; --txt3:#66738d;
  --acc:#1ec97e; --accD:#12a866; --accT:#04160c;
  --acc-soft:rgba(30,201,126,.12);
  --blue:#4d9fff; --blue-soft:rgba(77,159,255,.12);
  --gold:#e9bc5a; --gold-soft:rgba(233,188,90,.12);
  --warn:#e6a23c; --warn-soft:rgba(230,162,60,.12);
  --bad:#f0555d;  --bad-soft:rgba(240,85,93,.12);
  --r:16px; --r-s:12px;
  --sh:0 2px 10px rgba(3,7,15,.45);
  --sh-el:0 6px 22px rgba(3,7,15,.55);
  --tap:.15s cubic-bezier(.3,.7,.4,1);
}
html[data-theme="saha"] *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html[data-theme="saha"]{scrollbar-width:thin;scrollbar-color:var(--sur3) transparent}
html[data-theme="saha"] body{background:var(--bg);color:var(--txt);
  background-image:radial-gradient(900px 340px at 50% -120px,rgba(30,201,126,.07),transparent 70%),
                   radial-gradient(700px 500px at 110% 10%,rgba(77,159,255,.045),transparent 60%);
  background-attachment:fixed;
  font-family:-apple-system,'Segoe UI',Roboto,Helvetica,sans-serif;
  font-size:14.5px;line-height:1.45;max-width:520px;margin:0 auto;min-height:100vh;padding-bottom:92px}
html[data-theme="saha"] b,html[data-theme="saha"] strong{font-weight:700}
html[data-theme="saha"] .num{font-variant-numeric:tabular-nums}
html[data-theme="saha"] header{position:sticky;top:0;z-index:60;background:rgba(11,17,30,.82);backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);padding:9px 12px}
html[data-theme="saha"] .hrow{display:flex;align-items:center;gap:8px}
html[data-theme="saha"] .hback{width:36px;height:36px;border-radius:11px;background:var(--sur2);border:none;color:var(--txt);
  font-size:19px;cursor:pointer;display:none;align-items:center;justify-content:center;flex-shrink:0}
html[data-theme="saha"] .hback.show{display:flex}
html[data-theme="saha"] .hback:active{transform:scale(.92)}
html[data-theme="saha"] .htitle{flex:1;min-width:0}
html[data-theme="saha"] .htitle .t1{font-size:15px;font-weight:800;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
html[data-theme="saha"] .htitle .t2{font-size:10.5px;color:var(--txt3);margin-top:1px;font-variant-numeric:tabular-nums;font-weight:600;
  text-transform:uppercase;letter-spacing:.05em}
html[data-theme="saha"] .hstat{display:flex;align-items:center;gap:5px;background:var(--sur2);border-radius:10px;
  padding:6px 9px;flex-shrink:0;line-height:1}
html[data-theme="saha"] .hstat svg{width:13px;height:13px;flex-shrink:0}
html[data-theme="saha"] .hstat .v{font-size:12.5px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
html[data-theme="saha"] .hstat .l{display:none}
html[data-theme="saha"] .hstat.cash svg{color:var(--acc)}
html[data-theme="saha"] .hstat.rep svg{color:var(--gold)}
html[data-theme="saha"] #btnNext{background:linear-gradient(160deg,var(--acc),var(--accD));color:var(--accT);border:none;border-radius:11px;
  padding:0 15px;height:36px;font-weight:800;font-size:13px;cursor:pointer;flex-shrink:0;font-family:inherit;
  letter-spacing:.01em;box-shadow:0 3px 12px rgba(30,201,126,.28);transition:transform var(--tap)}
html[data-theme="saha"] #btnNext:active{transform:scale(.94)}
html[data-theme="saha"] .langbtn{background:none;border:none;color:var(--txt3);font-size:10.5px;font-weight:800;cursor:pointer;
  padding:4px 2px;letter-spacing:.05em;font-family:inherit}
html[data-theme="saha"] nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:520px;z-index:60;
  padding:0 10px calc(10px + env(safe-area-inset-bottom));pointer-events:none}
html[data-theme="saha"] nav .navin{pointer-events:auto;display:flex;background:rgba(19,27,46,.96);border:1px solid var(--line);
  border-radius:20px;padding:7px 6px;box-shadow:var(--sh-el)}
html[data-theme="saha"] nav button{flex:1;background:none;border:none;color:var(--txt3);font-size:9.5px;font-weight:700;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;gap:3px;padding:2px 0;position:relative;
  letter-spacing:.02em;font-family:inherit;transition:color var(--tap)}
html[data-theme="saha"] nav button .icw{width:44px;height:27px;display:flex;align-items:center;justify-content:center;
  border-radius:13px;transition:background var(--tap)}
html[data-theme="saha"] nav button svg{width:20px;height:20px;transition:transform var(--tap)}
html[data-theme="saha"] nav button.on{color:var(--acc)}
html[data-theme="saha"] nav button.on .icw{background:var(--acc-soft)}
html[data-theme="saha"] nav button:active svg{transform:scale(.88)}
html[data-theme="saha"] nav .nbadge{position:absolute;top:-3px;right:20%;background:var(--bad);color:#fff;font-size:9px;font-weight:800;
  border-radius:9px;min-width:17px;height:17px;padding:0 4px;display:flex;align-items:center;justify-content:center;
  border:2px solid var(--sur);box-shadow:0 2px 6px rgba(240,85,93,.4)}
html[data-theme="saha"] main{padding:14px 14px 20px}
html[data-theme="saha"] #view.vin{animation:vIn__saha .18s ease}
@keyframes vIn__saha{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
html[data-theme="saha"] .card{background:var(--sur);border:none;border-radius:var(--r);padding:15px;margin-bottom:12px;box-shadow:var(--sh)}
html[data-theme="saha"] .card.tight{padding:6px 14px}
html[data-theme="saha"] .list{background:linear-gradient(180deg,var(--sur2),var(--sur));border:none;border-radius:var(--r);
  overflow:hidden;margin-bottom:12px;box-shadow:var(--sh)}
html[data-theme="saha"] .hero{background:linear-gradient(155deg,#182541 0%,#111a2e 55%,#0f1728 100%);
  border:none;border-radius:18px;padding:18px 16px;margin-bottom:12px;position:relative;overflow:hidden;
  box-shadow:var(--sh-el)}
html[data-theme="saha"] .hero::before{content:'';position:absolute;left:0;right:0;top:0;height:2px;
  background:linear-gradient(90deg,transparent,rgba(30,201,126,.65),transparent)}
html[data-theme="saha"] .hero .stripe{position:absolute;left:0;top:0;bottom:0;width:4px;opacity:.9}
html[data-theme="saha"] .hero .hname{font-size:20px;font-weight:800;letter-spacing:-.02em}
html[data-theme="saha"] .hero .hsub{font-size:12px;color:var(--txt2);margin-top:3px;font-variant-numeric:tabular-nums}
html[data-theme="saha"] .sect{font-size:10.5px;color:var(--txt3);text-transform:uppercase;letter-spacing:.1em;font-weight:800;margin-bottom:11px;
  position:relative;padding-left:11px}
html[data-theme="saha"] .sect::before{content:'';position:absolute;left:0;top:50%;transform:translateY(-50%);
  width:3px;height:11px;border-radius:2px;background:var(--acc)}
html[data-theme="saha"] .row{display:flex;align-items:center;gap:10px}
html[data-theme="saha"] .spacer{flex:1}
html[data-theme="saha"] .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
html[data-theme="saha"] .grid3{display:grid;grid-template-columns:1fr 1fr 1fr}
html[data-theme="saha"] .grid4{display:grid;grid-template-columns:repeat(4,1fr)}
html[data-theme="saha"] .stat{text-align:center;padding:4px 2px}
html[data-theme="saha"] .stat .v{font-size:16.5px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
html[data-theme="saha"] .stat .l{font-size:9px;color:var(--txt3);margin-top:3px;text-transform:uppercase;letter-spacing:.07em;font-weight:700}
html[data-theme="saha"] .sub{color:var(--txt2);font-size:12px}
html[data-theme="saha"] .faint{color:var(--txt3)}
html[data-theme="saha"] h2.sec{font-size:17px;font-weight:800;margin:2px 0 12px;letter-spacing:-.02em}
html[data-theme="saha"] .divider{height:1px;background:var(--line);margin:13px 0}
html[data-theme="saha"] .kv{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line);font-size:13px;gap:10px}
html[data-theme="saha"] .kv:last-child{border-bottom:none}
html[data-theme="saha"] .kv .k{color:var(--txt2)}
html[data-theme="saha"] .kv .v{font-weight:700;font-variant-numeric:tabular-nums;text-align:right}
html[data-theme="saha"] .empty{text-align:center;color:var(--txt3);padding:30px 14px;font-size:13px;line-height:1.6}
html[data-theme="saha"] .estate{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;padding:30px 18px}
html[data-theme="saha"] .estate svg{width:34px;height:34px;color:var(--txt3);opacity:.8}
html[data-theme="saha"] .estate b{font-size:14.5px;color:var(--txt);font-weight:800}
html[data-theme="saha"] .estate span{font-size:12px;color:var(--txt3);max-width:250px;line-height:1.55}
html[data-theme="saha"] .tb{border-radius:9px;display:flex;align-items:center;justify-content:center;font-weight:800;flex-shrink:0;
  letter-spacing:.02em;position:relative;overflow:hidden;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.09),0 2px 6px rgba(0,0,0,.35)}
html[data-theme="saha"] .tb i{position:absolute;left:0;right:0;bottom:0;height:22%;font-style:normal}
html[data-theme="saha"] .pitem{display:flex;align-items:center;gap:11px;padding:11px 13px;cursor:pointer;border-bottom:1px solid var(--line);
  position:relative;transition:background var(--tap)}
html[data-theme="saha"] .pitem:last-child{border-bottom:none}
html[data-theme="saha"] .pitem:active{background:var(--sur3)}
html[data-theme="saha"] .pitem.mine{background:linear-gradient(90deg,rgba(30,201,126,.06),transparent 45%)}
html[data-theme="saha"] .pitem.mine::before{content:'';position:absolute;left:0;top:10px;bottom:10px;width:3px;border-radius:0 2px 2px 0;
  background:var(--acc);opacity:.85}
html[data-theme="saha"] .pinfo{flex:1;min-width:0}
html[data-theme="saha"] .pname{font-weight:700;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.01em;
  display:flex;align-items:center;gap:5px}
html[data-theme="saha"] .psub{font-size:11px;color:var(--txt3);margin-top:2.5px;font-variant-numeric:tabular-nums}
html[data-theme="saha"] .rt{font-weight:800;font-size:13.5px;min-width:34px;text-align:center;padding:6px 0;border-radius:10px;
  flex-shrink:0;font-variant-numeric:tabular-nums;color:#fff;letter-spacing:-.01em}
html[data-theme="saha"] .rt.g{background:linear-gradient(160deg,#1ec97e,#0e9c60);box-shadow:0 2px 8px rgba(30,201,126,.25)}
html[data-theme="saha"] .rt.y{background:linear-gradient(160deg,#e6a23c,#c07c10);box-shadow:0 2px 8px rgba(230,162,60,.22)}
html[data-theme="saha"] .rt.o{background:linear-gradient(160deg,#f0555d,#c73940);box-shadow:0 2px 8px rgba(240,85,93,.22)}
html[data-theme="saha"] .mood{width:4px;height:24px;border-radius:3px;flex-shrink:0;background:var(--sur3);position:relative;overflow:hidden}
html[data-theme="saha"] .mood i{position:absolute;left:0;right:0;bottom:0;border-radius:3px;transition:height .25s ease}
html[data-theme="saha"] .star{color:var(--gold);font-size:11px;flex-shrink:0}
html[data-theme="saha"] .gem{width:12px;height:12px;color:var(--gold);flex-shrink:0;filter:drop-shadow(0 0 3px rgba(233,188,90,.5))}
html[data-theme="saha"] .natc{font-size:8.5px;font-weight:800;color:var(--txt3);letter-spacing:.05em;flex-shrink:0}
html[data-theme="saha"] .bigrt{width:60px;height:60px;border-radius:16px;display:flex;flex-direction:column;align-items:center;
  justify-content:center;flex-shrink:0;background:linear-gradient(160deg,var(--sur3),var(--sur2));
  box-shadow:inset 0 0 0 1px var(--line2),0 4px 12px rgba(0,0,0,.4)}
html[data-theme="saha"] .bigrt .n{font-size:23px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
html[data-theme="saha"] .bigrt .l{font-size:7.5px;color:var(--txt3);text-transform:uppercase;margin-top:3px;letter-spacing:.09em;font-weight:800}
html[data-theme="saha"] .bigrt.g{background:linear-gradient(160deg,rgba(30,201,126,.22),rgba(14,156,96,.10));box-shadow:inset 0 0 0 1px rgba(30,201,126,.35)}
html[data-theme="saha"] .bigrt.g .n{color:var(--acc)}
html[data-theme="saha"] .bigrt.y{background:linear-gradient(160deg,rgba(230,162,60,.2),rgba(192,124,16,.08));box-shadow:inset 0 0 0 1px rgba(230,162,60,.32)}
html[data-theme="saha"] .bigrt.y .n{color:var(--warn)}
html[data-theme="saha"] .bigrt.o{background:linear-gradient(160deg,rgba(240,85,93,.2),rgba(199,57,64,.08));box-shadow:inset 0 0 0 1px rgba(240,85,93,.32)}
html[data-theme="saha"] .bigrt.o .n{color:var(--bad)}
html[data-theme="saha"] table{width:100%;border-collapse:collapse;font-size:12.5px;font-variant-numeric:tabular-nums}
html[data-theme="saha"] th{color:var(--txt3);font-size:9px;text-transform:uppercase;letter-spacing:.08em;text-align:left;
  padding:9px 5px;border-bottom:1px solid var(--line);font-weight:800}
html[data-theme="saha"] th.c,html[data-theme="saha"] td.c{text-align:center}
html[data-theme="saha"] td{padding:8.5px 5px;border-bottom:1px solid var(--line)}
html[data-theme="saha"] tr.click{cursor:pointer}
html[data-theme="saha"] tr.click:active td{background:var(--sur3)}
html[data-theme="saha"] tr.hl td{background:rgba(30,201,126,.06)}
html[data-theme="saha"] tr:last-child td{border-bottom:none}
html[data-theme="saha"] .posn{font-weight:700;width:20px;display:inline-flex;align-items:center;justify-content:center;color:var(--txt3);
  position:relative;font-variant-numeric:tabular-nums}
html[data-theme="saha"] tr .posn.zone1,html[data-theme="saha"] tr .posn.zone2,html[data-theme="saha"] tr .posn.zoneR{border-radius:6px;width:20px;height:20px;font-size:11px;color:#fff}
html[data-theme="saha"] .posn.zone1{background:linear-gradient(160deg,var(--gold),#c99334)}
html[data-theme="saha"] .posn.zone2{background:linear-gradient(160deg,var(--blue),#2e77d0)}
html[data-theme="saha"] .posn.zoneR{background:linear-gradient(160deg,var(--bad),#c73940)}
html[data-theme="saha"] .top3 td{background:rgba(233,188,90,.05)}
html[data-theme="saha"] .tabs{display:flex;gap:0;margin-bottom:12px;background:none;border:none;border-bottom:1px solid var(--line);
  padding:0;overflow-x:auto;scrollbar-width:none}
html[data-theme="saha"] .tabs::-webkit-scrollbar{display:none}
html[data-theme="saha"] .tabs button{flex:1;background:none;border:none;color:var(--txt3);border-radius:0;
  padding:9px 10px 9px;font-size:11.5px;cursor:pointer;white-space:nowrap;font-weight:800;font-family:inherit;
  position:relative;letter-spacing:.02em;transition:color var(--tap)}
html[data-theme="saha"] .tabs button.on{color:var(--txt)}
html[data-theme="saha"] .tabs button.on::after{content:'';position:absolute;left:22%;right:22%;bottom:-1px;height:2.5px;border-radius:2px;
  background:var(--acc);box-shadow:0 0 8px rgba(30,201,126,.5)}
html[data-theme="saha"] .chips{display:flex;gap:6px;margin-bottom:11px;flex-wrap:wrap}
html[data-theme="saha"] .chips button{background:var(--sur2);border:none;color:var(--txt2);border-radius:16px;
  padding:6.5px 13px;font-size:11.5px;cursor:pointer;white-space:nowrap;font-weight:700;font-family:inherit;
  transition:all var(--tap)}
html[data-theme="saha"] .chips button:active{transform:scale(.95)}
html[data-theme="saha"] .chips button.on{background:var(--acc-soft);color:var(--acc);box-shadow:inset 0 0 0 1px rgba(30,201,126,.4)}
html[data-theme="saha"] .btn{border:none;border-radius:12px;padding:12px 14px;font-weight:800;font-size:13px;cursor:pointer;
  width:100%;font-family:inherit;letter-spacing:0;transition:transform var(--tap),opacity var(--tap)}
html[data-theme="saha"] .btn:active:not(:disabled){transform:scale(.97)}
html[data-theme="saha"] .btn.p{background:linear-gradient(160deg,var(--acc),var(--accD));color:var(--accT);
  box-shadow:0 3px 14px rgba(30,201,126,.25)}
html[data-theme="saha"] .btn.b{background:var(--sur3);color:var(--txt)}
html[data-theme="saha"] .btn.s{background:none;color:var(--txt2);box-shadow:inset 0 0 0 1px var(--line2)}
html[data-theme="saha"] .btn.d{background:var(--bad-soft);color:var(--bad)}
html[data-theme="saha"] .btn:disabled{opacity:.42;cursor:default}
html[data-theme="saha"] .modal{position:fixed;inset:0;background:rgba(4,8,16,.7);z-index:100;display:none;align-items:flex-end;justify-content:center}
html[data-theme="saha"] .modal.open{display:flex}
html[data-theme="saha"] .sheet{background:linear-gradient(180deg,var(--sur2),var(--sur));border-radius:22px 22px 0 0;width:100%;max-width:520px;
  max-height:88vh;overflow-y:auto;padding:12px 16px calc(22px + env(safe-area-inset-bottom));
  box-shadow:0 -10px 40px rgba(0,0,0,.6)}
html[data-theme="saha"] .sheet.sin{animation:sheetIn__saha .22s cubic-bezier(.2,.8,.3,1)}
@keyframes sheetIn__saha{from{opacity:.4;transform:translateY(26px)}to{opacity:1;transform:none}}
html[data-theme="saha"] .sheet h2{font-size:16.5px;font-weight:800;letter-spacing:-.01em}
html[data-theme="saha"] .handle{width:38px;height:4px;background:var(--sur4);border-radius:2px;margin:0 auto 14px}
html[data-theme="saha"] .negbox{background:var(--bg2);border:none;border-radius:var(--r-s);padding:14px;margin:12px 0;
  box-shadow:inset 0 0 0 1px var(--line)}
html[data-theme="saha"] .roundPill{display:inline-flex;align-items:center;background:var(--sur3);color:var(--txt2);border-radius:9px;
  padding:3px 9px;font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase}
html[data-theme="saha"] .counterCard{margin-top:12px;padding:11px 13px;background:var(--warn-soft);border-radius:11px;font-size:12.5px;
  box-shadow:inset 0 0 0 1px rgba(230,162,60,.3);animation:vIn__saha .2s ease}
html[data-theme="saha"] input[type=range]{width:100%;accent-color:var(--acc);margin-top:8px;height:26px}
html[data-theme="saha"] .moodbar{height:8px;border-radius:5px;background:var(--bg2);overflow:hidden;margin-top:8px;
  box-shadow:inset 0 0 0 1px var(--line)}
html[data-theme="saha"] .moodbar div{height:100%;border-radius:5px;transition:width .28s ease,background .28s ease}
html[data-theme="saha"] .attr{margin-bottom:11px}
html[data-theme="saha"] .attr:last-child{margin-bottom:2px}
html[data-theme="saha"] .attr .arow{display:flex;justify-content:space-between;font-size:11.5px;margin-bottom:5px}
html[data-theme="saha"] .attr .arow b{font-variant-numeric:tabular-nums;font-weight:800}
html[data-theme="saha"] .abar{height:6px;border-radius:4px;background:var(--bg2);overflow:hidden;box-shadow:inset 0 0 0 1px var(--line)}
html[data-theme="saha"] .abar div{height:100%;border-radius:4px;transition:width .3s ease}
html[data-theme="saha"] .tag{display:inline-flex;align-items:center;gap:4px;font-size:10px;font-weight:800;padding:3.5px 9px;border-radius:8px;
  margin:0 5px 5px 0;letter-spacing:.02em}
html[data-theme="saha"] .tag.pos{background:var(--blue-soft);color:var(--blue)}
html[data-theme="saha"] .tag.w{background:var(--warn-soft);color:var(--warn)}
html[data-theme="saha"] .tag.b{background:var(--bad-soft);color:var(--bad)}
html[data-theme="saha"] .tag.g{background:var(--acc-soft);color:var(--acc)}
html[data-theme="saha"] .tag.n{background:var(--sur3);color:var(--txt2)}
html[data-theme="saha"] .tag.gold{background:var(--gold-soft);color:var(--gold)}
html[data-theme="saha"] .msg{padding:12px 14px 12px 16px;background:var(--sur);border:none;border-radius:14px;

/* ===== tema: gazete ===== */
html[data-theme="gazete"]{
   
  --n0:#faf8f4; --n1:#f4f1ea; --n2:#ece8df; --n3:#ded9cd;
  --n4:#c4bdad; --n5:#8c877a; --n6:#5d594f; --n7:#33312b; --n8:#1a1916;

  --bg:var(--n0); --bg2:var(--n1);
  --sur:var(--n0); --sur2:var(--n1); --sur3:var(--n2); --sur4:var(--n3);
  --line:#e2ddd2; --line2:#cec8ba;
  --txt:var(--n8); --txt2:var(--n6); --txt3:var(--n5);

   
  --acc:#1f6b4a; --accD:#17553a; --accT:#faf8f4;
  --acc-soft:#e6efe9;
  --bad:#a3271c;  --bad-soft:#f4e6e3;
  --warn:#7d6320; --warn-soft:#f1ebda;
  --blue:var(--n7); --blue-soft:var(--n2);
  --gold:var(--n8); --gold-soft:var(--n2);

  --r:6px; --r-s:4px;
  --sh:none; --sh-el:none;
  --tap:.12s ease;
  --sans:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;
  --serif:Georgia,'Iowan Old Style','Times New Roman',serif;
}
html[data-theme="gazete"] *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html[data-theme="gazete"]{scrollbar-width:thin;scrollbar-color:var(--n3) transparent}
html[data-theme="gazete"] body{background:var(--bg);color:var(--txt);font-family:var(--sans);
  font-size:15px;line-height:1.45;max-width:520px;margin:0 auto;min-height:100vh;
  padding-bottom:calc(84px + env(safe-area-inset-bottom));
  -webkit-font-smoothing:antialiased}
html[data-theme="gazete"] b,html[data-theme="gazete"] strong{font-weight:700}
html[data-theme="gazete"] .num,html[data-theme="gazete"] [class*=num]{font-variant-numeric:tabular-nums}
html[data-theme="gazete"] header{position:sticky;top:0;z-index:60;background:var(--bg);
  border-bottom:1px solid var(--n8);padding:8px 14px calc(8px);
  padding-top:calc(8px + env(safe-area-inset-top))}
html[data-theme="gazete"] .hrow{display:flex;align-items:center;gap:10px;min-height:44px}
html[data-theme="gazete"] .hback{width:44px;height:44px;margin-left:-12px;border-radius:4px;background:none;border:none;color:var(--txt);
  font-size:26px;line-height:1;cursor:pointer;display:none;align-items:center;justify-content:center;flex-shrink:0}
html[data-theme="gazete"] .hback.show{display:flex}
html[data-theme="gazete"] .htitle{flex:1;min-width:0}
html[data-theme="gazete"] .htitle .t1{font-family:var(--serif);font-size:19px;font-weight:700;letter-spacing:-.015em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.15}
html[data-theme="gazete"] .htitle .t2{font-size:11.5px;color:var(--txt3);margin-top:1px;font-variant-numeric:tabular-nums;font-weight:400}
html[data-theme="gazete"] .hstat{display:flex;align-items:baseline;gap:5px;padding:0;flex-shrink:0;line-height:1.1;
  border-left:1px solid var(--line);padding-left:10px;min-height:28px;align-items:center}

html[data-theme="gazete"] #btnNext{background:var(--n8);color:var(--n0);border:none;border-radius:4px;
  padding:0 16px;min-height:44px;height:44px;font-weight:700;font-size:14px;cursor:pointer;flex-shrink:0;
  font-family:var(--sans);transition:opacity var(--tap)}
html[data-theme="gazete"] #btnNext:active{opacity:.7}
html[data-theme="gazete"] .langbtn{background:none;border:none;color:var(--txt3);font-size:12px;font-weight:600;cursor:pointer;
  min-width:44px;min-height:44px;font-family:var(--sans);text-decoration:underline;
  text-decoration-color:var(--n4);text-underline-offset:3px}
html[data-theme="gazete"] nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:520px;z-index:60;

  min-height:46px;font-family:var(--sans);transition:color var(--tap)}
html[data-theme="gazete"] nav button .icw{width:44px;height:24px;display:flex;align-items:center;justify-content:center}
html[data-theme="gazete"] nav button svg{width:19px;height:19px}

html[data-theme="terminal"]{
  --n0:#0d0e10; --n1:#131417; --n2:#1a1c20; --n3:#23262b;
  --n4:#33373e; --n5:#6b7280; --n6:#8f96a0; --n7:#c3c8cf; --n8:#eceef1;

  --bg:var(--n0); --bg2:var(--n1);
  --sur:var(--n0); --sur2:var(--n1); --sur3:var(--n2); --sur4:var(--n3);
  --line:#20232800; --line:#1f2226; --line2:#2b2f35;
  --txt:var(--n8); --txt2:var(--n6); --txt3:var(--n5);

   
  --acc:#4f9c6b; --accD:#3d7d55; --accT:#0d0e10;
  --acc-soft:#14201a;
  --bad:#c2564d;  --bad-soft:#221615;
  --warn:#a8863c; --warn-soft:#1f1b13;
  --blue:var(--n7); --blue-soft:var(--n2);
  --gold:var(--n8); --gold-soft:var(--n2);

  --r:8px; --r-s:5px;
  --sh:none; --sh-el:none;
  --tap:.12s ease;
  --sans:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;
  --mono:ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace;
}
html[data-theme="terminal"] *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html[data-theme="terminal"]{scrollbar-width:thin;scrollbar-color:var(--n3) transparent}
html[data-theme="terminal"] body{background:var(--bg);color:var(--txt);font-family:var(--sans);
  font-size:14.5px;line-height:1.45;max-width:520px;margin:0 auto;min-height:100vh;
  padding-bottom:calc(80px + env(safe-area-inset-bottom));-webkit-font-smoothing:antialiased}
html[data-theme="terminal"] b,html[data-theme="terminal"] strong{font-weight:600}
html[data-theme="terminal"] .num{font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
html[data-theme="terminal"] header{position:sticky;top:0;z-index:60;background:var(--bg);border-bottom:1px solid var(--line2);
  padding:6px 12px;padding-top:calc(6px + env(safe-area-inset-top))}
html[data-theme="terminal"] .hrow{display:flex;align-items:center;gap:8px;min-height:44px}
html[data-theme="terminal"] .hback{width:44px;height:44px;margin-left:-10px;border-radius:6px;background:none;border:none;color:var(--txt2);
  font-size:24px;line-height:1;cursor:pointer;display:none;align-items:center;justify-content:center;flex-shrink:0}
html[data-theme="terminal"] .hback.show{display:flex}
html[data-theme="terminal"] .hback:active{background:var(--n2)}
html[data-theme="terminal"] .htitle{flex:1;min-width:0}
html[data-theme="terminal"] .htitle .t1{font-size:15.5px;font-weight:600;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis;line-height:1.2}
html[data-theme="terminal"] .htitle .t2{font-family:var(--mono);font-size:10.5px;color:var(--txt3);margin-top:2px;font-weight:400;
  text-transform:none;letter-spacing:0}
html[data-theme="terminal"] .hstat{display:flex;flex-direction:column;align-items:flex-end;gap:0;background:none;border-radius:0;
  padding:0 0 0 12px;flex-shrink:0;line-height:1.25;border-left:1px solid var(--line2)}
html[data-theme="terminal"] .hstat svg{display:none}
html[data-theme="terminal"] .hstat .v{font-family:var(--mono);font-size:13px;font-weight:600;letter-spacing:-.02em;color:var(--txt)}
html[data-theme="terminal"] .hstat .l{display:block;font-size:9.5px;color:var(--txt3);font-weight:400}
html[data-theme="terminal"] .hstat.cash .v{color:var(--txt)}
html[data-theme="terminal"] #btnNext{background:var(--n8);color:var(--n0);border:none;border-radius:6px;padding:0 14px;height:44px;
  min-height:44px;font-weight:600;font-size:13.5px;cursor:pointer;flex-shrink:0;font-family:var(--sans);
  transition:opacity var(--tap)}
html[data-theme="terminal"] #btnNext:active{opacity:.7}
html[data-theme="terminal"] .langbtn{background:none;border:none;color:var(--txt3);font-family:var(--mono);font-size:11px;font-weight:400;
  cursor:pointer;min-width:44px;min-height:44px}
html[data-theme="terminal"] nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:520px;z-index:60;
  padding:0;pointer-events:none;background:var(--bg);border-top:1px solid var(--line2)}
html[data-theme="terminal"] nav .navin{pointer-events:auto;display:flex;padding:2px 2px calc(2px + env(safe-area-inset-bottom))}
html[data-theme="terminal"] nav button{flex:1;background:none;border:none;color:var(--txt3);font-size:10px;font-weight:400;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;gap:2px;padding:5px 0;position:relative;min-height:46px;
  font-family:var(--sans);transition:color var(--tap)}
html[data-theme="terminal"] nav button .icw{width:44px;height:22px;display:flex;align-items:center;justify-content:center}
html[data-theme="terminal"] nav button svg{width:19px;height:19px}
html[data-theme="terminal"] nav button.on{color:var(--txt)}
html[data-theme="terminal"] nav button.on .icw::before{content:'';position:absolute;top:0;left:50%;transform:translateX(-50%);
  width:22px;height:2px;background:var(--n8)}
html[data-theme="terminal"] nav .nbadge{position:absolute;top:3px;right:calc(50% - 21px);background:var(--bad);color:#fff;
  font-family:var(--mono);font-size:9.5px;font-weight:600;border-radius:8px;min-width:16px;height:16px;
  padding:0 4px;display:flex;align-items:center;justify-content:center}
html[data-theme="terminal"] main{padding:12px 12px 22px}
html[data-theme="terminal"] #view.vin{animation:vIn__terminal .12s ease}
@keyframes vIn__terminal{from{opacity:0}to{opacity:1}}
html[data-theme="terminal"] .card{background:none;border:none;border-top:1px solid var(--line);border-radius:0;padding:12px 0 14px;margin-bottom:0}
html[data-theme="terminal"] .card:first-child{border-top:none;padding-top:2px}
html[data-theme="terminal"] .card.tight{padding:6px 0 10px}
html[data-theme="terminal"] .list{background:none;border:none;border-top:1px solid var(--line);border-radius:0;margin-bottom:14px}
html[data-theme="terminal"] .hero{background:var(--n1);border:1px solid var(--line2);border-radius:10px;padding:14px;margin-bottom:12px;
  position:relative;overflow:hidden}
html[data-theme="terminal"] .hero::before{display:none}
html[data-theme="terminal"] .hero .stripe{position:absolute;left:0;top:0;bottom:0;width:3px}
html[data-theme="terminal"] .hero .hname{font-size:21px;font-weight:600;letter-spacing:-.02em;line-height:1.15}
html[data-theme="terminal"] .hero .hsub{font-family:var(--mono);font-size:11.5px;color:var(--txt2);margin-top:4px;letter-spacing:-.01em}
html[data-theme="terminal"] .sect{font-size:12px;color:var(--txt3);text-transform:none;letter-spacing:0;font-weight:600;margin-bottom:8px;
  padding:0;position:relative}
html[data-theme="terminal"] .sect::before{display:none}
html[data-theme="terminal"] .row{display:flex;align-items:center;gap:10px}
html[data-theme="terminal"] .spacer{flex:1}
html[data-theme="terminal"] .grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
html[data-theme="terminal"] .grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:0}
html[data-theme="terminal"] .grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:0}
html[data-theme="terminal"] .stat{text-align:right;padding:2px 10px 2px 0;border-right:1px solid var(--line)}
html[data-theme="terminal"] .grid3 .stat:last-child,html[data-theme="terminal"] .grid4 .stat:last-child{border-right:none;padding-right:0}
html[data-theme="terminal"] .stat .v{font-family:var(--mono);font-size:19px;font-weight:600;letter-spacing:-.03em;line-height:1.1}
html[data-theme="terminal"] .stat .l{font-size:10.5px;color:var(--txt3);margin-top:3px;text-transform:none;letter-spacing:0;font-weight:400}
html[data-theme="terminal"] .sub{color:var(--txt2);font-size:12.5px}
html[data-theme="terminal"] .faint{color:var(--txt3)}
html[data-theme="terminal"] h2.sec{font-size:19px;font-weight:600;margin:0 0 6px;letter-spacing:-.02em}
html[data-theme="terminal"] .divider{height:1px;background:var(--line);margin:12px 0}
html[data-theme="terminal"] .kv{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line);
  font-size:13px;gap:10px}
html[data-theme="terminal"] .kv:last-child{border-bottom:none}
html[data-theme="terminal"] .kv .k{color:var(--txt2);font-weight:400}
html[data-theme="terminal"] .kv .v{font-family:var(--mono);font-weight:500;letter-spacing:-.02em;text-align:right}
html[data-theme="terminal"] .empty{text-align:center;color:var(--txt3);padding:30px 14px;font-size:13px;line-height:1.6}
html[data-theme="terminal"] .estate{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;padding:32px 18px}
html[data-theme="terminal"] .estate svg{width:24px;height:24px;color:var(--n4)}
html[data-theme="terminal"] .estate b{font-size:15px;color:var(--txt);font-weight:600}
html[data-theme="terminal"] .estate span{font-size:12.5px;color:var(--txt3);max-width:250px;line-height:1.55}
html[data-theme="terminal"] .tb{border-radius:3px;display:flex;align-items:center;justify-content:center;font-weight:600;flex-shrink:0;
  position:relative;overflow:hidden;font-size:10px;letter-spacing:.01em}
html[data-theme="terminal"] .tb i{position:absolute;left:0;right:0;bottom:0;height:20%;font-style:normal}
html[data-theme="terminal"] .pitem{display:flex;align-items:center;gap:11px;padding:10px 0;cursor:pointer;border-bottom:1px solid var(--line);
  position:relative;min-height:54px;transition:background var(--tap)}
html[data-theme="terminal"] .pitem:last-child{border-bottom:none}
html[data-theme="terminal"] .pitem:active{background:var(--n1)}
html[data-theme="terminal"] .pitem.mine{background:none}
html[data-theme="terminal"] .pitem.mine::before{content:'';position:absolute;left:-12px;top:0;bottom:0;width:2px;background:var(--n7)}
html[data-theme="terminal"] .pinfo{flex:1;min-width:0}
html[data-theme="terminal"] .pname{font-weight:500;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  letter-spacing:-.01em;display:flex;align-items:center;gap:6px}
html[data-theme="terminal"] .psub{font-family:var(--mono);font-size:11px;color:var(--txt3);margin-top:3px;letter-spacing:-.02em}
html[data-theme="terminal"] .rt{font-family:var(--mono);font-weight:600;font-size:15px;min-width:30px;text-align:right;padding:0;
  border-radius:0;flex-shrink:0;color:var(--txt);letter-spacing:-.03em;background:none}
html[data-theme="terminal"] .rt.g{color:var(--txt)}
html[data-theme="terminal"] .rt.y{color:var(--txt2)}
html[data-theme="terminal"] .rt.o{color:var(--txt3)}
html[data-theme="terminal"] .mood{width:2px;height:26px;border-radius:0;flex-shrink:0;background:var(--n3);position:relative;overflow:hidden}
html[data-theme="terminal"] .mood i{position:absolute;left:0;right:0;bottom:0}
html[data-theme="terminal"] .star{color:var(--txt2);font-size:10px;flex-shrink:0}
html[data-theme="terminal"] .gem{width:11px;height:11px;color:var(--txt2);flex-shrink:0}
html[data-theme="terminal"] .natc{font-family:var(--mono);font-size:10px;font-weight:400;color:var(--txt3);flex-shrink:0;letter-spacing:0}
html[data-theme="terminal"] .bigrt{width:auto;min-width:54px;height:auto;border-radius:0;display:flex;flex-direction:column;
  align-items:flex-end;justify-content:center;flex-shrink:0;background:none;
  border-left:1px solid var(--line2);padding-left:12px;box-shadow:none}
html[data-theme="terminal"] .bigrt .n{font-family:var(--mono);font-size:30px;font-weight:600;line-height:1;letter-spacing:-.04em}
html[data-theme="terminal"] .bigrt .l{font-size:10px;color:var(--txt3);text-transform:none;margin-top:3px;letter-spacing:0;font-weight:400}
html[data-theme="terminal"] .bigrt.g,html[data-theme="terminal"] .bigrt.y,html[data-theme="terminal"] .bigrt.o{background:none;box-shadow:none}
html[data-theme="terminal"] .bigrt.g .n,html[data-theme="terminal"] .bigrt.y .n,html[data-theme="terminal"] .bigrt.o .n{color:var(--txt)}
html[data-theme="terminal"] table{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
html[data-theme="terminal"] th{color:var(--txt3);font-size:10.5px;text-transform:none;letter-spacing:0;text-align:left;padding:7px 4px;
  border-bottom:1px solid var(--line2);font-weight:400}
html[data-theme="terminal"] th.c,html[data-theme="terminal"] td.c{text-align:right}
html[data-theme="terminal"] td{padding:10px 4px;border-bottom:1px solid var(--line)}
html[data-theme="terminal"] td.c{font-family:var(--mono);letter-spacing:-.02em;color:var(--txt2)}
html[data-theme="terminal"] td.c b{color:var(--txt);font-weight:600}
html[data-theme="terminal"] tr.click{cursor:pointer}
html[data-theme="terminal"] tr.click:active td{background:var(--n1)}
html[data-theme="terminal"] tr.hl td{background:var(--n1)}
html[data-theme="terminal"] tr.hl td b{color:var(--txt)}
html[data-theme="terminal"] tr:last-child td{border-bottom:none}
html[data-theme="terminal"] .posn{font-family:var(--mono);font-weight:400;width:20px;display:inline-flex;align-items:center;
  justify-content:flex-end;color:var(--txt3);position:relative;font-size:11.5px}
html[data-theme="terminal"] tr .posn.zone1,html[data-theme="terminal"] tr .posn.zone2,html[data-theme="terminal"] tr .posn.zoneR{border-radius:0;width:20px;height:auto;font-size:11.5px;
  background:none;color:var(--txt2)}
html[data-theme="terminal"] .posn.zone1::after,html[data-theme="terminal"] .posn.zone2::after,html[data-theme="terminal"] .posn.zoneR::after{content:'';position:absolute;left:-7px;top:50%;
  transform:translateY(-50%);width:2px;height:13px}
html[data-theme="terminal"] .posn.zone1::after{background:var(--n7)}
html[data-theme="terminal"] .posn.zone2::after{background:var(--n4)}
html[data-theme="terminal"] .posn.zoneR::after{background:var(--bad)}
html[data-theme="terminal"] .top3 td{background:none}
html[data-theme="terminal"] .tabs{display:flex;gap:2px;margin-bottom:12px;background:none;border:none;border-bottom:1px solid var(--line2);
  padding:0;overflow-x:auto;scrollbar-width:none}
html[data-theme="terminal"] .tabs::-webkit-scrollbar{display:none}
html[data-theme="terminal"] .tabs button{flex:0 0 auto;background:none;border:none;color:var(--txt3);border-radius:0;padding:0 10px 8px;
  min-height:44px;font-size:13px;cursor:pointer;white-space:nowrap;font-weight:400;font-family:var(--sans);
  position:relative;transition:color var(--tap)}
html[data-theme="terminal"] .tabs button.on{color:var(--txt);font-weight:500}
html[data-theme="terminal"] .tabs button.on::after{content:'';position:absolute;left:10px;right:10px;bottom:-1px;height:2px;background:var(--n8)}
html[data-theme="terminal"] .chips{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
html[data-theme="terminal"] .chips button{background:none;border:1px solid var(--line2);color:var(--txt3);border-radius:6px;
  padding:0 12px;min-height:44px;font-size:12.5px;cursor:pointer;white-space:nowrap;font-weight:400;
  font-family:var(--sans);transition:all var(--tap)}
html[data-theme="terminal"] .chips button.on{background:var(--n2);color:var(--txt);border-color:var(--n4)}
html[data-theme="terminal"] .btn{border:1px solid var(--line2);border-radius:6px;padding:0 14px;min-height:44px;font-weight:500;font-size:13.5px;
  cursor:pointer;width:100%;font-family:var(--sans);background:none;color:var(--txt);transition:opacity var(--tap)}
html[data-theme="terminal"] .btn:active:not(:disabled){opacity:.7}
html[data-theme="terminal"] .btn.p{background:var(--n8);color:var(--n0);border-color:var(--n8);font-weight:600}
html[data-theme="terminal"] .btn.b{background:var(--n2);color:var(--txt);border-color:var(--n3)}
html[data-theme="terminal"] .btn.s{background:none;color:var(--txt2);border-color:var(--line2)}
html[data-theme="terminal"] .btn.d{background:none;color:var(--bad);border-color:#3a2320}
html[data-theme="terminal"] .btn:disabled{opacity:.4;cursor:default}
html[data-theme="terminal"] .modal{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:100;display:none;align-items:flex-end;
  justify-content:center}
html[data-theme="terminal"] .modal.open{display:flex}
html[data-theme="terminal"] .sheet{background:var(--n1);border-radius:12px 12px 0 0;width:100%;max-width:520px;border-top:1px solid var(--n4);
  max-height:88vh;overflow-y:auto;padding:10px 14px calc(22px + env(safe-area-inset-bottom))}
html[data-theme="terminal"] .sheet.sin{animation:sheetIn__terminal .2s ease}
@keyframes sheetIn__terminal{from{transform:translateY(18px)}to{transform:none}}
html[data-theme="terminal"] .sheet h2{font-size:18px;font-weight:600;letter-spacing:-.02em}
html[data-theme="terminal"] .handle{width:34px;height:3px;background:var(--n4);border-radius:2px;margin:0 auto 14px}
html[data-theme="terminal"] .negbox{background:var(--n0);border:1px solid var(--line2);border-radius:var(--r-s);padding:12px 14px;margin:12px 0}
html[data-theme="terminal"] .roundPill{display:inline-flex;align-items:center;background:none;color:var(--txt3);border-radius:4px;
  padding:2px 6px;font-family:var(--mono);font-size:10.5px;font-weight:400;letter-spacing:0;text-transform:none;
  border:1px solid var(--line2)}
html[data-theme="terminal"] .counterCard{margin-top:12px;padding:11px 12px;background:var(--n0);border:1px solid var(--line2);
  border-left:2px solid var(--warn);border-radius:var(--r-s);font-size:12.5px;color:var(--txt2)}
html[data-theme="terminal"] input[type=range]{width:100%;accent-color:var(--n7);margin-top:10px;height:44px}
html[data-theme="terminal"] .moodbar{height:3px;border-radius:0;background:var(--n3);overflow:hidden;margin-top:9px}
html[data-theme="terminal"] .moodbar div{height:100%;transition:width .25s ease}
html[data-theme="terminal"] .attr{margin-bottom:11px}
html[data-theme="terminal"] .attr:last-child{margin-bottom:2px}
html[data-theme="terminal"] .attr .arow{display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:5px}
html[data-theme="terminal"] .attr .arow b{font-family:var(--mono);font-weight:600;letter-spacing:-.02em}
html[data-theme="terminal"] .abar{height:3px;border-radius:0;background:var(--n3);overflow:hidden}
html[data-theme="terminal"] .abar div{height:100%;transition:width .25s ease}
html[data-theme="terminal"] .tag{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:400;padding:3px 8px;
  border-radius:4px;margin:0 5px 5px 0;background:var(--n2);color:var(--txt2);border:1px solid var(--line2)}
html[data-theme="terminal"] .tag.pos{background:var(--n2);color:var(--txt)}
html[data-theme="terminal"] .tag.w{background:none;color:var(--warn);border-color:#332b18}
html[data-theme="terminal"] .tag.b{background:none;color:var(--bad);border-color:#3a2320}
html[data-theme="terminal"] .tag.g{background:var(--n3);color:var(--txt);border-color:var(--n4)}
html[data-theme="terminal"] .tag.n{background:var(--n2);color:var(--txt2)}
html[data-theme="terminal"] .tag.gold{background:var(--n2);color:var(--txt)}
html[data-theme="terminal"] .msg{padding:12px 0 12px 12px;background:none;border:none;border-bottom:1px solid var(--line);border-radius:0;
  margin-bottom:0;position:relative}
html[data-theme="terminal"] .msg::before{content:'';position:absolute;left:0;top:14px;width:4px;height:4px;border-radius:50%;
  background:var(--n4)}
html[data-theme="terminal"] .msg.info::before{background:var(--n5)}
html[data-theme="terminal"] .msg.good::before{background:var(--acc)}
html[data-theme="terminal"] .msg.warn::before{background:var(--warn)}
html[data-theme="terminal"] .msg.bad::before{background:var(--bad)}
html[data-theme="terminal"] .msg.act{background:none}
html[data-theme="terminal"] .msg.act::before{background:var(--n8)}
html[data-theme="terminal"] .msg .mw{font-family:var(--mono);font-size:10.5px;color:var(--txt3);text-transform:none;letter-spacing:0;font-weight:400}
html[data-theme="terminal"] .msg .mt{font-size:14px;margin-top:4px;line-height:1.5;text-wrap:pretty;color:var(--txt7,var(--txt))}
html[data-theme="terminal"] .msg .mrow{display:flex;gap:8px;margin-top:11px}
html[data-theme="terminal"] .msg .mrow .btn{min-height:44px;font-size:13px}
html[data-theme="terminal"] .lnk{cursor:pointer;text-decoration:underline;text-decoration-color:var(--n4);text-underline-offset:3px;font-weight:500}
html[data-theme="terminal"] .lnk:active{color:var(--acc)}
html[data-theme="terminal"] a{color:var(--txt);text-decoration:underline;text-decoration-color:var(--n4);text-underline-offset:3px}
html[data-theme="terminal"] a:hover{color:var(--acc);text-decoration-color:var(--acc)}
html[data-theme="terminal"] .matchrow{display:flex;align-items:center;font-size:13px;padding:0;min-height:44px;
  border-bottom:1px solid var(--line);gap:9px}
html[data-theme="terminal"] .matchrow:last-child{border-bottom:none}
html[data-theme="terminal"] .matchrow .tn{flex:1;font-weight:400;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  color:var(--txt2)}
html[data-theme="terminal"] .matchrow .tn.r{text-align:right}
html[data-theme="terminal"] .matchrow .sc{font-family:var(--mono);font-weight:600;min-width:52px;text-align:center;font-size:13px;
  background:none;border-radius:0;padding:0;letter-spacing:-.02em;color:var(--txt)}
html[data-theme="terminal"] .matchrow .sc.f{color:var(--txt3);font-weight:400;background:none}

/* ================= STATE / HELPERS ================= */
let S=null, negCtx=null;

const RF=()=>Math.random();
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const fmtK=v=>v>=1000?(v/1000).toFixed(2).replace(/\.?0+$/,'')+'M €':Math.round(v)+'K €';
const fmtM=v=>v.toFixed(1).replace(/\.0$/,'')+'M €';
/* ===== piyasa eğrileri =====
   Modern futbolun ölçeğine yakın dursun: alt liglerde birkaç bin, üst düzeyde
   yüz binlerce euro haftalık; bonservisler on milyonlarla yüz milyonlar arasında.
   Referans: 60 ≈ ikinci lig oturmuş oyuncu, 70 ≈ üst lig ilk 11, 80 ≈ üst lig
   yıldızı, 88+ ≈ dünya çapında. Değer maaştan daha dik artar — futbolda da öyle. */
const marketWage=r=>Math.max(1,Math.round(8*Math.pow(1.129,r-60)));
const marketValue=r=>{
  const v=2*Math.pow(1.145,r-60);
  return v<10?+v.toFixed(1):Math.round(v);   // küçük değerlerde ondalık, büyükte tam sayı
};
/* Menajerlik komisyonu itibara bağlıdır: adı olmayan menajer düşük oranla çalışır,
   aranan menajer masaya kendi oranını koyar. */
function commissionRate(){return +(0.05+(S.rep/100)*0.10).toFixed(3);}
function commissionPct(){return Math.round(commissionRate()*100);}
function lum(hex){const n=parseInt(hex.slice(1),16);return 0.299*(n>>16)+0.587*((n>>8)&255)+0.114*(n&255);}
function tmBadge(tm,size){
  const s=size||36, f=Math.round(s*0.28);
  const txt=lum(tm.c1)>150?'#16181c':'#fff';
  return `<div class="tb" style="width:${s}px;height:${s}px;font-size:${f}px;color:${txt};background:${tm.c1}">
    ${tm.ab||tm.n.slice(0,3)}<i style="background:${tm.c2}"></i></div>`;
}

function genName(nat){
  const pool=NATS[nat];
  return pool.f[R(0,pool.f.length-1)]+' '+pool.l[R(0,pool.l.length-1)];
}

  if(RF()<0.62)return domestic;

  const w={br:3,ar:2,fr:1.5,es:1.2,nl:1.2,de:1,it:1,en:0.8,tr:0.8,pt:1,mx:0.8,us:0.5,jp:0.3,sa:0.2,eg:0.4,ma:0.4,ng:0.5,sn:0.5,gh:0.4,cm:0.4,be:0.8,hr:0.6,rs:0.6,pl:0.6,cz:0.4,gr:0.4,no:0.4,se:0.5,dk:0.5,ch:0.5,at:0.4,ua:0.5,ro:0.3,sct:0.4,ie:0.3,ru:0.4,co:0.9,uy:0.6,cl:0.5,pe:0.4,ec:0.4,py:0.3,ve:0.3,ci:0.6,dz:0.5,tn:0.4,ml:0.4,cd:0.4,kr:0.4,ir:0.3,au:0.3,cn:0.2};
  let tot=0;others.forEach(n=>tot+=w[n]||1);
  let x=RF()*tot;
  for(const n of others){x-=(w[n]||1);if(x<=0)return n;}
  return others[0];
}
/* yaş → güç eğrisi: genç oyuncu kulübünün seviyesinin belirgin altında başlar,
   zirveye 24-30 arasında ulaşır, sonra geriler. forceAge verilirse r/pot O yaşa göre hesaplanır. */
function genPlayer(team,pos,forceAge){
  const str=team.str;
  const nat=pickNat(LEAGUES[team.lg].nat);
  const low=str<=60;
  const age=forceAge||(low?(RF()<0.5?R(16,21):R(22,32)):R(17,34));
  let r;
  if(age<=17)r=clamp(R(str-24,str-14),35,70);
  else if(age<=19)r=clamp(R(str-19,str-10),35,78);
  else if(age<=21)r=clamp(R(str-14,str-4),35,84);
  else if(age<=23)r=clamp(R(str-9,str+2),38,88);
  else if(age<=30)r=clamp(R(str-7,str+4),40,93);
  else r=clamp(R(str-9,str+2),38,90);
  let pot;
  if(age<=21){
    pot=r+(age<=17?R(8,20):age<=19?R(6,17):R(4,13));
    const w=RF();
    if(w<0.007)pot=r+R(30,45);      // gerçek wonderkid — çok nadir
    else if(w<0.045)pot=r+R(18,30); // yüksek potansiyel — nadir
  } else if(age<=23)pot=r+R(2,9);
  else if(age<=26)pot=r+R(0,4);
  else pot=r+R(0,1);
  pot=clamp(pot,r,96);
  /* 90+ potansiyel gerçekten nadir olsun: yolu ne olursa olsun küresel eleme */
  if(pot>=90&&r<88&&RF()>0.15)pot=clamp(89-R(0,4),r,96);
  return {id:PID++,n:genName(nat),nat,age,pos:pos||POS[R(0,3)],r,pot,
    team:team.id,wage:Math.max(1,Math.round(marketWage(r)*(0.75+RF()*0.35))),yrs:R(1,4),
    morale:R(55,85),form:R(40,70),g:0,a:0,app:0,min:0,rtSum:0,rtN:0,l5:[],agent:RF()<(low?0.25:0.45)?'rival':null,ignored:0,
    h:R(168,196),ft:RF()<0.74?'R':'L',hist:[],seasons:[]};
}
/* ===== kariyer sonu & kadro yenilenmesi =====
   Kulüpler her sezon kadronun bir kısmını yeniler: yaşlananlar bırakır,
   seviyeyi hiç yakalayamayanlar sessizce elenir. Yerlerine çoğunlukla genç,
   bir kısmı hazır oyuncu gelir — böylece yaş piramidi kendini korur. */
function careerEndProb(p,lvl){
  if(p.age>=38)return 1;
  if(p.age>=34)return 0.30+(p.age-34)*0.20+(p.r<lvl-5?0.18:0);
  if(p.age>=31)return 0.08+(p.r<lvl-6?0.12:0);
  if(p.age>=24&&p.pot<lvl-11)return 0.13; // seviyeyi yakalayamadı
  return 0;
}
function intakeAge(){const w=RF();return w<0.66?R(16,20):w<0.89?R(21,24):R(25,28);}
/* Sözleşmesi biten oyuncuyu kulüp tutar mı? Seviyeye katkısı, yaşı ve potansiyeli belirler. */
function renewProb(p,lvl){
  let q=0.74+(p.r-lvl)*0.045;
  if(p.age<=23&&p.pot-p.r>=6)q+=0.22;  // geleceği olan genç bırakılmaz
  if(p.age>=33)q-=0.38;
  if(p.r<lvl-6)q-=0.28;                // kadroya katkısı yok
  return clamp(q,0.04,0.96);
}
/* Kulüpten ayrıldı: artık kulüpsüz. Kadroda açılan yeri sezon sonu dengelemesi doldurur. */
function releaseToFree(p){

}

const SEASONW=38;   // sezon uzunluğu hedefi (en kalabalık ligin çift devresi)
function makeFixtures(idList,targetW){
  let ids=[...idList];
  if(ids.length%2)ids.push(-1); // bye for odd-sized groups
  const n=ids.length,rounds=[];
  for(let r=0;r<n-1;r++){
    const ms=[];
    for(let i=0;i<n/2;i++){
      const h=ids[i],a=ids[n-1-i];
      if(h!==-1&&a!==-1)ms.push(r%2?{h:a,a:h}:{h,a});
    }
    rounds.push(ms);ids.splice(1,0,ids.pop());
  }
  /* Ligler farklı uzunlukta olabilir — 18 takımlı lig 34, 20 takımlı 38 hafta oynar,
     bu gerçekçidir. Sorun yalnızca çift devrenin sezona sığmadığı liglerde: 24 takımlı
     bir lig tek devrede 23 haftada biter, kalan 15 hafta boş geçerdi. Orada rövanşların
     sığdığı kadarı eklenir; her takım yine eşit sayıda maç yapar. */
  const rev=rounds.map(ms=>ms.map(m=>({h:m.a,a:m.h})));
  const cap=targetW||Infinity;
  const all=(2*rounds.length<=cap)?[...rounds,...rev]
           :[...rounds,...rev.slice(0,Math.max(0,cap-rounds.length))];
  return all.map(ms=>ms.map(m=>({...m,hg:null,ag:null})));
}
/* ===== continental cups ===== */
function seedPair(ids){const r=[];for(let i=0;i<ids.length/2;i++)r.push({h:ids[i],a:ids[ids.length-1-i],hg:null,ag:null});return r;}
function consPair(ids){const r=[];for(let i=0;i<ids.length;i+=2)r.push({h:ids[i],a:ids[i+1],hg:null,ag:null});return r;}
function seedCups(){
  /* katılım: 8 Avrupa liginin bitiş sıralamasından — 1-2. sıra EC1, 3-4. EC2, 5-6. EC3 */
  const order=['EN1','ES1','DE1','IT1','FR1','TR1','NL1','PT1'];
  const perLg=order.map(c=>{
    const i=LEAGUES.findIndex(l=>l.c===c);
    return leagueTable(i).map(tm=>tm.id);
  });
  const pool=[];
  for(let pos=0;pos<6;pos++)perLg.forEach(lst=>{if(lst[pos]!==undefined)pool.push(lst[pos]);});
  S.cups=CUPS.map((cp,ci)=>({c:cp.c,rounds:[seedPair(pool.slice(ci*16,ci*16+16))]}));
}
function playKO(sh,sa){
  let g1=poisson(clamp(1.3*Math.pow(sh/sa,2.4),0.3,4)),g2=poisson(clamp(1.1*Math.pow(sa/sh,2.4),0.3,4));
  if(g1===g2){if(RF()<0.5)g1++;else g2++;}
  return [g1,g2];
}
function simCups(){
  (S.cups||[]).forEach((cp,cci)=>{
    const ri=cp.rounds.length-1;
    const round=cp.rounds[ri];
    if(!round||!round.length||round[0].hg!==null)return;
    if(S.week!==CUPWKS[ri])return;
    const winners=[];
    round.forEach(m=>{
      const [g1,g2]=playKO(teamStr(m.h),teamStr(m.a));
      m.hg=g1;m.ag=g2;winners.push(g1>g2?m.h:m.a);
    });
    if(winners.length>1)cp.rounds.push(consPair(winners));
    else{
      const champ=S.teams[winners[0]];
      const cupN=CUPS.find(x=>x.c===cp.c).n[L];
      pushNews('cupWin',{c:champ.n,tid:champ.id,cup:cupN,ci:cci},'good');
      S.cupHist=S.cupHist||{};
      (S.cupHist[cp.c]=S.cupHist[cp.c]||[]).push({se:S.season,tid:champ.id});
      if(S.cupHist[cp.c].length>20)S.cupHist[cp.c].shift();
      if(S.clients.some(id=>byId(id).team===champ.id))S.rep=clamp(S.rep+3,0,100);
    }
  });
}
function buildAllFixtures(){
  LEAGUES.forEach((lg,i)=>{
    const tms=S.teams.filter(tm=>tm.lg===i);
    if(lg.grp){
      tms.forEach((tm,k)=>{tm.grp=k%2;}); // alternate by strength order → balanced groups
      const A=tms.filter(tm=>tm.grp===0).map(tm=>tm.id);
      const B=tms.filter(tm=>tm.grp===1).map(tm=>tm.id);
      /* gruplu liglerde grup aşamasının bitişini finalin takip etmesi gerekiyor —
         doğal çift devrede bırakılır, uzatılmaz */
      const fa=makeFixtures(A),fb=makeFixtures(B);
      S.fx[i]=fa.map((r,w)=>r.concat(fb[w]||[]));
    } else S.fx[i]=makeFixtures(tms.map(tm=>tm.id),SEASONW);
  });
}

/* ===== serbest oyuncular =====

const FREETM={id:-1,n:'—',ab:'—',c1:'#6b7280',c2:'#3f444c',lg:-1,str:50,bud:0,pts:0,w:0,d:0,l:0,gf:0,ga:0};

/* Moralin tek giriş noktası. Maç performansı, transferler, sözleşmeler ve ileride

/* Ajansın sabit gideri: ofis + müşteri başına idari yük + her keşif ağının bakımı.

/* a player's public profile: big-club players and hyped wonderkids demand reputable agents,

function profileOf(p){

/* ===== sözleşme yenileme koşulları =====

   sözleşme bitiyordur, oyuncu üst üste iyi oynamıştır ya da maaşı piyasanın

/* js/sim.js — haftalık maç simülasyonu, sezon sonu, gelişim, küme düşme/yükselme, milli turnuva */
/* ================= SIM ================= */
function teamStr(tid){
  const ps=S.players.filter(p=>p.team===tid).sort((a,b)=>b.r-a.r).slice(0,11);
  return ps.reduce((s,p)=>s+p.r+(p.form-50)*0.08,0)/ps.length;

function poisson(lam){let l=Math.exp(-lam),k=0,p=1;do{k++;p*=RF();}while(p>l);return k-1;}
/* ================= MAÇ PERFORMANS MODELİ =================
   Tek yerden ayarlanabilir olsun diye katsayılar burada toplandı.
   Puan üç parçadan oluşur:
     1) BEKLENTİ — oyuncunun etkin seviyesi (güç + form + moral) hem mutlak olarak
        hem de rakip takımın gücüne göre değerlendirilir. İyi oyuncu her yerde iyidir,
        ama asıl farkı kendinden güçlü rakibe karşı çıkardığı işte gösterir.
     2) İSTİKRAR — morali yüksek oyuncu dar bir bantta oynar, düşük moralli savrulur.
        Rastgelelik üçgen dağılım: uçlar nadir, orta yoğun.
     3) KATKI — gol, asist, gol yememe.
   Kısa süre sahada kalan oyuncu ortalamaya çekilir; 15 dakikada maç kazanılmaz. */
const PERF={
  base:6.35,
  formW:0.25, moralW:0.12,     // form/moral etkin seviyeye kaç puan katıyor
  absRef:62, absW:0.018, absCap:0.55,   // mutlak kalite
  relW:0.030, relCap:0.65,              // rakibe göre üstünlük
  res:{W:0.30,D:0.05,L:-0.26},
  goal:0.85, assist:0.42,
  csGK:0.75, csDF:0.32,
  spreadLow:1.00, spreadHigh:0.40,      // moral 0 → geniş sapma, moral 100 → dar
  shortMin:45
};
/* üçgen dağılım (-1..1): iki üniformun toplamı — uçlar nadir */
function bell(){return RF()+RF()-1;}
/* oyuncunun o maçki etkin seviyesi — moral ve form buraya girer */
function effLevel(p){return p.r+(p.form-50)*PERF.formW+(p.morale-50)*PERF.moralW;}
function matchRating(p,ctx){
  const P=PERF, lvl=effLevel(p);
  const abs=clamp((lvl-P.absRef)*P.absW,-P.absCap,P.absCap);
  const rel=clamp((lvl-ctx.oppStr)*P.relW,-P.relCap,P.relCap);
  const spread=P.spreadLow-(P.spreadLow-P.spreadHigh)*(p.morale/100);
  let rt=P.base+abs+rel+P.res[ctx.res]+ctx.g*P.goal+ctx.a*P.assist+bell()*spread;
  if(ctx.ga===0){if(p.pos==='KL')rt+=P.csGK;else if(p.pos==='DF')rt+=P.csDF;}
  if(ctx.min<P.shortMin)rt=P.base+(rt-P.base)*(0.45+ctx.min/90); // az oynadı, az etkiledi
  return Math.round(clamp(rt,4.5,10)*10)/10;
}
function pickWeighted(ps,wf){
  let tot=ps.reduce((s,p)=>s+wf(p),0),x=RF()*tot;
  for(const p of ps){x-=wf(p);if(x<=0)return p;}
  return ps[ps.length-1];
}
/* pick XI + subs, record apps & minutes; returns outfield players who played */
function playMatchSide(tid){
  const sq=S.players.filter(p=>p.team===tid);
  const sorted=sq.map(p=>({p,s:p.r+(p.form-50)*0.1+R(-6,6)})).sort((a,b)=>b.s-a.s).map(x=>x.p);
  const gk=sorted.find(p=>p.pos==='KL');
  /* Dizilişi mevkiye göre kur: sadece en iyi 10'u alırsak 10 forvetli takım çıkabiliyor.
     Önce asgari kotalar dolar, kalan yerlere en iyiler girer. */
  const outf=[];
  const quota={DF:4,OS:4,FV:2};
  Object.keys(quota).forEach(k=>{
    sorted.filter(p=>p.pos===k).slice(0,quota[k]).forEach(p=>outf.push(p));
  });
  sorted.forEach(p=>{
    if(outf.length>=10||p.pos==='KL'||outf.indexOf(p)>=0)return;
    outf.push(p);
  });
  const starters=gk?[gk].concat(outf.slice(0,10)):sorted.slice(0,11);
  const bench=sorted.filter(p=>starters.indexOf(p)<0).slice(0,3);
  const nSub=Math.min(3,bench.length);
  const subbedOut=[...starters].sort(()=>RF()-0.5).slice(0,nSub);
  /* haftalık rapor o maçta kaç dakika oynandığını gösteriyor — sezonluk toplamdan
     ayrı olarak maç bazında da tut */
  const mins={};
  starters.forEach(p=>{
    const m=subbedOut.indexOf(p)>=0?R(55,80):90;
    p.app=(p.app||0)+1;p.min=(p.min||0)+m;mins[p.id]=m;
  });
  const subsIn=bench.slice(0,nSub);
  subsIn.forEach(p=>{const m=R(10,35);p.app=(p.app||0)+1;p.min=(p.min||0)+m;mins[p.id]=m;});
  const all=starters.concat(subsIn);
  return {all,out:all.filter(p=>p.pos!=='KL'),mins};
}
function simWeek(){
  const wk=S.week-1;
  if(wk>=totalWeeks())return;
  LEAGUES.forEach((_,lg)=>{
    if(wk>=S.fx[lg].length)return;
    S.fx[lg][wk].forEach(m=>{
      const sh=teamStr(m.h),sa=teamStr(m.a);
      m.hg=poisson(clamp(1.45*Math.pow(sh/sa,2.4),0.3,4.2));
      m.ag=poisson(clamp(1.15*Math.pow(sa/sh,2.4),0.3,4.2));
      const th=S.teams[m.h],ta=S.teams[m.a];
      th.gf+=m.hg;th.ga+=m.ag;ta.gf+=m.ag;ta.ga+=m.hg;
      if(m.hg>m.ag){th.pts+=3;th.w++;ta.l++;}
      else if(m.hg<m.ag){ta.pts+=3;ta.w++;th.l++;}
      else{th.pts++;ta.pts++;th.d++;ta.d++;}
      const playedMap={},gMap={},aMap={};
      playedMap[m.h]=playMatchSide(m.h);
      playedMap[m.a]=playMatchSide(m.a);
      [[m.h,m.hg],[m.a,m.ag]].forEach(([tid,goals])=>{
        const squad=playedMap[tid].out;
        if(!squad.length)return;
        for(let g=0;g<goals;g++){
          const sc=pickWeighted(squad,p=>(p.pos==='FV'?9:p.pos==='OS'?3.2:0.8)*p.r/70);
          sc.g++;gMap[sc.id]=(gMap[sc.id]||0)+1;
          /* gol zaten maç puanına giriyor; buradaki artış sadece ek güven payı */
          sc.form=clamp(sc.form+3,0,100);moraleEvent(sc,2);
          if(RF()<0.75&&squad.length>1){
            const as=pickWeighted(squad.filter(p=>p.id!==sc.id),p=>(p.pos==='OS'?6:p.pos==='FV'?3:1.5)*p.r/70);
            as.a++;aMap[as.id]=(aMap[as.id]||0)+1;
            as.form=clamp(as.form+2,0,100);
          }
        }
      });
      /* --- maç puanları, son 5 maç ve Maçın Adamı --- */
      let motm=null,best=0;
      const strH=teamStr(m.h),strA=teamStr(m.a);
      [[m.h,m.hg,m.ag],[m.a,m.ag,m.hg]].forEach(([tid,gf,ga])=>{
        const res=gf>ga?'W':gf<ga?'L':'D';
        const oppStr=tid===m.h?strA:strH;
        playedMap[tid].all.forEach(p=>{
          const min=playedMap[tid].mins[p.id]||0;
          const rt=matchRating(p,{res,ga,oppStr,min,g:gMap[p.id]||0,a:aMap[p.id]||0});
          /* geri besleme: iyi maç formu ve morali taşır, kötü maç aşağı çeker.
             İleride eklenecek olaylar da moraleEvent() üzerinden aynı kanala girer. */
          p.form=stat(p.form+(rt-6.7)*1.5,5);
          if(min>=PERF.shortMin)moraleEvent(p,(rt-6.7)*0.7);
          p.rtSum=(p.rtSum||0)+rt;p.rtN=(p.rtN||0)+1;
          (p.l5=p.l5||[]).push({o:tid===m.h?m.a:m.h,res,g:gMap[p.id]||0,a:aMap[p.id]||0,rt,mm:false,
            sc:gf+'-'+ga,min:playedMap[tid].mins[p.id]||0});
          if(p.l5.length>5)p.l5.shift();
          if(rt>best){best=rt;motm=p;}
        });
      });
      if(motm){
        motm.l5[motm.l5.length-1].mm=true;
        motm.form=clamp(motm.form+3,0,100);
      }
      /* --- haftalık müşteri raporu: gelen kutusuna değil, hafta sonunda açılan
             kendi ekranına gider. Oynamayanlar da rapora girer — forma bulamamak
             menajer için gol atmak kadar önemli bir bilgi. --- */
      S.wkRep=S.wkRep||[];
      playedMap[m.h].all.concat(playedMap[m.a].all).forEach(p=>{
        if(p.agent!=='you')return;
        const last=p.l5[p.l5.length-1];
        S.wkRep.push({pid:p.id,n:p.n,tid:p.team,opp:last.o,res:last.res,sc:last.sc,
          min:last.min,g:last.g,a:last.a,rt:last.rt,mm:last.mm?1:0});
      });
      S.clients.forEach(cid=>{
        const p=byId(cid);
        if(!p||(p.team!==m.h&&p.team!==m.a))return;
        if(playedMap[p.team].all.indexOf(p)>=0)return;
        S.wkRep.push({pid:p.id,n:p.n,tid:p.team,opp:p.team===m.h?m.a:m.h,
          res:(p.team===m.h?m.hg-m.ag:m.ag-m.hg)>0?'W':(m.hg===m.ag?'D':'L'),
          sc:(p.team===m.h?m.hg+'-'+m.ag:m.ag+'-'+m.hg),dnp:1});
      });
    });
  });
  /* Form ve moral artık maç performansından besleniyor. Buradaki haftalık hareket
     saf gürültü değil ortalamaya dönüş: iyi form da kötü form da kalıcı değil,
     aksi halde geri besleme kendi kendini büyütüp uçlara yapışırdı. */
  S.players.forEach(p=>{
    p.form=stat(p.form+(50-p.form)*0.12+R(-2,2),5);
    const fair=marketWage(p.r);
    let dm=0;
    if(p.wage<fair*0.7)dm-=3;else if(p.wage>fair)dm+=1;
    if(p.form>70)dm+=1;if(p.form<30)dm-=1;
    p.morale=stat(p.morale+dm+(55-p.morale)*0.12+R(-1,1),0);
  });
  /* --- grouped leagues: zone winners meet in a real, visible final --- */
  S.finals=S.finals||{};
  LEAGUES.forEach((lg,i)=>{
    if(!lg.grp)return;
    if(wk!==S.fx[i].length)return; // the week right after the group stage
    if(S.finals[i]&&S.finals[i].se===S.season)return;
    const a=groupTable(i,0)[0],b=groupTable(i,1)[0];
    const sa=teamStr(a.id),sb=teamStr(b.id);
    let ga=poisson(clamp(1.3*Math.pow(sa/sb,2.4),0.3,4)),gb=poisson(clamp(1.1*Math.pow(sb/sa,2.4),0.3,4));
    if(ga===gb){if(RF()<0.5)ga++;else gb++;}
    S.finals[i]={se:S.season,h:a.id,a:b.id,hg:ga,ag:gb};
    pushNews('finalN',{li:i,h:a.n,hid:a.id,a:b.n,aid:b.id,hg:ga,ag:gb,c:ga>gb?a.n:b.n,cid:ga>gb?a.id:b.id},'good');
  });
  simCups();
}
function nextWeek(){
  if(!S.agent){render();return;}
  S.tw=(S.tw||0)+1;

  const unreadBefore=S.inbox.filter(m=>!m.read).length;
  /* scouting networks coming online */
  (S.scout=S.scout||[]).slice().forEach(x=>{
    if(x.done>S.tw)return;
    S.scout=S.scout.filter(y=>y!==x);
    if(!S.known.includes(x.lg))S.known.push(x.lg);
    pushNews('scoutDone',{li:x.lg},'good');
  });
  /* --- anlaşılan sözleşmeler birkaç hafta sonra imzalanır --- */
  (S.pendC=S.pendC||[]).slice().forEach(x=>{
    if(x.at>S.tw)return;
    S.pendC=S.pendC.filter(y=>y!==x);
    const p=byId(x.pid);
    if(!p||p.agent!=='you')return;
    p.wage=x.wage;p.yrs=x.years;
    p.morale=clamp(Math.max(p.morale+25,65),0,100);p.ignored=0;p.hm=(S.tw||0)+8;
    const fee=Math.round(x.wage*52*x.years*(x.rate||commissionRate()));
    S.cash+=fee;S.rep=clamp(S.rep+2,0,100);
    pushNews('contractSigned',{n:p.n,pid:p.id,c:teamOf(p).n,tid:p.team,y:x.years,w:fmtK(x.wage),f:fmtK(fee)},'good');
  });
  /* --- taksitli komisyon ödemeleri --- */
  (S.pendPay=S.pendPay||[]).slice().forEach(x=>{
    if(x.at>S.tw)return;
    S.pendPay=S.pendPay.filter(y=>y!==x);
    S.cash+=x.amt;

  });
  /* --- club decisions on submitted offers --- */
  S.offers=S.offers||[];S.pending=S.pending||[];
  S.offers.slice().forEach(o=>{
    if(o.at>S.tw)return;
    S.offers=S.offers.filter(x=>x!==o);
    const p=byId(o.pid),b=S.teams[o.tid];
    if(!p||p.agent!=='you'||p.team===o.tid)return;
    if(pendingFor(o.pid)||movedThisSeason(p))return; // deal already agreed / already moved this season
    const v=marketValue(p.r);
    let acc=clamp(1.6-(o.fee/v)/(0.85+b.bud*0.3),0.05,0.95);
    /* pazarlık şartları kabulü etkiler: taksit +, gol bonusu +, sonraki satış payı - */
    acc+=clauseAcc(o.pay,o.gb,o.so);
    acc+=(o.fix===1?0.08:o.fix===2?0.18:0);   // aracıya ödenen para kapıları aralar
    if(isFree(p))acc=Math.max(acc,0.55);       // bonservissiz oyuncuda kulübün riski düşük
    acc=clamp(acc,0.05,0.97);
    if(RF()<acc){
      S.offers=S.offers.filter(x=>x.pid!==o.pid); // withdraw remaining offers for this player
      if(windowOpen())doTransfer(p,b,o.fee,true,o);
      else{
        S.pending.push({pid:o.pid,tid:o.tid,fee:o.fee,pay:o.pay,gb:o.gb,so:o.so});
        pushNews('agreedWait',{c:b.n,tid:b.id,n:p.n,pid:p.id,f:fmtM(o.fee),w:nextWindowLabel()},'good');
        p.morale=clamp(p.morale+10,0,100);p.ignored=0;
      }

  });

  if(windowOpen()){
    S.pending.slice().forEach(x=>{
      S.pending=S.pending.filter(y=>y!==x);
      const p=byId(x.pid);
      if(p&&p.agent==='you'&&p.team!==x.tid)doTransfer(p,S.teams[x.tid],x.fee,true,x);
    });
  }
  S.clients.slice().forEach(id=>{
    const p=byId(id);
    if(p.morale<40&&!honeymoon(p)){
      p.ignored++;
      if(p.ignored===1)pushNews(p.wage<marketWage(p.r)*0.8?'unhappyMsg':'wantsOutMsg',{n:p.n,pid:p.id},'warn');
      /* Güvendiği menajere daha uzun süre katlanır; güvenmediği çabuk kapıyı gösterir. */
      const patience=4+Math.round(trustOf(p)/9);
      if(p.ignored>patience){
        p.agent=null;S.clients=S.clients.filter(c=>c!==id);
        S.rep=clamp(S.rep-5,0,100);
        pushNews('firedYou',{n:p.n,pid:p.id},'bad');
      }
    } else p.ignored=0;
    if(p.yrs===1&&S.week%6===0)pushNews('expire',{n:p.n,pid:p.id,y:1},'warn');
  });

  S.wkRep=[];        // bu haftanın müşteri raporu sıfırdan toplanır
  const repWeek=S.week;
  simWeek();
  const wasPositive=S.cash>=0;
  S.cash=Math.round((S.cash+weeklyIncome()-weeklyCost())*10)/10;
  if(wasPositive&&S.cash<0)pushNews('inDebt',{c:fmtK(weeklyCost())},'bad');
  if(S.rep>=35&&RF()<0.10+S.rep/400){
    const cands=S.players.filter(p=>p.agent==='rival'&&p.r>=70&&profileOf(p)<=repCap()&&knownLg(teamOf(p).lg));
    if(cands.length&&S.clients.length<maxClients()){
      const p=cands[R(0,cands.length-1)];

      pushNews('firedRival',{n:p.n,pid:p.id,r:p.r},'act',{type:'sign',pid:p.id});
    }
  }
  if(S.clients.length&&RF()<0.15){
    const p=byId(S.clients[R(0,S.clients.length-1)]);
    if(p&&p.r>=68&&!movedThisSeason(p)&&!pendingFor(p.id)){
      const buyers=S.teams.filter(tm=>tm.id!==p.team&&tm.bud>=0.55&&Math.abs(tm.str-p.r)<8);
      if(buyers.length){
        const b=buyers[R(0,buyers.length-1)];
        const fee=+(marketValue(p.r)*(0.9+RF()*0.5)).toFixed(1);
        pushNews('clubOffer',{c:b.n,tid:b.id,n:p.n,pid:p.id,f:fmtM(fee)},'act',{type:'bid',pid:p.id,tid:b.id,fee});
      }
    }
  }
  S.week++;
  const seasonOver=S.week>totalWeeks();
  if(seasonOver)endSeason();
  const newN=S.inbox.filter(m=>!m.read).length-unreadBefore;
  if(newN>0&&cur().v!=='inbox'&&cur().v!=='dash')toast(newN+' '+t('newNotifsT'));
  save();render();
  /* Sezon biterse şampiyonluk özeti öncelikli. Rapor ve olay sıraya girer. */
  if(!seasonOver){
    if(S.wkRepOn!==false&&S.wkRep.length)pushModal(()=>showWeekReport(repWeek));
    const ev=rollEvent();
    if(ev)pushModal(()=>showEvent(ev));
  }
}
