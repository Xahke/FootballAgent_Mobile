/* Müşterinin maaşından aldığın pay da itibarınla birlikte büyür. */
function weeklyIncome(){
  const rate=commissionRate();
  return Math.round(S.clients.reduce((s,id)=>{const p=byId(id);return s+(p&&!isFree(p)?p.wage*rate:0);},0)*10)/10;
}
/* Ajansın sabit gideri: ofis + müşteri başına idari yük + her keşif ağının bakımı.
   Başlangıçta küçük tutuluyor ki ilk transferini yapmaya vaktin olsun; ağ genişledikçe
   ve isim yaptıkça büyüyor, böylece "nereye kadar büyüyeceğim" gerçek bir karar oluyor. */
function weeklyCost(){
  const office=1+S.rep*0.03;
  const admin=S.clients.length*0.6;
  const scouts=(S.known||[]).reduce((s,i)=>s+scoutCost(i)*0.0025,0);
  const cut=1-clamp(skillBonus('cost'),0,0.6);
  /* agMod('cost') olaylardan gelen kalıcı gider farkı: büyük ofis artırır, sıkı yönetim azaltır */
  return Math.round((office+admin+scouts)*cut*(1+agMod('cost'))*10)/10;
}
function weeklyNet(){return Math.round((weeklyIncome()-weeklyCost())*10)/10;}
function maxClients(){return 2+Math.floor(S.rep/18)+skillBonus('cap')+agMod('cap');}
function repCap(){return 58+S.rep*0.38;}
function repNeedFor(r){return Math.max(0,Math.ceil((r-58)/0.38));}
/* a player's public profile: big-club players and hyped wonderkids demand reputable agents,
   hidden gems at small clubs stay reachable — that's where a nobody agent starts */
function profileOf(p){
  const hype=(p.age<=23&&p.pot-p.r>=10)?Math.min(8,(p.pot-p.r)/3):0;
  /* kulüpsüz oyuncunun arkasında kulüp gücü yok — kapısı yeni menajerlere açık */
  if(isFree(p))return Math.max(p.r-4,0);
  const visibility=teamOf(p).str-6+hype;
  return Math.max(p.r,visibility);
}
/* --- transfer windows: season start (wk 1-5) & mid-season (4 weeks around halfway) --- */
function midWeek(){return Math.ceil(totalWeeks()/2)+1;}
function windowOpen(){const m=midWeek();return (S.week>=1&&S.week<=5)||(S.week>=m&&S.week<=m+3);}
function nextWindowLabel(){const m=midWeek();return S.week<m?(t('week')+' '+m):t('newSeasonLbl');}
/* ===== sözleşme yenileme koşulları =====
   Bir kulüp masaya her istendiğinde oturmaz. Görüşmenin bir gerekçesi olmalı:
   sözleşme bitiyordur, oyuncu üst üste iyi oynamıştır ya da maaşı piyasanın
   belirgin altında kalmıştır. Aksi halde "neden şimdi?" sorusunun cevabı yoktur. */
function last5Avg(p){
  if(!p.l5||p.l5.length<5)return 0;
  return p.l5.reduce((s,m)=>s+m.rt,0)/p.l5.length;
}
function renewReason(p){
  if(isFree(p))return null;
  if(p.yrs<=1)return 'expiring';
  if(last5Avg(p)>=7.2)return 'form';
  if(p.wage<marketWage(p.r)*0.6)return 'underpaid';
  return null;
}
/* Görüşme neden açılamıyor? null dönerse açılabilir. */
function renewBlock(p){
  if(pendCFor(p.id))return 'pending';
  if((p.rnw||0)>(S.tw||0))return 'cooldown';
  if(!renewReason(p))return 'noreason';
  return null;
}
function renewCd(p){return Math.max(0,(p.rnw||0)-(S.tw||0));}
function offerFor(pid){return (S.offers||[]).find(x=>x.pid===pid);}
function pendingFor(pid){return (S.pending||[]).find(x=>x.pid===pid);}
function pendCFor(pid){return (S.pendC||[]).find(x=>x.pid===pid);} // imzası beklenen sözleşme
function movedThisSeason(p){return (p.hist||[]).some(h=>h.se===S.season);}
function honeymoon(p){return (p.hm||0)>(S.tw||0);} // fresh deal — content for a while
/* ===== scouting network: you only see leagues you know ===== */
/* serbest oyuncular herkese açıktır; keşif ağı yalnızca kulüplü oyuncular için geçerli */
function knownLg(i){return i<0||(S.known||[]).includes(i);}
function lgAvgStr(i){const ts=S.teams.filter(tm=>tm.lg===i);return ts.reduce((s,tm)=>s+tm.str,0)/ts.length;}
function scoutCost(i){return Math.round((30+Math.max(0,lgAvgStr(i)-40)*12)*(1-clamp(skillBonus('scout'),0,0.6)));} // K
function scoutPending(i){return (S.scout||[]).find(x=>x.lg===i);}
function createAgent(fn,ln,nat,ag){
  S.agent={fn,ln,nat,agency:ag||(ln+(L==='tr'?' Menajerlik':' Management'))};
  const home=NAT2CTRY[nat]||'WAF';
  S.known=LEAGUES.map((l,i)=>l.ctry===home?i:-1).filter(i=>i>=0);
  /* keep leagues of any existing clients reachable (old saves) */
  S.clients.forEach(id=>{const lg=teamOf(byId(id)).lg;if(lg>=0&&!S.known.includes(lg))S.known.push(lg);});
  S.scout=S.scout||[];
  save();render();
}
function startCareer(){
  const fn=(document.getElementById('inp_fn').value||'').trim();
  const ln=(document.getElementById('inp_ln').value||'').trim();
  const nat=document.getElementById('sel_nat').value;
  const ag=(document.getElementById('inp_ag').value||'').trim();
  if(!fn||!ln){toast(t('fillName'));return;}
  /* Dünya ancak burada kuruluyor: yuva seçilip ad girilene kadar ~7000 oyuncu
     üretmenin anlamı yok, kurulumdan geri dönmek de bedelsiz olsun. */
  curSlot=pendSlot||1;
  newGame();
  /* Yığın createAgent'tan önce ayarlanıyor — o kendi içinde render() çağırıyor ve
     aksi halde kurulum formu bir kare boyunca oyun çerçevesiyle çizilirdi. */
  stack=[{v:'dash'}];lastSig=null;
  createAgent(fn,ln,nat,ag);
}
function buyScout(i){
  const cost=scoutCost(i);
  if(knownLg(i)||scoutPending(i))return;
  /* Coğrafi bir koşul yok: parası yeten her keşfedilmemiş lig alınabilir. */
  if(S.cash<cost){toast(t('noCash'));return;}
  S.cash-=cost;
  S.scout=S.scout||[];
  /* skillBonus('net') — ağın kurulma süresini kısaltan tek yer. En az iki hafta
     kalıyor: anında açılan bir keşif ağı kararı kararsızlaştırırdı. */
  S.scout.push({lg:i,done:(S.tw||0)+Math.max(2,R(4,8)-Math.round(skillBonus('net')))});
  save();openScout();
}
function openScout(){
  const rows=LEAGUES.map((l,i)=>{
    if(knownLg(i))return '';
    const pend=scoutPending(i);
    return `<div class="pitem" style="cursor:default">
      <div class="pinfo"><div class="pname">${lgName(i)}</div>
      <div class="psub">${t('avgRating')} ~${Math.round(lgAvgStr(i))} · ${S.teams.filter(tm=>tm.lg===i).length} ${t('team').toLowerCase()}</div></div>
      ${pend?`<span class="tag w">${t('scoutPendingT')} · ${Math.max(1,pend.done-(S.tw||0))} ${t('wk')}</span>`
        :`<button class="btn b" style="width:auto;padding:9px 14px" onclick="buyScout(${i})">${t('scoutBuild')} · ${fmtK(scoutCost(i))}</button>`}
    </div>`;
  }).join('');
  openModal(`<h2>${t('scoutNet')}</h2>
   <div class="sub" style="margin:4px 0 12px">${S.known.length}/${LEAGUES.length} ${t('knownLbl')} · ${t('cash')}: ${fmtK(S.cash)}</div>
   <div class="list" style="margin-bottom:0">${rows||`<div class="empty">—</div>`}</div>`);
}
function sortTbl(arr){return [...arr].sort((a,b)=>b.pts-a.pts||(b.gf-b.ga)-(a.gf-a.ga)||b.gf-a.gf);}
function leagueTable(lg){return sortTbl(S.teams.filter(tm=>tm.lg===lg));}
function groupTable(lg,g){return sortTbl(S.teams.filter(tm=>tm.lg===lg&&tm.grp===g));}
function teamPos(tid){
  if(tid<0)return 0;
  const tm=S.teams[tid];
  const tbl=LEAGUES[tm.lg].grp?groupTable(tm.lg,tm.grp):leagueTable(tm.lg);
  return tbl.findIndex(x=>x.id===tid)+1;
}

/* js/sim.js — haftalık maç simülasyonu, sezon sonu, gelişim, küme düşme/yükselme, milli turnuva */
/* ================= SIM ================= */
function teamStr(tid){
  const ps=S.players.filter(p=>p.team===tid).sort((a,b)=>b.r-a.r).slice(0,11);
  return ps.reduce((s,p)=>s+p.r+(p.form-50)*0.08,0)/ps.length;
}
function poisson(lam){let l=Math.exp(-lam),k=0,p=1;do{k++;p*=RF();}while(p>l);return k-1;}
/* ================= MAÇ PERFORMANS MODELİ =================
   Tek yerden ayarlanabilir olsun diye katsayılar burada toplandı.
   Puan üç parçadan oluşur:
     1) BEKLENTİ — oyuncunun etkin seviyesi (güç + form + moral) hem mutlak olarak
        hem de rakip takımın gücüne göre değerlendirilir. İyi oyuncu her yerde iyidir,
        ama asıl farkı kendinden güçlü rakibe karşı çıkardığı işte gösterir.
     2) İSTİKRAR — morali yüksek oyuncu dar bir bantta oynar, düşük moralli savrulur.
        Rastgelelik üçgen dağılım: uçlar nadir, orta yoğun.
     3) KATKI — gol, asist, gol yememe.
   Kısa süre sahada kalan oyuncu ortalamaya çekilir; 15 dakikada maç kazanılmaz. */
const PERF={
  base:6.35,
  formW:0.25, moralW:0.12,     // form/moral etkin seviyeye kaç puan katıyor
  absRef:62, absW:0.018, absCap:0.55,   // mutlak kalite
  relW:0.030, relCap:0.65,              // rakibe göre üstünlük
  res:{W:0.30,D:0.05,L:-0.26},
  goal:0.85, assist:0.42,
  csGK:0.75, csDF:0.32,
  spreadLow:1.00, spreadHigh:0.40,      // moral 0 → geniş sapma, moral 100 → dar
  shortMin:45
};
/* üçgen dağılım (-1..1): iki üniformun toplamı — uçlar nadir */
function bell(){return RF()+RF()-1;}
/* oyuncunun o maçki etkin seviyesi — moral ve form buraya girer */
function effLevel(p){return p.r+(p.form-50)*PERF.formW+(p.morale-50)*PERF.moralW;}
function matchRating(p,ctx){
  const P=PERF, lvl=effLevel(p);
  const abs=clamp((lvl-P.absRef)*P.absW,-P.absCap,P.absCap);
  const rel=clamp((lvl-ctx.oppStr)*P.relW,-P.relCap,P.relCap);
  const spread=P.spreadLow-(P.spreadLow-P.spreadHigh)*(p.morale/100);
  let rt=P.base+abs+rel+P.res[ctx.res]+ctx.g*P.goal+ctx.a*P.assist+bell()*spread;
  if(ctx.ga===0){if(p.pos==='KL')rt+=P.csGK;else if(p.pos==='DF')rt+=P.csDF;}
  if(ctx.min<P.shortMin)rt=P.base+(rt-P.base)*(0.45+ctx.min/90); // az oynadı, az etkiledi
  return Math.round(clamp(rt,4.5,10)*10)/10;
}
function pickWeighted(ps,wf){
  let tot=ps.reduce((s,p)=>s+wf(p),0),x=RF()*tot;
  for(const p of ps){x-=wf(p);if(x<=0)return p;}
  return ps[ps.length-1];
}
/* pick XI + subs, record apps & minutes; returns outfield players who played */
function playMatchSide(tid){
  const sq=S.players.filter(p=>p.team===tid);
  const sorted=sq.map(p=>({p,s:p.r+(p.form-50)*0.1+R(-6,6)})).sort((a,b)=>b.s-a.s).map(x=>x.p);
  const gk=sorted.find(p=>p.pos==='KL');
  /* Dizilişi mevkiye göre kur: sadece en iyi 10'u alırsak 10 forvetli takım çıkabiliyor.
     Önce asgari kotalar dolar, kalan yerlere en iyiler girer. */
  const outf=[];
  const quota={DF:4,OS:4,FV:2};
  Object.keys(quota).forEach(k=>{
    sorted.filter(p=>p.pos===k).slice(0,quota[k]).forEach(p=>outf.push(p));
  });
  sorted.forEach(p=>{
    if(outf.length>=10||p.pos==='KL'||outf.indexOf(p)>=0)return;
    outf.push(p);
  });
  const starters=gk?[gk].concat(outf.slice(0,10)):sorted.slice(0,11);
  const bench=sorted.filter(p=>starters.indexOf(p)<0).slice(0,3);
  const nSub=Math.min(3,bench.length);
  const subbedOut=[...starters].sort(()=>RF()-0.5).slice(0,nSub);
  /* haftalık rapor o maçta kaç dakika oynandığını gösteriyor — sezonluk toplamdan
     ayrı olarak maç bazında da tut */
  const mins={};
  starters.forEach(p=>{
    const m=subbedOut.indexOf(p)>=0?R(55,80):90;
    p.app=(p.app||0)+1;p.min=(p.min||0)+m;mins[p.id]=m;
  });
  const subsIn=bench.slice(0,nSub);
  subsIn.forEach(p=>{const m=R(10,35);p.app=(p.app||0)+1;p.min=(p.min||0)+m;mins[p.id]=m;});
  const all=starters.concat(subsIn);
  return {all,out:all.filter(p=>p.pos!=='KL'),mins};
}
function simWeek(){
  const wk=S.week-1;
  if(wk>=totalWeeks())return;
  LEAGUES.forEach((_,lg)=>{
    if(wk>=S.fx[lg].length)return;
    S.fx[lg][wk].forEach(m=>{
      const sh=teamStr(m.h),sa=teamStr(m.a);
      m.hg=poisson(clamp(1.45*Math.pow(sh/sa,2.4),0.3,4.2));
      m.ag=poisson(clamp(1.15*Math.pow(sa/sh,2.4),0.3,4.2));
      const th=S.teams[m.h],ta=S.teams[m.a];
      th.gf+=m.hg;th.ga+=m.ag;ta.gf+=m.ag;ta.ga+=m.hg;
      if(m.hg>m.ag){th.pts+=3;th.w++;ta.l++;}
      else if(m.hg<m.ag){ta.pts+=3;ta.w++;th.l++;}
      else{th.pts++;ta.pts++;th.d++;ta.d++;}
      const playedMap={},gMap={},aMap={};
      playedMap[m.h]=playMatchSide(m.h);
      playedMap[m.a]=playMatchSide(m.a);
      [[m.h,m.hg],[m.a,m.ag]].forEach(([tid,goals])=>{
        const squad=playedMap[tid].out;
        if(!squad.length)return;
        for(let g=0;g<goals;g++){
          const sc=pickWeighted(squad,p=>(p.pos==='FV'?9:p.pos==='OS'?3.2:0.8)*p.r/70);
          sc.g++;gMap[sc.id]=(gMap[sc.id]||0)+1;
          /* gol zaten maç puanına giriyor; buradaki artış sadece ek güven payı */
          sc.form=clamp(sc.form+3,0,100);moraleEvent(sc,2);
          if(RF()<0.75&&squad.length>1){
            const as=pickWeighted(squad.filter(p=>p.id!==sc.id),p=>(p.pos==='OS'?6:p.pos==='FV'?3:1.5)*p.r/70);
            as.a++;aMap[as.id]=(aMap[as.id]||0)+1;
            as.form=clamp(as.form+2,0,100);
          }
        }
      });
      /* --- maç puanları, son 5 maç ve Maçın Adamı --- */
      let motm=null,best=0;
      const strH=teamStr(m.h),strA=teamStr(m.a);
      [[m.h,m.hg,m.ag],[m.a,m.ag,m.hg]].forEach(([tid,gf,ga])=>{
        const res=gf>ga?'W':gf<ga?'L':'D';
        const oppStr=tid===m.h?strA:strH;
        playedMap[tid].all.forEach(p=>{
          const min=playedMap[tid].mins[p.id]||0;
          const rt=matchRating(p,{res,ga,oppStr,min,g:gMap[p.id]||0,a:aMap[p.id]||0});
          /* geri besleme: iyi maç formu ve morali taşır, kötü maç aşağı çeker.
             İleride eklenecek olaylar da moraleEvent() üzerinden aynı kanala girer. */
          p.form=stat(p.form+(rt-6.7)*1.5,5);
          if(min>=PERF.shortMin)moraleEvent(p,(rt-6.7)*0.7);
          p.rtSum=(p.rtSum||0)+rt;p.rtN=(p.rtN||0)+1;
          /* belirli maç aralıklarıyla piyasa değeri sahadaki işe göre güncellenir */
          const vd=updateValue(p);
          if(vd&&p.agent==='you'&&Math.abs(vd)>=0.05)
            pushNews(vd>0?'valUp':'valDown',{n:p.n,pid:p.id,v:fmtM(valueOf(p))},vd>0?'good':'warn');
          (p.l5=p.l5||[]).push({o:tid===m.h?m.a:m.h,res,g:gMap[p.id]||0,a:aMap[p.id]||0,rt,mm:false,
            sc:gf+'-'+ga,min:playedMap[tid].mins[p.id]||0});
          if(p.l5.length>5)p.l5.shift();
          if(rt>best){best=rt;motm=p;}
        });
      });
      if(motm){
        motm.l5[motm.l5.length-1].mm=true;
        motm.form=clamp(motm.form+3,0,100);
      }
      /* --- haftalık müşteri raporu: gelen kutusuna değil, hafta sonunda açılan
             kendi ekranına gider. Oynamayanlar da rapora girer — forma bulamamak
             menajer için gol atmak kadar önemli bir bilgi. --- */
      S.wkRep=S.wkRep||[];
      playedMap[m.h].all.concat(playedMap[m.a].all).forEach(p=>{
        if(p.agent!=='you')return;
        const last=p.l5[p.l5.length-1];
        S.wkRep.push({pid:p.id,n:p.n,tid:p.team,opp:last.o,res:last.res,sc:last.sc,
          min:last.min,g:last.g,a:last.a,rt:last.rt,mm:last.mm?1:0});
      });
      S.clients.forEach(cid=>{
        const p=byId(cid);
        if(!p||(p.team!==m.h&&p.team!==m.a))return;
        if(playedMap[p.team].all.indexOf(p)>=0)return;
        S.wkRep.push({pid:p.id,n:p.n,tid:p.team,opp:p.team===m.h?m.a:m.h,
          res:(p.team===m.h?m.hg-m.ag:m.ag-m.hg)>0?'W':(m.hg===m.ag?'D':'L'),
          sc:(p.team===m.h?m.hg+'-'+m.ag:m.ag+'-'+m.hg),dnp:1});
      });
    });
  });
  /* Form ve moral artık maç performansından besleniyor. Buradaki haftalık hareket
     saf gürültü değil ortalamaya dönüş: iyi form da kötü form da kalıcı değil,
     aksi halde geri besleme kendi kendini büyütüp uçlara yapışırdı. */
  S.players.forEach(p=>{
    p.form=stat(p.form+(50-p.form)*0.12+R(-2,2),5);
    const fair=marketWage(p.r);
    let dm=0;
    if(p.wage<fair*0.7)dm-=3;else if(p.wage>fair)dm+=1;
    if(p.form>70)dm+=1;if(p.form<30)dm-=1;
    p.morale=stat(p.morale+dm+(55-p.morale)*0.12+R(-1,1),0);
  });
  /* --- grouped leagues: zone winners meet in a real, visible final --- */
  S.finals=S.finals||{};
  LEAGUES.forEach((lg,i)=>{
    if(!lg.grp)return;
    if(wk!==S.fx[i].length)return; // the week right after the group stage
    if(S.finals[i]&&S.finals[i].se===S.season)return;
    const a=groupTable(i,0)[0],b=groupTable(i,1)[0];
    const sa=teamStr(a.id),sb=teamStr(b.id);
    let ga=poisson(clamp(1.3*Math.pow(sa/sb,2.4),0.3,4)),gb=poisson(clamp(1.1*Math.pow(sb/sa,2.4),0.3,4));
    if(ga===gb){if(RF()<0.5)ga++;else gb++;}
    S.finals[i]={se:S.season,h:a.id,a:b.id,hg:ga,ag:gb};
    pushNews('finalN',{li:i,h:a.n,hid:a.id,a:b.n,aid:b.id,hg:ga,ag:gb,c:ga>gb?a.n:b.n,cid:ga>gb?a.id:b.id},'good');
  });
  simCups();
}
function nextWeek(){
  if(!S.agent){render();return;}
  S.tw=(S.tw||0)+1;
  if(!S.cups)seedCups();
  const unreadBefore=S.inbox.filter(m=>!m.read).length;
  /* scouting networks coming online */
  (S.scout=S.scout||[]).slice().forEach(x=>{
    if(x.done>S.tw)return;
    S.scout=S.scout.filter(y=>y!==x);
    if(!S.known.includes(x.lg))S.known.push(x.lg);
    pushNews('scoutDone',{li:x.lg},'good');
  });
  /* --- anlaşılan sözleşmeler birkaç hafta sonra imzalanır --- */
  (S.pendC=S.pendC||[]).slice().forEach(x=>{
    if(x.at>S.tw)return;
    S.pendC=S.pendC.filter(y=>y!==x);
    const p=byId(x.pid);
    if(!p||p.agent!=='you')return;
    p.wage=x.wage;p.yrs=x.years;
    p.morale=clamp(Math.max(p.morale+25,65),0,100);p.ignored=0;p.hm=(S.tw||0)+8;
    const fee=Math.round(x.wage*52*x.years*(x.rate||commissionRate()));
    S.cash+=fee;repEvent(0.7);
    pushNews('contractSigned',{n:p.n,pid:p.id,c:teamOf(p).n,tid:p.team,y:x.years,w:fmtK(x.wage),f:fmtK(fee)},'good');
  });
  /* --- taksitli komisyon ödemeleri --- */
  (S.pendPay=S.pendPay||[]).slice().forEach(x=>{
    if(x.at>S.tw)return;
    S.pendPay=S.pendPay.filter(y=>y!==x);
    S.cash+=x.amt;
    pushNews('instPay',{f:fmtK(x.amt),n:x.n},'good');
  });
  /* --- club decisions on submitted offers --- */
  S.offers=S.offers||[];S.pending=S.pending||[];
  S.offers.slice().forEach(o=>{
    if(o.at>S.tw)return;
    S.offers=S.offers.filter(x=>x!==o);
    const p=byId(o.pid),b=S.teams[o.tid];
    if(!p||p.agent!=='you'||p.team===o.tid)return;
    if(pendingFor(o.pid)||movedThisSeason(p))return; // deal already agreed / already moved this season
    const v=valueOf(p);
    let acc=clamp(1.6-(o.fee/v)/(0.85+b.bud*0.3),0.05,0.95);
    /* pazarlık şartları kabulü etkiler: taksit +, gol bonusu +, sonraki satış payı - */
    acc+=clauseAcc(o.pay,o.gb,o.so);
    acc+=(o.fix===1?0.08:o.fix===2?0.18:0);   // aracıya ödenen para kapıları aralar
    acc+=skillBonus('bid');                   // kulüplerle kurduğun ilişkinin tek okuma yeri
    if(isFree(p))acc=Math.max(acc,0.55);       // bonservissiz oyuncuda kulübün riski düşük
    acc=clamp(acc,0.05,0.97);
    if(RF()<acc){
      S.offers=S.offers.filter(x=>x.pid!==o.pid); // withdraw remaining offers for this player
      if(windowOpen())doTransfer(p,b,o.fee,true,o);
      else{
        S.pending.push({pid:o.pid,tid:o.tid,fee:o.fee,pay:o.pay,gb:o.gb,so:o.so});
        pushNews('agreedWait',{c:b.n,tid:b.id,n:p.n,pid:p.id,f:fmtM(o.fee),w:nextWindowLabel()},'good');
        p.morale=clamp(p.morale+10,0,100);p.ignored=0;
      }
    } else pushNews('offerRej',{c:b.n,tid:b.id,n:p.n,pid:p.id},'bad');
  });
  /* --- pending deals complete when the window is open --- */
  if(windowOpen()){
    S.pending.slice().forEach(x=>{
      S.pending=S.pending.filter(y=>y!==x);
      const p=byId(x.pid);
      if(p&&p.agent==='you'&&p.team!==x.tid)doTransfer(p,S.teams[x.tid],x.fee,true,x);
    });
  }
  S.clients.slice().forEach(id=>{
    const p=byId(id);
    if(p.morale<40&&!honeymoon(p)){
      p.ignored++;
      if(p.ignored===1)pushNews(p.wage<marketWage(p.r)*0.8?'unhappyMsg':'wantsOutMsg',{n:p.n,pid:p.id},'warn');
      /* Güvendiği menajere daha uzun süre katlanır; güvenmediği çabuk kapıyı gösterir. */
      const patience=4+Math.round(trustOf(p)/9);
      if(p.ignored>patience){
        p.agent=null;S.clients=S.clients.filter(c=>c!==id);
        repEvent(-3);
        pushNews('firedYou',{n:p.n,pid:p.id},'bad');
      }
    } else p.ignored=0;
    if(p.yrs===1&&S.week%6===0)pushNews('expire',{n:p.n,pid:p.id,y:1},'warn');
  });
  /* Rakip ajanslar transfer piyasasından önce hareket eder: bu hafta imzaladıkları
     oyuncu piyasa listesinden düşmüş olur, gördüğün liste gerçeği söyler. */
  simRivals();
  simTransfers();
  S.wkRep=[];        // bu haftanın müşteri raporu sıfırdan toplanır
  const repWeek=S.week;
  simWeek();
  const wasPositive=S.cash>=0;
  S.cash=Math.round((S.cash+weeklyIncome()-weeklyCost())*10)/10;
  if(wasPositive&&S.cash<0)pushNews('inDebt',{c:fmtK(weeklyCost())},'bad');
  if(S.rep>=35&&RF()<0.10+S.rep/400){
    const cands=S.players.filter(p=>p.agent==='rival'&&p.r>=70&&profileOf(p)<=repCap()&&knownLg(teamOf(p).lg));
    if(cands.length&&S.clients.length<maxClients()){
      /* Menajerinden kopan oyuncu rastgele seçilmiyor: yüksek komisyonla çalışan ve
         müşterisini tutamayan ajanslar daha sık kaybeder (bkz. RIV_ARCH.loyal). */
      const p=pickWeighted(cands,x=>{const r=rivalOf(x);return r?1/Math.max(0.3,rivalArch(r).loyal):1;});
      const r=rivalOf(p);
      p.agent=null;delete p.ra;
      if(r)r.lost=(r.lost||0)+1;
      pushNews('firedRival',{n:p.n,pid:p.id,r:p.r,a:r?rivalName(r):'',ri:r?r.id:undefined},'act',{type:'sign',pid:p.id});
    }
  }
  if(S.clients.length&&RF()<0.15){
    const p=byId(S.clients[R(0,S.clients.length-1)]);
    if(p&&p.r>=68&&!movedThisSeason(p)&&!pendingFor(p.id)){
      const buyers=S.teams.filter(tm=>tm.id!==p.team&&tm.bud>=0.55&&Math.abs(tm.str-p.r)<8);
      if(buyers.length){
        const b=buyers[R(0,buyers.length-1)];
        const fee=+(valueOf(p)*(0.9+RF()*0.5)).toFixed(1);
        pushNews('clubOffer',{c:b.n,tid:b.id,n:p.n,pid:p.id,f:fmtM(fee)},'act',{type:'bid',pid:p.id,tid:b.id,fee});
      }
    }
  }
  S.week++;
  const seasonOver=S.week>totalWeeks();
  if(seasonOver)endSeason();
  const newN=S.inbox.filter(m=>!m.read).length-unreadBefore;
  if(newN>0&&cur().v!=='inbox'&&cur().v!=='dash')toast(newN+' '+t('newNotifsT'));
  save();render();
  /* Sezon biterse şampiyonluk özeti öncelikli. Rapor ve olay sıraya girer. */
  if(!seasonOver){
    if(S.wkRepOn!==false&&S.wkRep.length)pushModal(()=>showWeekReport(repWeek));
    /* Seviye atladıysan sıraya girer. Sezon özeti sırayı temizlerse S.lvUp
       duruyor olacağı için haber kaybolmaz, bir hafta sonra gelir. */
    if(S.lvUp)pushModal(()=>showLevelUp());
    /* Ayartma kararı olaydan önce sıraya girer: haftanın en ağır kararı, arkasına
       rastgele bir olay eklenmeden verilsin. Sezon biterse S.poach duruyor olacağı
       için karar kaybolmaz, bir hafta sonra gelir. */
    if(S.poach&&S.poach.at<=(S.tw||0))pushModal(()=>showPoach());
    const ev=rollEvent();
    if(ev)pushModal(()=>showEvent(ev));
  }
}
function endSeason(){
  const myLgs=new Set(S.clients.map(id=>teamOf(byId(id)).lg));
  S.lgHist=S.lgHist||LEAGUES.map(()=>[]);
  const trow=tm=>[tm.id,tm.pts,tm.w,tm.d,tm.l,tm.gf,tm.ga];
  const champs=LEAGUES.map((lg,i)=>{
    const ts=S.players.filter(p=>teamOf(p).lg===i).sort((a,b)=>b.g-a.g)[0];
    const lgPs=S.players.filter(p=>teamOf(p).lg===i);
    const scAs={
      sc:lgPs.filter(p=>p.g>0).sort((a,b)=>b.g-a.g).slice(0,15).map(p=>[p.n,p.team,p.g]),
      as:lgPs.filter(p=>p.a>0).sort((a,b)=>b.a-a.a).slice(0,15).map(p=>[p.n,p.team,p.a])};
    let champTm,archEntry;
    if(lg.grp){
      /* champion comes from the final played after the group stage */
      const tA=groupTable(i,0),tB=groupTable(i,1);
      let f=(S.finals||{})[i];
      if(!f||f.se!==S.season){ // safety net: play it now if it never happened
        const a=tA[0],b=tB[0];
        const sa=teamStr(a.id),sb=teamStr(b.id);
        let ga=poisson(clamp(1.3*Math.pow(sa/sb,2.4),0.3,4)),gb=poisson(clamp(1.1*Math.pow(sb/sa,2.4),0.3,4));
        if(ga===gb){if(RF()<0.5)ga++;else gb++;}
        f={se:S.season,h:a.id,a:b.id,hg:ga,ag:gb};
      }
      champTm=f.hg>f.ag?S.teams[f.h]:S.teams[f.a];
      archEntry=Object.assign({se:S.season,tabs:[tA.map(trow),tB.map(trow)],fin:[f.h,f.a,f.hg,f.ag]},scAs);
    } else {
      const table=leagueTable(i);
      champTm=table[0];
      archEntry=Object.assign({se:S.season,tab:table.map(trow)},scAs);
    }
    if(myLgs.has(i)||i===S.curLg)pushNews('champ',{li:i,c:champTm.n,tid:champTm.id,s:ts.n,sid:ts.id,g:ts.g},'good');
    (S.lgHist[i]=S.lgHist[i]||[]).push({se:S.season,tid:champTm.id,ts:ts.n,g:ts.g});
    if(S.lgHist[i].length>30)S.lgHist[i].shift();
    S.arch=S.arch||LEAGUES.map(()=>[]);
    (S.arch[i]=S.arch[i]||[]).push(archEntry);
    if(S.arch[i].length>12)S.arch[i].shift();
    return {lgi:i,tm:champTm,ts};
  });
  delete S.vSe;
  showSeasonModal(champs);
  /* --- next season's continental cups seeded from final standings --- */
  seedCups();
  /* --- promotion & relegation: bottom 3 ↔ top 3 in tiered countries --- */
  const myTids=new Set(S.clients.map(id=>byId(id).team));
  TIERS.forEach(([tc,sc])=>{
    const ti=LEAGUES.findIndex(l=>l.c===tc),si=LEAGUES.findIndex(l=>l.c===sc);
    const down=leagueTable(ti).slice(-3),up=leagueTable(si).slice(0,3);
    down.forEach(tm=>{tm.lg=si;if(myTids.has(tm.id))pushNews('relegated',{c:tm.n,tid:tm.id,li:si},'bad');});
    up.forEach(tm=>{tm.lg=ti;if(myTids.has(tm.id))pushNews('promoted',{c:tm.n,tid:tm.id,li:ti},'good');});
  });
  /* --- milli takımlar turnuvası: her 4 sezonda bir --- */
  if(S.season%4===0){
    const natStr=nat=>{
      const ps=S.players.filter(p=>p.nat===nat).sort((a,b)=>b.r-a.r).slice(0,11);
      return ps.length?ps.reduce((s,p)=>s+p.r,0)/ps.length:0;
    };
    const strMap={};NATKEYS.forEach(n=>strMap[n]=natStr(n));
    const seeds=NATKEYS.slice().sort((a,b)=>strMap[b]-strMap[a]).slice(0,16);
    const rounds=[];
    let cur=null;
    /* first round: seed 1 vs 16, 2 vs 15 ... */
    let rd=[];const nxt=[];
    for(let i=0;i<8;i++){
      const A=seeds[i],B=seeds[15-i];
      const [g1,g2]=playKO(strMap[A],strMap[B]);
      rd.push({h:A,a:B,hg:g1,ag:g2});nxt.push(g1>g2?A:B);
    }
    rounds.push(rd);cur=nxt;
    while(cur.length>1){
      rd=[];const n2=[];
      for(let i=0;i<cur.length;i+=2){
        const A=cur[i],B=cur[i+1];
        const [g1,g2]=playKO(strMap[A],strMap[B]);
        rd.push({h:A,a:B,hg:g1,ag:g2});n2.push(g1>g2?A:B);
      }
      rounds.push(rd);cur=n2;
    }
    S.wc={se:S.season,rounds,champ:cur[0]};
    (S.wcHist=S.wcHist||[]).push({se:S.season,nat:cur[0]});
    pushNews('wcWin',{n:NATS[cur[0]].c},'good');
  }
  const tstr={};S.teams.forEach(tm=>{tstr[tm.id]=teamStr(tm.id);});
  /* --- gol bonusu anlaşmaları: 10+ gol atan transferden pay --- */
  (S.deals=S.deals||[]).forEach(d=>{
    const dp=byId(d.pid);
    if(dp&&dp.team===d.tid&&dp.g>=(d.goals||10)){
      const cut=Math.max(1,Math.round(d.amt*commissionRate()));
      S.cash+=cut;
      pushNews('gbPaid',{n:dp.n,pid:dp.id,g:dp.g,f:fmtK(cut)},'good');
    }
  });
  S.deals=[];
  const gone=[];
  S.players.forEach(p=>{
    p.seasons=p.seasons||[];
    if(p.app>0||p.g>0||p.agent==='you')p.seasons.push({se:S.season,tm:teamOf(p).n,g:p.g,a:p.a,app:p.app||0,min:p.min||0,rt:p.rtN?Math.round(p.rtSum/p.rtN*10)/10:0});
    if(p.seasons.length>6)p.seasons.shift();
    p.age++;p.yrs=Math.max(0,p.yrs-1);
    /* --- development: age + level fit --- */
    /* kulüpsüz oyuncunun antrenman ortamı yok: kendi seviyesini referans alır ve gelişemez */
    const lvl=isFree(p)?p.r+4:tstr[p.team];
    let dev=0;
    if(p.age<=21)dev=R(3,6);
    else if(p.age<=23)dev=R(2,4);
    else if(p.age<=26)dev=R(0,2);
    else if(p.age<=29)dev=R(-1,1);
    else dev=-R(1,3);
    if(dev>0){
      if(p.pot-p.r>=12&&p.age<=23)dev+=1;      // hungry wonderkid
      if(p.r<lvl-9)dev=Math.max(0,dev-3);      // buried at a club too big for him
      if(p.r>lvl+6)dev=Math.max(0,dev-1);      // no challenge left at this level
      if(p.form>65)dev+=1;
      /* skillBonus('dev') — müşterinin gelişimine dokunan tek yer. Gelişim tam
         sayı ilerlediği için bonus olasılık olarak veriliyor: ya bir puan fazla
         gelişir ya gelişmez, arada kesir birikmez. */
      if(p.agent==='you'&&RF()<skillBonus('dev'))dev+=1;
    }
    const oldR=p.r;
    p.r=dev>0?clamp(p.r+dev,35,Math.min(p.pot,96)):clamp(p.r+dev,35,96);
    const gained=p.r-oldR;
    if(p.agent==='you'){
      if(gained>=4){repEvent(0.8);pushNews('devUp',{n:p.n,pid:p.id,d:gained,r:p.r},'good');}
      else if(gained>=2)repEvent(0.4);
      if(p.r>lvl+6&&p.age<=29){pushNews('outgrow',{n:p.n,pid:p.id,c:teamOf(p).n,tid:p.team},'warn');p.morale=clamp(p.morale-12,0,100);}
    }
    p.g=0;p.a=0;p.app=0;p.min=0;p.rtSum=0;p.rtN=0;p.form=R(40,65);
    p.vmAt=0;if(p.vm)p.vm=+(1+(p.vm-1)*VAL.revert).toFixed(3);
    /* --- kulüpsüz oyuncular: uzun süre imza bulamazsa futbolu bırakır --- */
    if(isFree(p)){
      p.freeFor=(p.freeFor||0)+1;
      /* İş bulamayan zayıf ve yaşlı oyuncular futbolu bırakır. Nitelikli bir oyuncu
         boşta kalmaz — o bir sonraki dengelemede kulüp bulur, listeden düşmez. */
      const weak=p.r<62;
      if(p.age>=35||(weak&&(p.freeFor>=2||RF()<0.35)))gone.push(p);
      return;
    }
    /* --- kariyer sonu --- */
    if(RF()<careerEndProb(p,lvl)){
      if(p.agent==='you'){S.clients=S.clients.filter(c=>c!==p.id);pushNews('retire',{n:p.n,pid:p.id},'info');}
      regenPlayer(p);
      return;
    }
    /* --- sözleşme bitti: kulüp yenileyecek mi? --- */
    if(p.yrs===0){
      /* Sözleşmesini bilerek bitirip piyasaya çıkanlar: kulüp tutmak istese de gider.
         Havuzda ara sıra gerçekten iyi bir oyuncu olsun diye — asıl fırsat bunlar. */
      const runsDown=p.r>=lvl-2&&p.age>=24&&p.age<=31&&RF()<0.05;
      if(!runsDown&&RF()<renewProb(p,lvl)){
        p.yrs=R(2,4);
        p.wage=Math.max(1,Math.round(marketWage(p.r)*(0.85+teamOf(p).bud*0.3)));
        if(p.agent==='you')pushNews('renewed',{n:p.n,pid:p.id,c:teamOf(p).n,tid:p.team,y:p.yrs},'info');
      } else {
        const old=teamOf(p);
        releaseToFree(p);
        if(p.agent==='you')pushNews('released',{n:p.n,pid:p.id,c:old.n,tid:old.id},'warn');
      }
    }
  });
  /* futbolu bırakan kulüpsüz oyuncular listeden düşer — kadrolarda yerleri zaten yok */
  if(gone.length){
    const ids=new Set(gone.map(p=>p.id));
    gone.forEach(p=>{
      if(p.agent==='you'){S.clients=S.clients.filter(c=>c!==p.id);pushNews('retire',{n:p.n,pid:p.id},'info');}
    });
    S.players=S.players.filter(p=>!ids.has(p.id));
  }
  rebalanceSquads();
  /* Kadrolar oturduktan sonra: rakip ajansların itibarı portföylerine göre kayar ve
     yükselen/sönen oyuncular yeniden paylaşılır. Kadro dengesinden önce çalışsaydı
     bu sezon doğan gençleri göremezdi. */
  rivalSeason();
  S.teams.forEach(tm=>{tm.pts=0;tm.w=0;tm.d=0;tm.l=0;tm.gf=0;tm.ga=0;});
  buildAllFixtures();
  S.finals={};
  S.season++;S.week=1;
}

/* js/market.js — yapay zekâ transfer piyasası: kulüpler arası alım-satım, kulüp bütçeleri, sezon sonu kadro dengesi */
/* ================= KADRO SINIRLARI =================
   playMatchSide en az 1 kaleci + 10 oyuncu bulabilmeli; bu yüzden mevki tabanları sert kuraldır. */
const SQTARGET=16, SQMAX=19;
const FAMAX=60;    // piyasada duran kulüpsüz oyuncu tavanı
const POSMIN={KL:2,DF:4,OS:4,FV:3};
const POSMAX={KL:3,DF:7,OS:7,FV:6};
const STARTERS={KL:1,DF:4,OS:4,FV:2};
/* ================= KULÜP EKONOMİSİ ================= */
/* sezonluk transfer bütçesi (M€) — prestij ve gelir seviyesine bağlı */
function seasonBudget(tm){return +(marketValue(tm.str)*(0.60+tm.bud*1.00)).toFixed(2);}
function clubFin(tm){if(tm.fin===undefined)tm.fin=seasonBudget(tm);return tm.fin;}
/* ================= KADRO İNDEKSİ =================
   Her transfer haftasında bir kez kurulur; tüm oyuncu listesini tekrar tekrar taramamak için. */
function squadIndex(){
  const idx={};
  S.teams.forEach(tm=>{idx[tm.id]={KL:[],DF:[],OS:[],FV:[]};});
  S.players.forEach(p=>{const s=idx[p.team];if(s&&s[p.pos])s[p.pos].push(p);});
  S.teams.forEach(tm=>POS.forEach(k=>idx[tm.id][k].sort((a,b)=>b.r-a.r)));
  return idx;
}
function idxCount(idx,tid){return POS.reduce((s,k)=>s+idx[tid][k].length,0);}
/* kulübün bir mevkideki ilk 11 kalitesi */
function posQuality(lst,k){
  const top=lst.slice(0,STARTERS[k]);
  return top.length?top.reduce((s,p)=>s+p.r,0)/top.length:30;
}
/* müşterilerin ve süreci devam eden oyuncuların dokunulmazlığı var — onları oyuncu yönetir */
function sellable(p){
  return p.agent!=='you'&&!offerFor(p.id)&&!pendingFor(p.id)&&!pendCFor(p.id)&&!movedThisSeason(p);
}
/* ================= ÜCRET ================= */
function aiFee(p){
  if(isFree(p))return 0;                             // bonservissiz
  let f=valueOf(p)*(0.85+RF()*0.65);
  if(p.age<=23&&p.pot-p.r>=8)f*=1.25+(p.pot-p.r)/60; // potansiyel primi
  if(p.age>=31)f*=0.55;                              // yaş indirimi
  if(p.yrs<=1)f*=0.60;                               // sözleşmesi bitiyor
  return Math.max(0.05,+f.toFixed(1));
}
/* ================= TRANSFERİN GERÇEKLEŞMESİ ================= */
function aiTransfer(p,buyer,fee,idx){
  const from=teamOf(p),wasFree=isFree(p);
  if(idx){
    if(!wasFree){                       // kulüpsüz oyuncu hiçbir kadro indeksinde değil
      const l=idx[from.id][p.pos],i=l.indexOf(p);
      if(i>=0)l.splice(i,1);
    }
    const nl=idx[buyer.id][p.pos];
    nl.push(p);nl.sort((a,b)=>b.r-a.r);
  }
  /* müşterin bu kulüpte aynı mevkide oynuyorsa yeri tehlikeye giriyor */
  S.clients.forEach(cid=>{
    const c=byId(cid);
    if(c&&c.team===buyer.id&&c.pos===p.pos&&p.r>c.r+1){
      pushNews('rivalSigned',{c:buyer.n,tid:buyer.id,n:p.n,pid:p.id,r:p.r,cn:c.n,cid:c.id,pos:p.pos},'warn');
      c.morale=clamp(c.morale-8,0,100);
    }
  });
  (p.hist=p.hist||[]).push({se:S.season,a:from.n,b:buyer.n,f:fee});
  if(p.hist.length>6)p.hist.shift();
  p.team=buyer.id;
  p.wage=Math.max(1,Math.round(Math.max(p.wage*1.10,marketWage(p.r)*(0.85+buyer.bud*0.25))));
  p.yrs=R(2,4);
  p.morale=clamp(Math.max(p.morale+20,65),0,100);
  p.form=clamp(p.form+4,0,100);
  p.ignored=0;p.hm=(S.tw||0)+8;delete p.freeFor;
  buyer.fin=+(clubFin(buyer)-fee).toFixed(2);
  if(!wasFree)from.fin=+(clubFin(from)+fee*0.7).toFixed(2); // satış geliri yeniden yatırıma döner
  (S.tlog=S.tlog||[]).unshift({se:S.season,w:S.week,pid:p.id,n:p.n,r:p.r,pos:p.pos,age:p.age,a:from.id,b:buyer.id,f:fee});
  if(S.tlog.length>60)S.tlog.pop();
}
/* ================= HAFTALIK PİYASA =================
   Sadece transfer dönemi açıkken çalışır. Her kulüp en zayıf mevkisini güçlendirmeye bakar. */
function simTransfers(){
  if(!windowOpen())return;
  const idx=squadIndex();
  S.teams.forEach(buyer=>{
    if(clubFin(buyer)<0.08)return;
    if(RF()>=0.55+buyer.bud*0.40)return;      // her kulüp her hafta piyasada değil
    if(idxCount(idx,buyer.id)>=SQMAX)return;
    /* prestijine göre en geride kalan mevkiyi seç */
    let bk=null,worst=-99;
    POS.forEach(k=>{
      if(idx[buyer.id][k].length>=POSMAX[k])return;
      const d=buyer.str-posQuality(idx[buyer.id][k],k);
      if(d>worst){worst=d;bk=k;}
    });
    if(!bk)return;
    const mine=idx[buyer.id][bk];
    const sf=(mine[STARTERS[bk]-1]||{r:0}).r;   // en zayıf ilk 11 oyuncusu
    const qf=(mine[mine.length-1]||{r:0}).r;    // mevkideki en zayıf oyuncu
    /* ilk 11'i güçlendirmek asıl hedef; kadroda yer varsa rotasyon oyuncusu da alınır */
    const floor=mine.length<POSMAX[bk]-1?Math.min(sf,qf+2):sf;
    /* dünyayı baştan sona taramak yerine kulüp örnekle */
    const cands=[];
    for(let s=0;s<24;s++){
      const sel=S.teams[R(0,S.teams.length-1)];
      if(sel.id===buyer.id)continue;
      const lst=idx[sel.id][bk];
      if(lst.length<=POSMIN[bk])continue;      // kadrosu zaten dar, satmaz
      /* yedekler her zaman satılık; belirgin şekilde zayıf kulüpler ilk 11'ini de verir */
      const pool=sel.str<buyer.str-5?lst:lst.slice(STARTERS[bk]);
      pool.forEach(p=>{
        if(!sellable(p))return;
        if(p.r<=floor+1)return;                // kadroyu güçlendirmiyor
        if(p.r>buyer.str+5)return;             // bu seviyedeki kulübe gelmez
        const fee=aiFee(p);
        if(fee>clubFin(buyer))return;
        cands.push({p,sel,fee});
      });
    }
    /* bonservissiz oyuncular: kulüp seviyesine uyan her serbest oyuncu adaydır */
    freeAgents().forEach(p=>{
      if(p.pos!==bk||!sellable(p))return;
      if(p.r<=floor-4||p.r>buyer.str+5)return;
      cands.push({p,sel:null,fee:0,free:true});
    });
    if(!cands.length)return;
    /* fiyat/fayda oranına göre sırala, ilk beşten rastgele seç — piyasa deterministik olmasın */
    cands.sort((a,b)=>(b.p.r-floor)/Math.max(0.1,b.fee||0.05)-(a.p.r-floor)/Math.max(0.1,a.fee||0.05));
    const pick=cands[R(0,Math.min(4,cands.length-1))];
    if(pick.free){
      /* satacak kulüp yok; oyuncu ikna olacak mı — seviyesine yakın teklif kazanır */
      if(RF()<clamp(0.55-(buyer.str<pick.p.r-8?0.35:0),0.1,0.9))aiTransfer(pick.p,buyer,0,idx);
      return;
    }
    const v=valueOf(pick.p);
    let acc=clamp(0.55+(pick.fee/Math.max(0.05,v)-1)*0.9,0.05,0.90);
    if(buyer.str>pick.sel.str+6)acc+=0.20;     // büyük kulübe hayır demek zor
    if(pick.p.age>=31)acc+=0.15;
    if(RF()<clamp(acc,0.05,0.95))aiTransfer(pick.p,buyer,pick.fee,idx);
  });
}
/* ================= SEZON SONU KADRO DENGESİ =================
   Fazla kadrolu kulüpler fazlalığı bırakır, dar kadrolu kulüpler onları toplar.
   Açıkta kalan boşluklar altyapıdan gelen gençlerle dolar. Toplam oyuncu sayısı sabit kalır. */
function rebalanceSquads(){
  const idx=squadIndex();
  const freed=[];
  /* 1) fazlalıkları serbest bırak — en zayıftan başlayarak, mevki tabanına dokunmadan */
  S.teams.forEach(tm=>{
    let tot=idxCount(idx,tm.id),guard=0;
    while(tot>SQTARGET&&guard++<12){
      let bk=null,bp=null;
      POS.forEach(k=>{
        const l=idx[tm.id][k];
        if(l.length<=POSMIN[k])return;
        const c=l[l.length-1];
        if(!c||c.agent==='you')return;        // müşterini kimse kadro dışı bırakamaz
        if(!bp||c.r<bp.r){bp=c;bk=k;}
      });
      if(!bp)break;
      idx[tm.id][bk].pop();
      freed.push(bp);tot--;
    }
  });
  /* 2) açık kadrolar önce piyasadaki oyunculardan doldurulur: bu sezon bırakılanlar
        ve zaten kulüpsüz olanlar aynı havuzda yarışır. Kimse yoksa altyapı devreye girer. */
  const pool=freed.concat(freeAgents());
  /* Nitelikli oyuncu ilk gelen teklifi imzalamaz. Kararı sezonda bir kez veriyoruz —
     her kulüp denemesinde ayrı ayrı zar atarsak yüzlerce denemede kesin imzalar. */
  pool.forEach(p=>{
    delete p.hold;
    /* yalnızca bu sezon serbest kalanlar bekler; bir sezondur piyasada olan artık imzalar */
    if(p.r>=60&&!(p.freeFor>=1)&&RF()<0.75)p.hold=1;
  });
  const take=(tm,k)=>{
    let bi=-1,bd=1e9;
    pool.forEach((p,i)=>{
      if(p.pos!==k)return;
      if(p.hold)return;   // doğru teklifi bekliyor, sezon başında piyasada kalacak
      /* Seviyesinin üstündeki oyuncu kulüp için fırsattır — kadroda yer varsa reddedilmez.
         Altındaki oyuncu ise tam ceza alır. Aksi halde iyi oyuncular piyasada birikir. */
      const gap=p.r-tm.str;
      const d=(gap>=0?gap*0.15:-gap)+(p.age>=32?3:0);
      if(d<bd){bd=d;bi=i;}
    });
    if(bi<0)return null;
    const p=pool.splice(bi,1)[0];
    p.team=tm.id;p.yrs=R(1,3);p.morale=clamp(p.morale-5,0,100);delete p.freeFor;
    idx[tm.id][k].push(p);
    return p;
  };
  const needy=S.teams.slice().sort(()=>RF()-0.5);
  needy.forEach(tm=>{
    /* Mevki tabanı pazarlık konusu değil: piyasada o mevkiden kimse yoksa altyapıdan
       çıkarılır. Aksi halde kadro 16'ya ulaşmış bir kulüp tek kaleciyle kalabiliyor —
       toplam sayı tuttuğu için ikinci döngü hiç çalışmıyor ve açık kapanmıyordu. */
    POS.forEach(k=>{
      while(idx[tm.id][k].length<POSMIN[k]){
        if(take(tm,k))continue;
        const np=genPlayer(tm,k,R(16,19));
        S.players.push(np);idx[tm.id][k].push(np);
      }
    });
    let tot=idxCount(idx,tm.id),guard=0;
    while(tot<SQTARGET&&guard++<12){
      const k=POS.filter(x=>idx[tm.id][x].length<POSMAX[x])
                 .sort((a,b)=>idx[tm.id][a].length-POSMIN[a]-(idx[tm.id][b].length-POSMIN[b]))[0];
      if(!k)break;
      /* Kadronun bir kısmı altyapıdan gelsin, yoksa genç akışı durur. Ama piyasa
         doluyken kulüpler önce oradan beslenir — yoksa serbest oyuncular birikir. */
      const youthShare=pool.length>70?0.10:0.35;
      if(RF()<youthShare||!take(tm,k)){
        const np=genPlayer(tm,k,R(16,19));
        S.players.push(np);idx[tm.id][k].push(np);
      }
      tot++;
    }
  });
  /* 3) kulüp bulamayanlar piyasada kalır; havuz şişerse en zayıflar futbolu bırakır.
        Bekleme kararı burada biter — sezon boyunca kulüpler onlara teklif götürebilir. */
  pool.forEach(p=>{delete p.hold;if(p.team>=0)return;p.team=-1;p.yrs=0;p.freeFor=p.freeFor||0;});
  freed.forEach(p=>{if(p.team>=0)return;releaseToFree(p);});
  const fa=freeAgents().filter(p=>p.agent!=='you');
  if(fa.length>FAMAX){
    fa.sort((a,b)=>(a.r-a.age*0.6)-(b.r-b.age*0.6));   // en zayıf ve en yaşlı önce
    const drop=new Set(fa.slice(0,fa.length-FAMAX).map(p=>p.id));
    S.players=S.players.filter(p=>!drop.has(p.id));
  }
  /* 4) prestij gerçek kadro gücüne doğru kayar ama kulüp kimliğinden fazla uzaklaşmaz */
  S.teams.forEach(tm=>{
    if(tm.str0===undefined)tm.str0=tm.str;
    const real=teamStr(tm.id);
    tm.str=Math.round(clamp(tm.str*0.7+real*0.3,tm.str0-8,tm.str0+8));
    tm.fin=seasonBudget(tm);
  });
}

  if(!rs.length)return L==='tr'?'başka bir menajer':'another agent';

     türetilen sabit bir seçim, hafta içinde değişmez. */
  const r=rs[((c&&c.p?c.p.id:0)+(S.tw||0))%rs.length];
  return rivalName(r);
}

/* ================= MOTOR ================= */
function evSmall(e){return e.sz==='s';}
function evEligible(smallOnly){
  const cl=S.clients.map(byId).filter(Boolean);
  return EVENTS.filter(e=>{
    if(smallOnly&&!evSmall(e))return false;
    if(e.need==='client'&&!cl.length)return false;
    if(!e.when)return true;
    return cl.some(p=>{try{return e.when({p,tm:teamOf(p)});}catch(x){return false;}});
  });
}
function rollEvent(){
  if(S.evOn===false)return null;
  if(!S.agent)return null;
  if((S.evNext||0)>(S.tw||0))return null;
  if(RF()>=EV_CHANCE)return null;
  /* Son büyük olayın üstünden yeterli zaman geçmediyse bu hafta yalnızca küçükler çıkar. */
  const smallOnly=(S.evBig||0)+EV_BIGGAP>(S.tw||0);
  let pool=evEligible(smallOnly);
  if(!pool.length&&smallOnly)pool=evEligible(false);
  if(!pool.length)return null;
  let tot=pool.reduce((s,e)=>s+e.w,0),x=RF()*tot,ev=pool[pool.length-1];
  for(const e of pool){x-=e.w;if(x<=0){ev=e;break;}}
  let pid=null;
  if(ev.need==='client'){
    const cands=S.clients.map(byId).filter(p=>p&&(!ev.when||ev.when({p,tm:teamOf(p)})));
    if(!cands.length)return null;
    pid=cands[R(0,cands.length-1)].id;
  }
  S.evNext=(S.tw||0)+EV_GAP+R(0,1);
  if(!evSmall(ev))S.evBig=(S.tw||0);
  return {id:ev.id,pid};
}
function evById(id){return EVENTS.find(e=>e.id===id);}
/* Tek uygulayıcı: bütün olaylar aynı kaldıraçlardan geçer. */
function applyEff(r,c){
  const out=[];
  if(r.cash){S.cash=Math.round((S.cash+r.cash)*10)/10;out.push({k:'cash',v:r.cash});}
  if(r.rep){repEvent(r.rep);out.push({k:'rep',v:r.rep});}
  if(c.p){
    if(r.morale){moraleEvent(c.p,r.morale);out.push({k:'morale',v:r.morale});}
    if(r.trust){trustEvent(c.p,r.trust);out.push({k:'trust',v:r.trust});}
    if(r.form){c.p.form=stat(c.p.form+r.form,5);out.push({k:'form',v:r.form});}
    /* oyuncuya iliştirilen kalıcı bayrak (şimdilik: geleceği bir fona satıldı) */
    if(r.flag)c.p[r.flag]=1;
  }
  /* Ajansın kalıcı değiştiricileri: komisyon oranı, müşteri kapasitesi, gider katsayısı.
     Kalıcı oldukları için ekranda ayrıca gösterilir (bkz. evChoose). */
  if(r.ag){S.ag=S.ag||{};
    Object.keys(r.ag).forEach(k=>{S.ag[k]=+((S.ag[k]||0)+r.ag[k]).toFixed(3);out.push({k:'ag_'+k,v:r.ag[k]});});}
  return out;
}

/* js/skills.js — yetenek ağacı (merkezden dört yöne açılan düğüm ağı).

   Ağaç bir ızgara üzerinde duruyor: merkezde ajansın kendisi (hub), ondan dört
   yöne birer dal. Her dal ilk düğümden sonra ikiye ayrılıyor, iki kol üçüncü
   halkada ilerliyor ve dördüncü halkada tek bir taçta birleşiyor. Bir düğüm,
   ona bağlı düğümlerden en az biri açılmadan alınamaz — yani ağaçta yürümek
   zorundasın, istediğin yeri seçemezsin.

   Neden koordinat yerine (dal, halka, yan) tutuluyor:
   dalın yönü SK_BRANCH'te yazıyor; düğüm yalnızca "kaçıncı halka" ve "hangi kol"
   olduğunu biliyor. Yeni bir dal eklemek için SK_BRANCH'e bir yön yazmak yeterli,
   hiçbir koordinatı elle hesaplamak gerekmiyor (bkz. skPos).

   Yeni düğüm eklerken:
     id   : benzersiz kısa ad
     br   : dal ('tb' | 'fd' | 'ag' | 'nw')
     d    : halka — merkezden uzaklık (1..4)
     s    : yan — dalın ekseninden sapma (-1 sol kol, 0 orta, +1 sağ kol)
     cost : kaç puan
     req  : önkoşul id'leri — biri açıksa düğüm açılabilir
     eff  : {anahtar: değer} — skillBonus(anahtar) bunları toplar

   Etki anahtarları SK_KEY'de tanımlı; her anahtarın oyunda tam olarak bir okuma
   yeri var (bkz. CLAUDE.md). Yeni anahtar eklemek = SK_KEY'e satır + tek okuma yeri. */

/* ===== seviye eğrisi =====
   Puan artık doğrudan itibardan değil seviyeden geliyor. İlk seviyeler hızlı
   gelsin ki ağaç daha ilk sezonda hareket etsin; sonrakiler açılsın ki uzun bir
   kariyer bile dört dalı birden bitiremesin. Bir seviye = 1 puan, her dördüncü
   seviye bir puan daha. Dört dalın tamamı 32 puan tutuyor: kimse hepsini alamaz,
   herkes seçmek zorunda. */
const LV={a:3.2, b:0.62, max:30, bonus:4};
function repForLevel(l){const k=Math.max(0,l-1);return Math.round(LV.a*k+LV.b*k*k);}
/* Seviye ulaşılan en yüksek itibardan sayılır: bir kez hak ettiğin seviye,
   sonradan itibar kaybetsen de elinden alınmaz. */
function repTotal(){return S?Math.max(S.rep||0,S.repMax||0):0;}
function agentLevel(st){
  const r=st===undefined?repTotal():st;
  let l=1;
  while(l<LV.max&&r>=repForLevel(l+1))l++;
  return l;
}
function levelPoints(l){return (l-1)+Math.floor(l/LV.bonus);}
/* Bir sonraki seviyeye kalan yol — arayüzdeki halka bunu gösteriyor. */
function levelProgress(){
  const l=agentLevel(),r=repTotal();
  if(l>=LV.max)return {lv:l,cur:0,need:0,pct:1};
  const lo=repForLevel(l),hi=repForLevel(l+1);
  return {lv:l,cur:r-lo,need:hi-lo,pct:Math.max(0,Math.min(1,(r-lo)/(hi-lo)))};
}

/* f: nasıl yazılacağı — pct yüzde artış, pctD yüzde düşüş, pp puan, wk hafta, flat sayı */

  pitch:{f:'pct', n:{tr:'İmza şansı',        en:'Signing chance'}},
  cost :{f:'pctD',n:{tr:'Haftalık gider',    en:'Weekly overhead'}},
  cap  :{f:'flat',n:{tr:'Müşteri kapasitesi',en:'Client slots'}},
  repg :{f:'pct', n:{tr:'İtibar kazancı',    en:'Reputation gain'}},
  fee  :{f:'pct', n:{tr:'Transfer komisyonu',en:'Transfer cut'}},
  bid  :{f:'pct', n:{tr:'Teklif kabulü',     en:'Bid acceptance'}},
  mor  :{f:'pctD',n:{tr:'Moral kaybı',       en:'Morale losses'}},
  loy  :{f:'pctD',n:{tr:'Ayartma riski',     en:'Poaching risk'}}
};
function skEffLabel(k,v){
  const m=SK_KEY[k];
  if(!m)return '';
  const n=m.n[L];
  if(m.f==='flat')return n+' +'+v;
  if(m.f==='wk')return n+' −'+v+' '+t('wk');
  if(m.f==='pp')return n+' +'+Math.round(v*100)+' '+t('skPp');
  const pct=Math.round(v*100);
  const sign=m.f==='pctD'?'−':'+';
  return n+' '+sign+(L==='tr'?'%'+pct:pct+'%');
}

/* ===== yerleşim =====
   Izgara birimi SK_GEO.unit; merkez (0,0). Dalın yönü (ax,ay) ise yan kollar
   bu vektörün dikine (-ay,ax) açılıyor. Böylece dört yön de tek formülle çiziliyor. */
const SK_GEO={unit:100, r:34, rBig:39, rHub:46, hit:47, pad:66};
function skBranch(id){return SK_BRANCH.find(b=>b.id===id)||null;}
function skPos(sk){
  const b=skBranch(sk.br);
  if(!b)return {x:0,y:0};
  const [ax,ay]=b.dir;
  return {x:(ax*sk.d-ay*sk.s)*SK_GEO.unit, y:(ay*sk.d+ax*sk.s)*SK_GEO.unit};
}
function skById(id){return SKILLS.find(x=>x.id===id)||null;}
function skRadius(sk){return sk.id===SK_HUB?SK_GEO.rHub:sk.d>=4?SK_GEO.rBig:SK_GEO.r;}
/* Ağacın kapladığı alan düğümlerden hesaplanıyor — yeni bir dal eklendiğinde
   görünüm kutusu kendiliğinden büyüsün. */
function skViewBox(){
  let m=0;
  SKILLS.forEach(sk=>{const p=skPos(sk);m=Math.max(m,Math.abs(p.x),Math.abs(p.y));});
  const h=m+SK_GEO.pad;
  return [-h,-h,h*2,h*2].join(' ');
}
/* Çizilecek yollar: her düğüm önkoşullarına bir çizgiyle bağlanır. */
function skEdges(){
  const out=[];
  SKILLS.forEach(sk=>{
    (sk.req||[]).forEach(rid=>{
      const from=skById(rid);
      if(from)out.push({a:from,b:sk});
    });
  });
  return out;
}

/* ===== puan muhasebesi ===== */
/* Eski kayıtlarda dal/kademe düzeninde dokuz yetenek vardı; karşılıkları yeni
   ağaçta duruyor. Kimse ilerlemesini kaybetmesin diye okurken çevriliyor. */
const SK_LEGACY={neg1:'tb1',neg2:'tb3',neg3:'tb6',sco1:'fd1',sco2:'fd3',sco3:'fd6',
                 biz1:'ag1',biz2:'ag2',biz3:'ag6'};
function skillsTaken(){
  const raw=(S&&S.skills)||[];
  const out=[];
  raw.forEach(id=>{
    const n=SK_LEGACY[id]||id;
    if(skById(n)&&out.indexOf(n)<0)out.push(n);
  });
  return out;
}
function hasSkill(id){return id===SK_HUB||skillsTaken().indexOf(id)>=0;}
function skillSpent(){return skillsTaken().reduce((s,id)=>{const k=skById(id);return s+(k?k.cost:0);},0);}
/* Alt sınır harcanan puandır — eğri değişse bile kimse puan borcuna düşmesin. */
function skillEarned(){return S?Math.max(levelPoints(agentLevel()),skillSpent()):0;}
function skillPoints(){return skillEarned()-skillSpent();}
/* Bir düğüm, bağlı olduğu düğümlerden biri açılmadan alınamaz. */
function skillLocked(sk){return (sk.req||[]).some(id=>hasSkill(id))?null:'req';}
/* Düğümün durumu — arayüz de, satın alma da aynı yerden okuyor. */
function skillState(sk){
  if(hasSkill(sk.id))return 'owned';
  if(skillLocked(sk))return 'lock';
  return skillPoints()>=sk.cost?'open':'poor';
}
/* Son açılan düğüm: arayüz bunu bir kez animasyonla çizip unutur. */
let skJustTaken=null;
function skillBuy(id){
  const sk=skById(id);
  if(!sk||hasSkill(id))return;
  if(skillLocked(sk)){toast(t('skLockedT'));return;}
  if(skillPoints()<sk.cost){toast(t('skNoPoints'));return;}
  S.skills=skillsTaken().concat([id]);
  skJustTaken=id;
  toast(t('skUnlocked').replace('{n}',sk.n[L]));
  closeModal();save();render();
}
/* Etkilerin tek okuma noktası — oyunun geri kalanı buradan geçer. */
function skillBonus(key){
  return skillsTaken().reduce((s,id)=>{
    const k=skById(id);
    return s+((k&&k.eff&&k.eff[key])||0);
  },0);
}
/* Dal ilerlemesi: arayüzdeki "3/6" rozeti. */
function branchTaken(br){return SKILLS.filter(sk=>sk.br===br&&hasSkill(sk.id)).length;}
function branchTotal(br){return SKILLS.filter(sk=>sk.br===br).length;}

/* js/sfx.js — arayüz sesi.
   Ses dosyası yok: Web Audio ile anlık sentezleniyor, böylece tek dosya çıktısı ve
   çevrimdışı çalışma bozulmuyor.

   Tasarım: tek ve kısa bir TIK. Ton yok — sürekli bir frekans "bip" gibi duyuluyor,
   alçak frekanslı bir vuruş ise "tok" oluyor. Tık dediğimiz şey aslında çok kısa,
   kuru bir darbe: filtrelenmiş gürültünün 12 milisaniyede sönmesi.

   Ayar düğmeleri (tek satırla değiştirilebilir):
     DUR  ↓ daha kısa/keskin, ↑ daha yumuşak
     LO   ↑ daha ince ve net, ↓ daha kalın
     HI   ↓ tizliği keser, sertliği alır
     VOL  ses seviyesi */
const CLICK={DUR:0.013,LO:700,HI:4800,VOL:0.30};
let AC=null,BUF=null;
function audio(){
  if(AC===false)return null;
  if(AC)return AC;
  const Ctx=(typeof AudioContext!=='undefined'&&AudioContext)||
            (typeof webkitAudioContext!=='undefined'&&webkitAudioContext);
  if(!Ctx){AC=false;return null;}          // destek yoksa sessizce devre dışı
  try{AC=new Ctx();}catch(e){AC=false;return null;}
  return AC;
}
/* Ses cihaz tercihi: ana menüde açık bir kariyer yokken de çalışmalı. Tercih hiç
   yazılmamışsa bu değişiklikten önceki kayıtların ayarına düşülür. */
function sfxOn(){
  if(typeof PREFS!=='undefined'&&PREFS&&PREFS.sfxOn!==undefined)return PREFS.sfxOn!==false;
  return typeof S!=='undefined'&&!!S&&S.sfxOn!==false;
}
/* Darbe bir kez üretilip saklanıyor; her dokunuşta yeniden hesaplanmasına gerek yok. */
function clickBuffer(ac){
  if(BUF)return BUF;
  const n=Math.max(1,Math.floor(ac.sampleRate*CLICK.DUR));
  BUF=ac.createBuffer(1,n,ac.sampleRate);
  const d=BUF.getChannelData(0);
  for(let i=0;i<n;i++){
    const k=i/n;
    /* sert atak, üstel sönüm — tıkın kuru durmasını sağlayan zarf */
    d[i]=(Math.random()*2-1)*Math.exp(-k*22)*(k<0.02?k/0.02:1);
  }
  return BUF;
}
function click(){
  const ac=audio();
  if(!ac)return;
  if(ac.state==='suspended')ac.resume();
  const t=ac.currentTime;
  const src=ac.createBufferSource();src.buffer=clickBuffer(ac);
  const hp=ac.createBiquadFilter();hp.type='highpass';hp.frequency.value=CLICK.LO; // gürlemeyi al
  const lp=ac.createBiquadFilter();lp.type='lowpass'; lp.frequency.value=CLICK.HI; // sertliği al
  const g=ac.createGain();g.gain.value=CLICK.VOL;
  src.connect(hp).connect(lp).connect(g).connect(ac.destination);
  src.start(t);
}
const SFX={tap(){if(sfxOn())click();}};
/* Tek yakalayıcı: her tıklanabilir öğe otomatik ses çıkarır. Tek tek onclick'lere
   ses eklenmediği için bir dokunuşta birden fazla ses çalma ihtimali de yok. */
const SFX_SEL='button,.pitem,.dchoice,.lnk,.ftoggle,.trk,.stCard,.matchrow .tn,tr.click,.chips button,.tabs button,.sknode';
if(typeof document!=='undefined'&&document.addEventListener){
  document.addEventListener('click',e=>{
    if(!sfxOn())return;
    const el=e.target&&e.target.closest?e.target.closest(SFX_SEL):null;
    if(!el||el.disabled)return;
    SFX.tap();
  },true);
}

/* Son 5 maçın ortalama reytingi kulübün cömertliğini doğrudan belirler:
   iyi oynayan zam alır, kötü oynayan almaz. 5 maçı dolmamışsa nötr. */
function negPerf(p){
  const l5=last5Avg(p);
  if(!l5)return 1;
  return clamp(1+(l5-6.80)*0.16,0.88,1.40);
}
function clubMaxWage(p){
  const tm=teamOf(p);
  /* Kulübün cömertliği görüşmenin gerekçesine bağlı: sözleşmesi biten oyuncuyu
     kaybetmemek için para verir, formda olanı ödüllendirir, düşük maaşlıyı hizaya
     çeker. Gerekçesiz masaya oturmaz zaten (bkz. renewBlock). */
  const reason=renewReason(p);
  const lever=reason==='expiring'?1.12:reason==='form'?1.10:reason==='underpaid'?1.02:0.90;
  /* skillBonus('wage') — kulübün ödeyebileceği tavanı yükselten tek yer. */
  const base=marketWage(p.r)*(0.90+(S.rep/500))*(0.8+tm.bud*0.35)*lever*negPerf(p)*(1+skillBonus('wage'));
  /* Yenileme masasında kulüp mevcut maaşın altını teklif etmez — kimse zam
     görüşmesine indirim beklentisiyle oturmaz. İstisnası yaşlanan oyuncu:
     30'unu geçmişse kulübün eli rahatlar, 32'yi geçmişse kesinti isteyebilir. */
  const floor=p.age<=30?1.06:p.age<=32?1.00:0.92;
  return Math.max(base,p.wage*floor);
}
/* Kabul olasılığı — bar da bu değeri gösterir, yani çubuk gerçeği söyler. */
function negChance(p,wage,patience){
  const ratio=wage/negCtx.max;
  const trustBonus=(trustOf(p)-55)/600;
  return clamp(clamp(1.5-ratio,0.05,0.92)*(0.65+0.35*patience/100)
               +S.rep/500+trustBonus+skillBonus('neg'),0,1);
}
function openNeg(pid){
  const p=byId(pid);
  const blk=renewBlock(p);
  if(blk==='pending'){toast(t('contractPendingT'));return;}
  if(blk==='cooldown'){toast(t('renewCdMsg').replace('{w}',renewCd(p)));return;}
  if(blk==='noreason'){toast(t('renewNoReason'));return;}
  const max=clubMaxWage(p);
  /* Açılış talebi kulübün ödeyebileceğinin biraz altında: masaya gerçekçi bir
     rakamla oturursun, pazarlık payı yukarı doğru kalır. Formda bir oyuncuda bu
     rakam ciddi bir zamdır; 33'ünü geçmiş oyuncuda kesinti olabilir — kulüpler
     de öyle davranır. */
  negCtx={pid,round:1,max,patience:100,wage:Math.max(1,Math.round(max*0.95)),

}

function negSubmit(){
  const p=byId(negCtx.pid);
  const ratio=negCtx.wage/negCtx.max;
  /* accepting the club's own counter (or less) always seals the deal */
  const meetsCounter=negCtx.counter&&negCtx.wage<=Math.ceil(negCtx.counter*1.02);
  /* Ekrandaki çubukla birebir aynı hesap — gördüğün oran gerçek oran. */
  const acc=meetsCounter?1:negChance(p,negCtx.wage,negCtx.patience);
  if(RF()<acc){
    /* anlaşma sağlandı — imzalar birkaç hafta içinde atılır, komisyon imzada yatar */
    S.pendC=S.pendC||[];
    S.pendC.push({pid:p.id,wage:negCtx.wage,years:negCtx.years,rate:commissionRate(),at:(S.tw||0)+R(1,2)});
    p.morale=clamp(p.morale+10,0,100);p.ignored=0;p.hm=(S.tw||0)+4;
    /* Yeni imzadan sonra kulüp uzun süre masaya oturmaz. */
    p.rnw=(S.tw||0)+45;
    pushNews('contractAgreed',{n:p.n,pid:p.id,c:teamOf(p).n,tid:p.team,y:negCtx.years,w:fmtK(negCtx.wage)},'good');
    toast(t('negAgreed'));closeModal();save();render();
  } else {
    negCtx.round++;negCtx.patience-=30;
    if(negCtx.round>3||ratio>1.7){
      /* Koptuktan sonra kulüp bir süre masaya dönmez. Bekleme olmasaydı oyuncu
         her hafta yeniden deneyip eninde sonunda kabul ettirirdi. */
      repEvent(-1.5);p.morale=clamp(p.morale-8,0,100);p.rnw=(S.tw||0)+14;
      toast(t('negFail'));closeModal();save();render();
    } else {
      const counter=Math.round(negCtx.max*(0.82+RF()*0.12));
      negCtx.counter=counter;
      negCtx.wage=Math.min(negCtx.wage,Math.round(counter*1.15));
      toast(`${t('counter')}: ${fmtK(counter)}/${t('wk')}`);
      renderNeg();
    }
  }
}

   (bkz. clauseAcc), böylece "az iste, kolay kabul edilsin" dengesi kurulur. */

   Satış payı gelecekteki kazancından alır → zorlaştırır, oran büyüdükçe daha çok. */
function clauseAcc(pay,gb,so){
  const inst=pay>1?Math.min(0.14,0.035*Math.log2(pay)+0.03):0;
  const bonus=gb?0.02+(gb-10)*0.004:0;
  const sell=so?0.02+so*0.0075:0;
  return inst+bonus-sell;
}

   harcayacak yer de büyüsün diye bonservise (yoksa maaşa) endeksli. */

function trToggle(tid){
  if(trSel.has(tid))trSel.delete(tid);else trSel.add(tid);
  const el=document.getElementById('trk'+tid);
  if(el){el.className='trk'+(trSel.has(tid)?' on':'');el.textContent=trSel.has(tid)?'✓':'';}
  const btn=document.getElementById('trBtn');

function submitOffers(pid){
  if(!trSel.size)return;
  if(offerFor(pid)||pendingFor(pid)){toast(t('offerPending'));return;}
  const p=byId(pid),free=isFree(p);
  const feeEl=document.getElementById('feeR');
  const fee=free||!feeEl?0:+feeEl.value/10;
  const pay=free?1:+((document.getElementById('trPay')||{}).value||1);
  const gb=free?0:+((document.getElementById('trGb')||{}).value||0);
  const so=free?0:+((document.getElementById('trSo')||{}).value||0);
  const fix=+((document.getElementById('trFix')||{}).value||0);
  /* aracı ücreti kulüp başına peşin ödenir — anlaşma büyüdükçe pahalanır */
  const fixCost=fix?Math.round(fixCostFor(p,fee)*fix*trSel.size):0;
  if(fixCost>S.cash){toast(t('noCash'));return;}
  S.cash-=fixCost;
  S.offers=S.offers||[];
  trSel.forEach(tid=>S.offers.push({pid,tid,fee,pay,gb,so,fix,at:(S.tw||0)+R(1,3)}));
  trSel=new Set();
  toast(t('offerSent'));
  closeModal();save();render();
}
function doTransfer(p,b,fee,quiet,terms){
  terms=terms||{};
  const oldTm=teamOf(p),old=oldTm.n,wasFree=isFree(p);
  if(wasFree)fee=0;   // bonservissiz oyuncuda kulüpler arası ödeme yok
  /* önceki anlaşmadan "sonraki satıştan pay" varsa şimdi öde */
  if(p.so&&p.so.pct){
    /* klozda yazan oran neyse o ödenir — arayüzdeki %15 ile hesap aynı olmalı */
    const s=Math.max(1,Math.round(fee*1000*p.so.pct/100));
    S.cash+=s;
    pushNews('soPaid',{n:p.n,pid:p.id,f:fmtK(s)},'good');
    p.so=null;
  }
  p.hist=p.hist||[];
  p.hist.push({se:S.season,a:old,b:b.n,f:fee});
  if(p.hist.length>6)p.hist.shift();
  p.team=b.id;p.wage=Math.max(1,Math.round(Math.max(p.wage*1.15,marketWage(p.r)*(0.85+b.bud*0.25))));
  p.yrs=R(2,4);p.morale=clamp(Math.max(p.morale+30,70),0,100);p.ignored=0;p.hm=(S.tw||0)+8;p.form=clamp(p.form+5,0,100);
  delete p.freeFor;
  /* Bonservis yoksa komisyon bonservisten değil, kopardığın sözleşmeden gelir. */
  const rate=transferRate();
  /* Geleceğini bir fona sattıysan (bkz. tpoOffer olayı) bu satıştan sana pay yok. */
  const cut=p.tpo?0:(wasFree?Math.max(1,Math.round(p.wage*52*p.yrs*rate)):Math.max(1,Math.round(fee*1000*rate)));
  if(p.tpo)delete p.tpo;
  const repGain=0.8+Math.max(0,(b.str-oldTm.str)/8);
  /* ödeme planı: komisyon taksitle gelir */
  const plan=terms.pay||1;
  if(!cut){/* fon aldı, sana bir şey kalmadı */}
  else if(plan===1)S.cash+=cut;
  else{
    const part=Math.max(1,Math.round(cut/plan));
    S.cash+=part;
    S.pendPay=S.pendPay||[];
    for(let k=1;k<plan;k++)S.pendPay.push({amt:part,at:(S.tw||0)+k*10,n:p.n});
  }
  /* gol bonusu: eşik ne kadar yüksekse pay o kadar büyük */
  if(terms.gb)(S.deals=S.deals||[]).push({pid:p.id,tid:b.id,goals:terms.gb,
    amt:Math.round(valueOf(p)*1000*(0.10+(terms.gb-10)*0.012)),se:S.season});
  /* sonraki satıştan pay klozu */
  if(terms.so)p.so={pct:terms.so};
  repEvent(repGain);
  pushNews('transfer',{n:p.n,pid:p.id,a:old,aid:oldTm.id,b:b.n,bid:b.id,f:fmtM(fee),k:fmtK(cut)},'good');
  if(!quiet){toast(t('transferDone'));closeModal();save();render();}
}

/* chasePenalty() — imza yarışının tek okuma yeri. Rakip aynı oyuncuyla görüşüyorsa
   şans burada düşer; ekrandaki yüzde de aynı fonksiyondan geldiği için çubuk yine
   gerçeği söyler. */
function pitchChance(p){return clamp(0.55+S.rep/100-(profileOf(p)-62)*0.022+skillBonus('pitch')-chasePenalty(p),0.08,0.95);}
function pitchCd(p){return Math.max(0,(p.cd||0)-(S.tw||0));}

function signClient(p){
  p.agent='you';p.ignored=0;delete p.ra;
  /* Yeni ilişkinin ilk haftalarında rakipler yaklaşmaz (bkz. RIV.poachGrace) */
  p.sa=(S.tw||0);
  if(p.trust===undefined)p.trust=R(48,62);   // yeni ilişki, temkinli bir başlangıç
  if(!S.clients.includes(p.id))S.clients.push(p.id);
  /* Yarıştığın bir ajans varsa oyuncuyu onun elinden aldın: yarış kapanır, husumet
     birikir. Rakipler bunu unutmuyor (bkz. rivals.js — rel). */
  const c=chaseFor(p.id);
  if(c){
    S.chase=S.chase.filter(x=>x!==c);
    const r=rivalById(c.ri);
    if(r){r.rel=clamp((r.rel||0)-10,-100,100);r.lost=(r.lost||0)+1;}
  }
  repEvent(0.4);
  pushNews('sign',{n:p.n,pid:p.id},'good');
  toast(t('pitchOk'));save();render();
}
function releaseClient(pid){
  const p=byId(pid);

  repEvent(-0.8);

function inboxAction(i,yes){
  const m=S.inbox[i];if(!m||!m.action)return;
  const p=byId(m.action.pid);

      signClient(p);
    } else if(m.action.type==='bid'){
      if(offerFor(p.id)||pendingFor(p.id)){toast(t('offerPending'));return;}
      const b=S.teams[m.action.tid];
      if(windowOpen())doTransfer(p,b,m.action.fee);

        <div class="row" style="margin-bottom:8px"><span class="tag g">${t('champion')}: ${NATS[S.wc.champ].c}</span></div></div>`
      +S.wc.rounds.map((rd,ri)=>`<div class="card">
        <div class="sect">${wcRL[ri]}</div>
        ${rd.map(m=>`<div class="matchrow">
          <span class="tn r"><b>${NATS[m.h].c}</b></span>
          <span class="sc">${m.hg} : ${m.ag}</span>
          <span class="tn"><b>${NATS[m.a].c}</b></span></div>`).join('')}</div>`).join('');
      const next=S.wc.se+4;
      body+=`<div class="card"><div class="sub">${t('nextWc')}: ${t('season')} ${next}</div></div>`;
      if((S.wcHist||[]).length>1)body+=`<div class="card"><div class="sect">${t('history')}</div>

  return `${conChips}${cupChips}${body}`;

market(){
  S.f=S.f||{lg:'all',pos:'all',age:'all',sort:'r',elig:true};
  const f=S.f;
  let free=S.players.filter(p=>p.agent===null&&knownLg(teamOf(p).lg));
  if(f.elig)free=free.filter(p=>profileOf(p)<=repCap());
  if(f.lg==='fa')free=free.filter(p=>isFree(p));
  else if(f.lg!=='all')free=free.filter(p=>teamOf(p).lg===+f.lg);
  if(f.pos!=='all')free=free.filter(p=>p.pos===f.pos);
  if(f.age==='u18')free=free.filter(p=>p.age<=18);
  else if(f.age==='u21')free=free.filter(p=>p.age<=21);
  else if(f.age==='u24')free=free.filter(p=>p.age<=24);
  else if(f.age==='o25')free=free.filter(p=>p.age>=25);
  const sorts={r:(a,b)=>b.r-a.r,pot:(a,b)=>b.pot-a.pot||b.r-a.r,age:(a,b)=>a.age-b.age||b.pot-a.pot,ch:(a,b)=>pitchChance(b)-pitchChance(a)||b.r-a.r};
  free.sort(sorts[f.sort]||sorts.r);
  const total=free.length;
  free=free.slice(0,50);
  const sel=(k,opts)=>`<label class="fitem"><span>${t(k==='lg'?'league':k==='pos'?'posF':k==='age'?'ageF':'sortF')}</span>

      const opts=LEAGUES.map((lg,i)=>lg.ctry===cc&&knownLg(i)?
        `<option value="${i}" ${String(f.lg)===String(i)?'selected':''}>${lgName(i)}</option>`:'').join('');
      return opts?`<optgroup label="${CTRYS[cc][L]}">${opts}</optgroup>`:'';
    }).join('')}

  return `<h2 class="sec">${t('freeAgents')}</h2>
   <div class="sub" style="margin-bottom:12px">${t('marketHint')}</div>
   <button class="btn b" style="margin-bottom:12px" onclick="pushV('atlas')">${t('scoutNet')} · ${S.known.length}/${LEAGUES.length} ${t('knownLbl')}</button>

     ${sel('age',[['all',t('all')],['u18','≤ 18'],['u21','≤ 21'],['u24','≤ 24'],['o25','25+']])}
     ${sel('sort',[['r',t('sortR')],['pot',t('sortPot')],['age',t('sortAge')],['ch',t('sortCh')]])}
