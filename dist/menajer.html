  (S.deals=S.deals||[]).forEach(d=>{
    const dp=byId(d.pid);
    if(dp&&dp.team===d.tid&&dp.g>=(d.goals||10)){
      const cut=Math.max(1,Math.round(d.amt*commissionRate()));
      S.cash+=cut;
      pushNews('gbPaid',{n:dp.n,pid:dp.id,g:dp.g,f:fmtK(cut)},'good');
    }
  });
  S.deals=[];
  const gone=[];
  S.players.forEach(p=>{
    p.seasons=p.seasons||[];
    if(p.app>0||p.g>0||p.agent==='you')p.seasons.push({se:S.season,tm:teamOf(p).n,g:p.g,a:p.a,app:p.app||0,min:p.min||0,rt:p.rtN?Math.round(p.rtSum/p.rtN*10)/10:0});
    if(p.seasons.length>6)p.seasons.shift();
    p.age++;p.yrs=Math.max(0,p.yrs-1);
    /* --- development: age + level fit --- */
    /* kulüpsüz oyuncunun antrenman ortamı yok: kendi seviyesini referans alır ve gelişemez */
    const lvl=isFree(p)?p.r+4:tstr[p.team];
    let dev=0;
    if(p.age<=21)dev=R(3,6);
    else if(p.age<=23)dev=R(2,4);
    else if(p.age<=26)dev=R(0,2);
    else if(p.age<=29)dev=R(-1,1);
    else dev=-R(1,3);
    if(dev>0){
      if(p.pot-p.r>=12&&p.age<=23)dev+=1;      // hungry wonderkid
      if(p.r<lvl-9)dev=Math.max(0,dev-3);      // buried at a club too big for him
      if(p.r>lvl+6)dev=Math.max(0,dev-1);      // no challenge left at this level
      if(p.form>65)dev+=1;
    }
    const oldR=p.r;
    p.r=dev>0?clamp(p.r+dev,35,Math.min(p.pot,96)):clamp(p.r+dev,35,96);
    const gained=p.r-oldR;
    if(p.agent==='you'){
      if(gained>=4){S.rep=clamp(S.rep+2,0,100);pushNews('devUp',{n:p.n,pid:p.id,d:gained,r:p.r},'good');}
      else if(gained>=2)S.rep=clamp(S.rep+1,0,100);
      if(p.r>lvl+6&&p.age<=29){pushNews('outgrow',{n:p.n,pid:p.id,c:teamOf(p).n,tid:p.team},'warn');p.morale=clamp(p.morale-12,0,100);}
    }
    p.g=0;p.a=0;p.app=0;p.min=0;p.rtSum=0;p.rtN=0;p.form=R(40,65);
    /* --- kulüpsüz oyuncular: uzun süre imza bulamazsa futbolu bırakır --- */
    if(isFree(p)){
      p.freeFor=(p.freeFor||0)+1;
      /* İş bulamayan zayıf ve yaşlı oyuncular futbolu bırakır. Nitelikli bir oyuncu
         boşta kalmaz — o bir sonraki dengelemede kulüp bulur, listeden düşmez. */
      const weak=p.r<62;
      if(p.age>=35||(weak&&(p.freeFor>=2||RF()<0.35)))gone.push(p);
      return;
    }
    /* --- kariyer sonu --- */
    if(RF()<careerEndProb(p,lvl)){
      if(p.agent==='you'){S.clients=S.clients.filter(c=>c!==p.id);pushNews('retire',{n:p.n,pid:p.id},'info');}
      regenPlayer(p);
      return;
    }
    /* --- sözleşme bitti: kulüp yenileyecek mi? --- */
    if(p.yrs===0){
      /* Sözleşmesini bilerek bitirip piyasaya çıkanlar: kulüp tutmak istese de gider.
         Havuzda ara sıra gerçekten iyi bir oyuncu olsun diye — asıl fırsat bunlar. */
      const runsDown=p.r>=lvl-2&&p.age>=24&&p.age<=31&&RF()<0.05;
      if(!runsDown&&RF()<renewProb(p,lvl)){
        p.yrs=R(2,4);
        p.wage=Math.max(1,Math.round(marketWage(p.r)*(0.85+teamOf(p).bud*0.3)));
        if(p.agent==='you')pushNews('renewed',{n:p.n,pid:p.id,c:teamOf(p).n,tid:p.team,y:p.yrs},'info');
      } else {
        const old=teamOf(p);
        releaseToFree(p);
        if(p.agent==='you')pushNews('released',{n:p.n,pid:p.id,c:old.n,tid:old.id},'warn');
      }
    }
  });
  /* futbolu bırakan kulüpsüz oyuncular listeden düşer — kadrolarda yerleri zaten yok */
  if(gone.length){
    const ids=new Set(gone.map(p=>p.id));
    gone.forEach(p=>{
      if(p.agent==='you'){S.clients=S.clients.filter(c=>c!==p.id);pushNews('retire',{n:p.n,pid:p.id},'info');}
    });
    S.players=S.players.filter(p=>!ids.has(p.id));
  }
  rebalanceSquads();
  S.teams.forEach(tm=>{tm.pts=0;tm.w=0;tm.d=0;tm.l=0;tm.gf=0;tm.ga=0;});
  buildAllFixtures();
  S.finals={};
  S.season++;S.week=1;
}

/* js/market.js — yapay zekâ transfer piyasası: kulüpler arası alım-satım, kulüp bütçeleri, sezon sonu kadro dengesi */
/* ================= KADRO SINIRLARI =================
   playMatchSide en az 1 kaleci + 10 oyuncu bulabilmeli; bu yüzden mevki tabanları sert kuraldır. */
const SQTARGET=16, SQMAX=19;
const FAMAX=60;    // piyasada duran kulüpsüz oyuncu tavanı
const POSMIN={KL:2,DF:4,OS:4,FV:3};
const POSMAX={KL:3,DF:7,OS:7,FV:6};
const STARTERS={KL:1,DF:4,OS:4,FV:2};
/* ================= KULÜP EKONOMİSİ ================= */
/* sezonluk transfer bütçesi (M€) — prestij ve gelir seviyesine bağlı */
function seasonBudget(tm){return +(marketValue(tm.str)*(0.60+tm.bud*1.00)).toFixed(2);}
function clubFin(tm){if(tm.fin===undefined)tm.fin=seasonBudget(tm);return tm.fin;}
/* ================= KADRO İNDEKSİ =================
   Her transfer haftasında bir kez kurulur; tüm oyuncu listesini tekrar tekrar taramamak için. */
function squadIndex(){
  const idx={};
  S.teams.forEach(tm=>{idx[tm.id]={KL:[],DF:[],OS:[],FV:[]};});
  S.players.forEach(p=>{const s=idx[p.team];if(s&&s[p.pos])s[p.pos].push(p);});
  S.teams.forEach(tm=>POS.forEach(k=>idx[tm.id][k].sort((a,b)=>b.r-a.r)));
  return idx;
}
function idxCount(idx,tid){return POS.reduce((s,k)=>s+idx[tid][k].length,0);}
/* kulübün bir mevkideki ilk 11 kalitesi */
function posQuality(lst,k){
  const top=lst.slice(0,STARTERS[k]);
  return top.length?top.reduce((s,p)=>s+p.r,0)/top.length:30;
}
/* müşterilerin ve süreci devam eden oyuncuların dokunulmazlığı var — onları oyuncu yönetir */
function sellable(p){
  return p.agent!=='you'&&!offerFor(p.id)&&!pendingFor(p.id)&&!pendCFor(p.id)&&!movedThisSeason(p);
}
/* ================= ÜCRET ================= */
function aiFee(p){
  if(isFree(p))return 0;                             // bonservissiz
  let f=marketValue(p.r)*(0.85+RF()*0.65);
  if(p.age<=23&&p.pot-p.r>=8)f*=1.25+(p.pot-p.r)/60; // potansiyel primi
  if(p.age>=31)f*=0.55;                              // yaş indirimi
  if(p.yrs<=1)f*=0.60;                               // sözleşmesi bitiyor
  return Math.max(0.05,+f.toFixed(1));
}
/* ================= TRANSFERİN GERÇEKLEŞMESİ ================= */
function aiTransfer(p,buyer,fee,idx){
  const from=teamOf(p),wasFree=isFree(p);
  if(idx){
    if(!wasFree){                       // kulüpsüz oyuncu hiçbir kadro indeksinde değil
      const l=idx[from.id][p.pos],i=l.indexOf(p);
      if(i>=0)l.splice(i,1);
    }
    const nl=idx[buyer.id][p.pos];
    nl.push(p);nl.sort((a,b)=>b.r-a.r);
  }
  /* müşterin bu kulüpte aynı mevkide oynuyorsa yeri tehlikeye giriyor */
  S.clients.forEach(cid=>{
    const c=byId(cid);
    if(c&&c.team===buyer.id&&c.pos===p.pos&&p.r>c.r+1){
      pushNews('rivalSigned',{c:buyer.n,tid:buyer.id,n:p.n,pid:p.id,r:p.r,cn:c.n,cid:c.id,pos:p.pos},'warn');
      c.morale=clamp(c.morale-8,0,100);
    }
  });
  (p.hist=p.hist||[]).push({se:S.season,a:from.n,b:buyer.n,f:fee});
  if(p.hist.length>6)p.hist.shift();
  p.team=buyer.id;
  p.wage=Math.max(1,Math.round(Math.max(p.wage*1.10,marketWage(p.r)*(0.85+buyer.bud*0.25))));
  p.yrs=R(2,4);
  p.morale=clamp(Math.max(p.morale+20,65),0,100);
  p.form=clamp(p.form+4,0,100);
  p.ignored=0;p.hm=(S.tw||0)+8;delete p.freeFor;
  buyer.fin=+(clubFin(buyer)-fee).toFixed(2);
  if(!wasFree)from.fin=+(clubFin(from)+fee*0.7).toFixed(2); // satış geliri yeniden yatırıma döner
  (S.tlog=S.tlog||[]).unshift({se:S.season,w:S.week,pid:p.id,n:p.n,r:p.r,pos:p.pos,age:p.age,a:from.id,b:buyer.id,f:fee});
  if(S.tlog.length>60)S.tlog.pop();
}
/* ================= HAFTALIK PİYASA =================
   Sadece transfer dönemi açıkken çalışır. Her kulüp en zayıf mevkisini güçlendirmeye bakar. */
function simTransfers(){
  if(!windowOpen())return;
  const idx=squadIndex();
  S.teams.forEach(buyer=>{
    if(clubFin(buyer)<0.08)return;
    if(RF()>=0.55+buyer.bud*0.40)return;      // her kulüp her hafta piyasada değil
    if(idxCount(idx,buyer.id)>=SQMAX)return;
    /* prestijine göre en geride kalan mevkiyi seç */
    let bk=null,worst=-99;
    POS.forEach(k=>{
      if(idx[buyer.id][k].length>=POSMAX[k])return;
      const d=buyer.str-posQuality(idx[buyer.id][k],k);
      if(d>worst){worst=d;bk=k;}
    });
    if(!bk)return;
    const mine=idx[buyer.id][bk];
    const sf=(mine[STARTERS[bk]-1]||{r:0}).r;   // en zayıf ilk 11 oyuncusu
    const qf=(mine[mine.length-1]||{r:0}).r;    // mevkideki en zayıf oyuncu
    /* ilk 11'i güçlendirmek asıl hedef; kadroda yer varsa rotasyon oyuncusu da alınır */
    const floor=mine.length<POSMAX[bk]-1?Math.min(sf,qf+2):sf;
    /* dünyayı baştan sona taramak yerine kulüp örnekle */
    const cands=[];
    for(let s=0;s<24;s++){
      const sel=S.teams[R(0,S.teams.length-1)];
      if(sel.id===buyer.id)continue;
      const lst=idx[sel.id][bk];
      if(lst.length<=POSMIN[bk])continue;      // kadrosu zaten dar, satmaz
      /* yedekler her zaman satılık; belirgin şekilde zayıf kulüpler ilk 11'ini de verir */
      const pool=sel.str<buyer.str-5?lst:lst.slice(STARTERS[bk]);
      pool.forEach(p=>{
        if(!sellable(p))return;
        if(p.r<=floor+1)return;                // kadroyu güçlendirmiyor
        if(p.r>buyer.str+5)return;             // bu seviyedeki kulübe gelmez
        const fee=aiFee(p);
        if(fee>clubFin(buyer))return;
        cands.push({p,sel,fee});
      });
    }
    /* bonservissiz oyuncular: kulüp seviyesine uyan her serbest oyuncu adaydır */
    freeAgents().forEach(p=>{
      if(p.pos!==bk||!sellable(p))return;
      if(p.r<=floor-4||p.r>buyer.str+5)return;
      cands.push({p,sel:null,fee:0,free:true});
    });
    if(!cands.length)return;
    /* fiyat/fayda oranına göre sırala, ilk beşten rastgele seç — piyasa deterministik olmasın */
    cands.sort((a,b)=>(b.p.r-floor)/Math.max(0.1,b.fee||0.05)-(a.p.r-floor)/Math.max(0.1,a.fee||0.05));
    const pick=cands[R(0,Math.min(4,cands.length-1))];
    if(pick.free){
      /* satacak kulüp yok; oyuncu ikna olacak mı — seviyesine yakın teklif kazanır */
      if(RF()<clamp(0.55-(buyer.str<pick.p.r-8?0.35:0),0.1,0.9))aiTransfer(pick.p,buyer,0,idx);
      return;
    }
    const v=marketValue(pick.p.r);
    let acc=clamp(0.55+(pick.fee/Math.max(0.05,v)-1)*0.9,0.05,0.90);
    if(buyer.str>pick.sel.str+6)acc+=0.20;     // büyük kulübe hayır demek zor
    if(pick.p.age>=31)acc+=0.15;
    if(RF()<clamp(acc,0.05,0.95))aiTransfer(pick.p,buyer,pick.fee,idx);
  });
}
/* ================= SEZON SONU KADRO DENGESİ =================
   Fazla kadrolu kulüpler fazlalığı bırakır, dar kadrolu kulüpler onları toplar.
   Açıkta kalan boşluklar altyapıdan gelen gençlerle dolar. Toplam oyuncu sayısı sabit kalır. */
function rebalanceSquads(){
  const idx=squadIndex();
  const freed=[];
  /* 1) fazlalıkları serbest bırak — en zayıftan başlayarak, mevki tabanına dokunmadan */
  S.teams.forEach(tm=>{
    let tot=idxCount(idx,tm.id),guard=0;
    while(tot>SQTARGET&&guard++<12){
      let bk=null,bp=null;
      POS.forEach(k=>{
        const l=idx[tm.id][k];
        if(l.length<=POSMIN[k])return;
        const c=l[l.length-1];
        if(!c||c.agent==='you')return;        // müşterini kimse kadro dışı bırakamaz
        if(!bp||c.r<bp.r){bp=c;bk=k;}
      });
      if(!bp)break;
      idx[tm.id][bk].pop();
      freed.push(bp);tot--;
    }
  });
  /* 2) açık kadrolar önce piyasadaki oyunculardan doldurulur: bu sezon bırakılanlar
        ve zaten kulüpsüz olanlar aynı havuzda yarışır. Kimse yoksa altyapı devreye girer. */
  const pool=freed.concat(freeAgents());
  /* Nitelikli oyuncu ilk gelen teklifi imzalamaz. Kararı sezonda bir kez veriyoruz —
     her kulüp denemesinde ayrı ayrı zar atarsak yüzlerce denemede kesin imzalar. */
  pool.forEach(p=>{
    delete p.hold;
    /* yalnızca bu sezon serbest kalanlar bekler; bir sezondur piyasada olan artık imzalar */
    if(p.r>=60&&!(p.freeFor>=1)&&RF()<0.75)p.hold=1;
  });
  const take=(tm,k)=>{
    let bi=-1,bd=1e9;
    pool.forEach((p,i)=>{
      if(p.pos!==k)return;
      if(p.hold)return;   // doğru teklifi bekliyor, sezon başında piyasada kalacak
      /* Seviyesinin üstündeki oyuncu kulüp için fırsattır — kadroda yer varsa reddedilmez.
         Altındaki oyuncu ise tam ceza alır. Aksi halde iyi oyuncular piyasada birikir. */
      const gap=p.r-tm.str;
      const d=(gap>=0?gap*0.15:-gap)+(p.age>=32?3:0);
      if(d<bd){bd=d;bi=i;}
    });
    if(bi<0)return null;
    const p=pool.splice(bi,1)[0];
    p.team=tm.id;p.yrs=R(1,3);p.morale=clamp(p.morale-5,0,100);delete p.freeFor;
    idx[tm.id][k].push(p);
    return p;
  };
  const needy=S.teams.slice().sort(()=>RF()-0.5);
  needy.forEach(tm=>{
    /* Mevki tabanı pazarlık konusu değil: piyasada o mevkiden kimse yoksa altyapıdan
       çıkarılır. Aksi halde kadro 16'ya ulaşmış bir kulüp tek kaleciyle kalabiliyor —
       toplam sayı tuttuğu için ikinci döngü hiç çalışmıyor ve açık kapanmıyordu. */
    POS.forEach(k=>{
      while(idx[tm.id][k].length<POSMIN[k]){
        if(take(tm,k))continue;
        const np=genPlayer(tm,k,R(16,19));
        S.players.push(np);idx[tm.id][k].push(np);
      }
    });
    let tot=idxCount(idx,tm.id),guard=0;
    while(tot<SQTARGET&&guard++<12){
      const k=POS.filter(x=>idx[tm.id][x].length<POSMAX[x])
                 .sort((a,b)=>idx[tm.id][a].length-POSMIN[a]-(idx[tm.id][b].length-POSMIN[b]))[0];
      if(!k)break;
      /* Kadronun bir kısmı altyapıdan gelsin, yoksa genç akışı durur. Ama piyasa
         doluyken kulüpler önce oradan beslenir — yoksa serbest oyuncular birikir. */
      const youthShare=pool.length>70?0.10:0.35;
      if(RF()<youthShare||!take(tm,k)){
        const np=genPlayer(tm,k,R(16,19));
        S.players.push(np);idx[tm.id][k].push(np);
      }
      tot++;
    }
  });
  /* 3) kulüp bulamayanlar piyasada kalır; havuz şişerse en zayıflar futbolu bırakır.
        Bekleme kararı burada biter — sezon boyunca kulüpler onlara teklif götürebilir. */
  pool.forEach(p=>{delete p.hold;if(p.team>=0)return;p.team=-1;p.yrs=0;p.freeFor=p.freeFor||0;});
  freed.forEach(p=>{if(p.team>=0)return;releaseToFree(p);});
  const fa=freeAgents().filter(p=>p.agent!=='you');
  if(fa.length>FAMAX){
    fa.sort((a,b)=>(a.r-a.age*0.6)-(b.r-b.age*0.6));   // en zayıf ve en yaşlı önce
    const drop=new Set(fa.slice(0,fa.length-FAMAX).map(p=>p.id));
    S.players=S.players.filter(p=>!drop.has(p.id));
  }
  /* 4) prestij gerçek kadro gücüne doğru kayar ama kulüp kimliğinden fazla uzaklaşmaz */
  S.teams.forEach(tm=>{
    if(tm.str0===undefined)tm.str0=tm.str;
    const real=teamStr(tm.id);
    tm.str=Math.round(clamp(tm.str*0.7+real*0.3,tm.str0-8,tm.str0+8));
    tm.fin=seasonBudget(tm);
  });
}

/* js/events.js — olaylar: menajerliğin sahada olmayan tarafı.
   Yeni olay eklemek için EVENTS dizisine bir kayıt yazmak yeterli:
     id   : benzersiz kısa ad
     w    : ağırlık (büyük olan daha sık çıkar)
     need : 'client' ise bir müşteri gerekir; yoksa menajerle ilgili olaydır
     when : (c)=>bool — ek uygunluk koşulu
     ttl  : (c)=>{tr,en} başlık
     txt  : (c)=>{tr,en} gövde
     opts : [{ t:{tr,en}, eff:(c)=>({cash,rep,morale,trust,form,msg}) }]
   Sonuçlar tek bir uygulayıcıdan geçer (applyEff), böylece her olay aynı
   kaldıraçları kullanır ve denge tek yerden ayarlanır. */

const EV_CHANCE=0.16;   // uygun bir hafta içinde olay çıkma olasılığı
const EV_GAP=3;         // iki olay arasında en az bu kadar hafta

/* Olay bağlamı: seçilen müşteri (varsa) ve türetilmiş bilgiler */
function evCtx(pid){
  const p=pid!==undefined&&pid!==null?byId(pid):null;
  return {p,tm:p?teamOf(p):null,pid};
}
const EVENTS=[
/* ================= MÜŞTERİYLE İLGİLİ ================= */
{id:'rivalAgent',w:10,need:'client',
 ttl:()=>({tr:'Rakip menajer devrede',en:'A rival agent is circling'}),
 txt:c=>({tr:`Kulislerde bir isim dolaşıyor: ${c.p.n} ile başka bir menajer görüşmüş. Oyuncu sana bir şey söylemedi ama haber kulağına geldi.`,
          en:`Word is going around that another agent has been meeting ${c.p.n}. He hasn't mentioned it to you, but you've heard.`}),
 opts:[
  {t:{tr:'Doğrudan sor, açık konuş',en:'Ask him straight out'},
   eff:c=>RF()<0.55+trustOf(c.p)/300
     ?{trust:8,morale:2,msg:{tr:'Dürüstlüğün hoşuna gitti. "Sen sorana kadar söylemeye çekiniyordum." Aranız daha da sağlamlaştı.',
                             en:'He appreciated the directness. "I was hesitant to bring it up." You came out stronger.'}}
     :{trust:-7,msg:{tr:'Sorgulanmaktan hoşlanmadı. "Beni takip mi ediyorsun?" Araya soğukluk girdi.',
                     en:'He didn\'t like being questioned. "Are you keeping tabs on me?" Things cooled off.'}}},
  {t:{tr:'Sessiz kal, işini daha iyi yap',en:'Say nothing, just do better work'},
   eff:()=>({trust:3,msg:{tr:'Konuyu açmadın. Zaman kazandın ama belirsizlik sürüyor.',
                          en:'You let it lie. You bought time, but the uncertainty remains.'}})},
  {t:{tr:'Komisyonundan feda et, bağlılığını satın al',en:'Cut your commission to keep him close'},
   eff:c=>({cash:-Math.max(20,Math.round(c.p.wage*8)),trust:14,morale:4,
            msg:{tr:'Cebinden çıktı ama oyuncu bunu unutmayacak.',en:'It cost you, but he won\'t forget it.'}})}]},

{id:'playTime',w:9,need:'client',when:c=>c.p.min<600&&!isFree(c.p),
 ttl:()=>({tr:'Forma şansı meselesi',en:'A question of minutes'}),
 txt:c=>({tr:`${c.p.n} arıyor. "${c.tm.n}'de oynamıyorum. Ya bir şey yap ya da bana doğruyu söyle."`,
          en:`${c.p.n} calls. "I'm not playing at ${c.tm.n}. Either fix it or tell me the truth."`}),

/* ================= MOTOR ================= */
function evEligible(){
  const cl=S.clients.map(byId).filter(Boolean);
  return EVENTS.filter(e=>{
    if(e.need==='client'&&!cl.length)return false;
    if(!e.when)return true;
    return cl.some(p=>{try{return e.when({p,tm:teamOf(p)});}catch(x){return false;}});
  });
}
function rollEvent(){
  if(S.evOn===false)return null;
  if(!S.agent)return null;
  if((S.evNext||0)>(S.tw||0))return null;
  if(RF()>=EV_CHANCE)return null;
  const pool=evEligible();
  if(!pool.length)return null;
  let tot=pool.reduce((s,e)=>s+e.w,0),x=RF()*tot,ev=pool[pool.length-1];
  for(const e of pool){x-=e.w;if(x<=0){ev=e;break;}}
  let pid=null;
  if(ev.need==='client'){
    const cands=S.clients.map(byId).filter(p=>p&&(!ev.when||ev.when({p,tm:teamOf(p)})));
    if(!cands.length)return null;
    pid=cands[R(0,cands.length-1)].id;
  }
  S.evNext=(S.tw||0)+EV_GAP+R(0,3);
  return {id:ev.id,pid};
}
function evById(id){return EVENTS.find(e=>e.id===id);}
/* Tek uygulayıcı: bütün olaylar aynı kaldıraçlardan geçer. */
function applyEff(r,c){
  const out=[];
  if(r.cash){S.cash=Math.round((S.cash+r.cash)*10)/10;out.push({k:'cash',v:r.cash});}
  if(r.rep){S.rep=clamp(S.rep+r.rep,0,100);out.push({k:'rep',v:r.rep});}
  if(c.p){
    if(r.morale){moraleEvent(c.p,r.morale);out.push({k:'morale',v:r.morale});}
    if(r.trust){trustEvent(c.p,r.trust);out.push({k:'trust',v:r.trust});}
    if(r.form){c.p.form=stat(c.p.form+r.form,5);out.push({k:'form',v:r.form});}
  }
  return out;
}

/* js/sfx.js — arayüz sesi.
   Ses dosyası yok: Web Audio ile anlık sentezleniyor, böylece tek dosya çıktısı ve
   çevrimdışı çalışma bozulmuyor.

   Tasarım: tek ve kısa bir TIK. Ton yok — sürekli bir frekans "bip" gibi duyuluyor,
   alçak frekanslı bir vuruş ise "tok" oluyor. Tık dediğimiz şey aslında çok kısa,
   kuru bir darbe: filtrelenmiş gürültünün 12 milisaniyede sönmesi.

   Ayar düğmeleri (tek satırla değiştirilebilir):
     DUR  ↓ daha kısa/keskin, ↑ daha yumuşak
     LO   ↑ daha ince ve net, ↓ daha kalın
     HI   ↓ tizliği keser, sertliği alır
     VOL  ses seviyesi */
const CLICK={DUR:0.013,LO:700,HI:4800,VOL:0.30};
let AC=null,BUF=null;
function audio(){
  if(AC===false)return null;
  if(AC)return AC;
  const Ctx=(typeof AudioContext!=='undefined'&&AudioContext)||
            (typeof webkitAudioContext!=='undefined'&&webkitAudioContext);
  if(!Ctx){AC=false;return null;}          // destek yoksa sessizce devre dışı
  try{AC=new Ctx();}catch(e){AC=false;return null;}
  return AC;
}
function sfxOn(){return typeof S!=='undefined'&&S&&S.sfxOn!==false;}
/* Darbe bir kez üretilip saklanıyor; her dokunuşta yeniden hesaplanmasına gerek yok. */
function clickBuffer(ac){
  if(BUF)return BUF;
  const n=Math.max(1,Math.floor(ac.sampleRate*CLICK.DUR));
  BUF=ac.createBuffer(1,n,ac.sampleRate);
  const d=BUF.getChannelData(0);
  for(let i=0;i<n;i++){
    const k=i/n;
    /* sert atak, üstel sönüm — tıkın kuru durmasını sağlayan zarf */
    d[i]=(Math.random()*2-1)*Math.exp(-k*22)*(k<0.02?k/0.02:1);
  }
  return BUF;
}
function click(){
  const ac=audio();
  if(!ac)return;
  if(ac.state==='suspended')ac.resume();
  const t=ac.currentTime;
  const src=ac.createBufferSource();src.buffer=clickBuffer(ac);
  const hp=ac.createBiquadFilter();hp.type='highpass';hp.frequency.value=CLICK.LO; // gürlemeyi al
  const lp=ac.createBiquadFilter();lp.type='lowpass'; lp.frequency.value=CLICK.HI; // sertliği al
  const g=ac.createGain();g.gain.value=CLICK.VOL;
  src.connect(hp).connect(lp).connect(g).connect(ac.destination);
  src.start(t);
}
const SFX={tap(){if(sfxOn())click();}};
/* Tek yakalayıcı: her tıklanabilir öğe otomatik ses çıkarır. Tek tek onclick'lere
   ses eklenmediği için bir dokunuşta birden fazla ses çalma ihtimali de yok. */
const SFX_SEL='button,.pitem,.dchoice,.lnk,.ftoggle,.trk,.stCard,.matchrow .tn,tr.click,.chips button,.tabs button';
if(typeof document!=='undefined'&&document.addEventListener){
  document.addEventListener('click',e=>{
    if(!sfxOn())return;
    const el=e.target&&e.target.closest?e.target.closest(SFX_SEL):null;
    if(!el||el.disabled)return;
    SFX.tap();
  },true);
}

function clubMaxWage(p){
  const tm=teamOf(p);
  /* Kulübün cömertliği görüşmenin gerekçesine bağlı: sözleşmesi biten oyuncuyu
     kaybetmemek için para verir, formda olanı ödüllendirir, düşük maaşlıyı hizaya
     çeker. Gerekçesiz masaya oturmaz zaten (bkz. renewBlock). */
  const reason=renewReason(p);
  const lever=reason==='expiring'?1.10:reason==='form'?1.04:reason==='underpaid'?0.98:0.88;
  return marketWage(p.r)*(0.85+(p.form-50)/250+(S.rep/500))*(0.8+tm.bud*0.35)*lever;
}

function negSubmit(){

  /* accepting the club's own counter (or less) always seals the deal */
  const meetsCounter=negCtx.counter&&negCtx.wage<=Math.ceil(negCtx.counter*1.02);
  /* Sana güvenen oyuncu masada arkanda durur; güvenmeyen kendi hesabını yapar. */

  const acc=meetsCounter?1:clamp(1.5-ratio,0.05,0.92)*(0.65+0.35*negCtx.patience/100)+S.rep/500+trustBonus;
  if(RF()<acc){
    /* anlaşma sağlandı — imzalar birkaç hafta içinde atılır, komisyon imzada yatar */
    S.pendC=S.pendC||[];
    S.pendC.push({pid:p.id,wage:negCtx.wage,years:negCtx.years,rate:commissionRate(),at:(S.tw||0)+R(1,2)});
    p.morale=clamp(p.morale+10,0,100);p.ignored=0;p.hm=(S.tw||0)+4;

  } else {
    negCtx.round++;negCtx.patience-=30;
    if(negCtx.round>3||ratio>1.7){
      S.rep=clamp(S.rep-2,0,100);p.morale=clamp(p.morale-8,0,100);
      toast(t('negFail'));closeModal();save();render();
    } else {
      const counter=Math.round(negCtx.max*(0.82+RF()*0.12));
      negCtx.counter=counter;
      negCtx.wage=Math.min(negCtx.wage,Math.round(counter*1.15));

      renderNeg();

/* Ek madde kademeleri. Kabul etkisi seçilen büyüklükle orantılı hesaplanır
   (bkz. clauseAcc), böylece "az iste, kolay kabul edilsin" dengesi kurulur. */
const PAYPLANS=[2,3,4,6,8,12];

/* Taksit ve gol bonusu kulübün riskini azaltır → kabulü kolaylaştırır.
   Satış payı gelecekteki kazancından alır → zorlaştırır, oran büyüdükçe daha çok. */
function clauseAcc(pay,gb,so){
  const inst=pay>1?Math.min(0.14,0.035*Math.log2(pay)+0.03):0;
  const bonus=gb?0.02+(gb-10)*0.004:0;
  const sell=so?0.02+so*0.0075:0;
  return inst+bonus-sell;
}
/* Aracı ücreti: kulüp başına, anlaşmanın büyüklüğüne göre. Kasadaki para büyüdükçe
   harcayacak yer de büyüsün diye bonservise (yoksa maaşa) endeksli. */
function fixCostFor(p,fee){
  const base=fee>0?fee*1000*0.05:p.wage*22*0.05;
  return Math.max(4,Math.round(base));
}

function trToggle(tid){
  if(trSel.has(tid))trSel.delete(tid);else trSel.add(tid);
  const el=document.getElementById('trk'+tid);
  if(el){el.className='trk'+(trSel.has(tid)?' on':'');el.textContent=trSel.has(tid)?'✓':'';}
  const btn=document.getElementById('trBtn');
  if(btn){btn.disabled=trSel.size===0;btn.textContent=t('sendOffers')+(trSel.size?' ('+trSel.size+')':'');}
}
function submitOffers(pid){
  if(!trSel.size)return;
  if(offerFor(pid)||pendingFor(pid)){toast(t('offerPending'));return;}
  const p=byId(pid),free=isFree(p);
  const feeEl=document.getElementById('feeR');
  const fee=free||!feeEl?0:+feeEl.value/10;
  const pay=free?1:+((document.getElementById('trPay')||{}).value||1);
  const gb=free?0:+((document.getElementById('trGb')||{}).value||0);
  const so=free?0:+((document.getElementById('trSo')||{}).value||0);
  const fix=+((document.getElementById('trFix')||{}).value||0);
  /* aracı ücreti kulüp başına peşin ödenir — anlaşma büyüdükçe pahalanır */
  const fixCost=fix?Math.round(fixCostFor(p,fee)*fix*trSel.size):0;
  if(fixCost>S.cash){toast(t('noCash'));return;}
  S.cash-=fixCost;
  S.offers=S.offers||[];
  trSel.forEach(tid=>S.offers.push({pid,tid,fee,pay,gb,so,fix,at:(S.tw||0)+R(1,3)}));
  trSel=new Set();
  toast(t('offerSent'));
  closeModal();save();render();
}
function doTransfer(p,b,fee,quiet,terms){
  terms=terms||{};
  const oldTm=teamOf(p),old=oldTm.n,wasFree=isFree(p);
  if(wasFree)fee=0;   // bonservissiz oyuncuda kulüpler arası ödeme yok
  /* önceki anlaşmadan "sonraki satıştan pay" varsa şimdi öde */
  if(p.so&&p.so.pct){
    /* klozda yazan oran neyse o ödenir — arayüzdeki %15 ile hesap aynı olmalı */
    const s=Math.max(1,Math.round(fee*1000*p.so.pct/100));
    S.cash+=s;
    pushNews('soPaid',{n:p.n,pid:p.id,f:fmtK(s)},'good');
    p.so=null;
  }
  p.hist=p.hist||[];
  p.hist.push({se:S.season,a:old,b:b.n,f:fee});
  if(p.hist.length>6)p.hist.shift();
  p.team=b.id;p.wage=Math.max(1,Math.round(Math.max(p.wage*1.15,marketWage(p.r)*(0.85+b.bud*0.25))));
  p.yrs=R(2,4);p.morale=clamp(Math.max(p.morale+30,70),0,100);p.ignored=0;p.hm=(S.tw||0)+8;p.form=clamp(p.form+5,0,100);
  delete p.freeFor;
  /* Bonservis yoksa komisyon bonservisten değil, kopardığın sözleşmeden gelir. */
  const rate=commissionRate();
  const cut=wasFree?Math.max(1,Math.round(p.wage*52*p.yrs*rate)):Math.max(1,Math.round(fee*1000*rate));
  const repGain=Math.round(2+Math.max(0,(b.str-oldTm.str)/4));
  /* ödeme planı: komisyon taksitle gelir */
  const plan=terms.pay||1;
  if(plan===1)S.cash+=cut;
  else{
    const part=Math.max(1,Math.round(cut/plan));
    S.cash+=part;
    S.pendPay=S.pendPay||[];
    for(let k=1;k<plan;k++)S.pendPay.push({amt:part,at:(S.tw||0)+k*10,n:p.n});
  }
  /* gol bonusu: eşik ne kadar yüksekse pay o kadar büyük */
  if(terms.gb)(S.deals=S.deals||[]).push({pid:p.id,tid:b.id,goals:terms.gb,
    amt:Math.round(marketValue(p.r)*1000*(0.10+(terms.gb-10)*0.012)),se:S.season});
  /* sonraki satıştan pay klozu */
  if(terms.so)p.so={pct:terms.so};
  S.rep=clamp(S.rep+repGain,0,100);
  pushNews('transfer',{n:p.n,pid:p.id,a:old,aid:oldTm.id,b:b.n,bid:b.id,f:fmtM(fee),k:fmtK(cut)},'good');
  if(!quiet){toast(t('transferDone'));closeModal();save();render();}
}

function meetCtxOf(p){
  return {young:p.age<=21&&p.pot-p.r>=8, unhappy:p.morale<40,
    lowWage:p.wage<marketWage(p.r)*0.75, veteran:p.age>=30,
    ambitious:p.r>teamStr(p.team)+5, form:p.form,
    content:!(p.morale<40)&&!(p.wage<marketWage(p.r)*0.75)};
}
function meetHint(c){
  return c.unhappy?t('mcUnhappy'):c.ambitious?t('mcAmb'):c.lowWage?t('mcWage'):
         c.young?t('mcYoung'):c.veteran?t('mcVet'):t('mcCont');

let MT=null;
function openMeeting(pid){
  const p=byId(pid);
  if(!knownLg(teamOf(p).lg)){toast(t('scoutLock'));return;}
  if(profileOf(p)>repCap()){toast(t('repLock')+' ('+t('rep')+' '+repNeedFor(profileOf(p))+'+)');return;}
  if(S.clients.length>=maxClients()){toast(t('full'));return;}
  if(pitchCd(p)>0){toast(t('rejectedCd'));return;}
  if(S.cash<pitchCost(p)){toast(t('noCash'));return;}
  const order=LINES.map((_,i)=>i).sort(()=>RF()-0.5);
  MT={pid,ctx:meetCtxOf(p),chance:Math.round(pitchChance(p)*100),round:0,order,react:null};
  renderMeeting();
}
function pickLine(li){
  if(!MT||MT.round>=3)return;
  const d=LINES[li].eff(MT.ctx)+R(-2,2);
  MT.chance=clamp(MT.chance+d,5,92);
  const pool=d>=6?REACT.good:d<=-4?REACT.bad:REACT.mid;
  const arr=pool[L];
  MT.react={txt:arr[R(0,arr.length-1)],d};
  MT.round++;
  renderMeeting();
}
function renderMeeting(){
  const p=byId(MT.pid),tm=teamOf(p);
  const col=MT.chance>60?'var(--acc)':MT.chance>35?'var(--warn)':'var(--bad)';
  const opts=MT.round<3?MT.order.slice(MT.round*3,MT.round*3+3):[];

     ${MT.react?`<div class="dquote ${MT.react.d>=6?'good':MT.react.d<=-4?'bad':'mid'}">${MT.react.txt}

   <button class="btn s" style="margin-top:8px" onclick="leaveMeeting()">${t('walkAway')}</button>`);

function finishMeeting(){
  if(!MT)return;
  const p=byId(MT.pid);
  if(RF()<MT.chance/100){
    S.cash-=pitchCost(p);
    MT=null;
    signClient(p);
    closeModal();
  } else {
    p.cd=(S.tw||0)+4;
    MT=null;
    toast(t('pitchNo'));closeModal();save();render();

function leaveMeeting(){
  if(MT){
    const p=byId(MT.pid);

  }

function pitchCost(p){return 10+Math.round(Math.max(0,p.r-65)*2);}
function pitchChance(p){return clamp(0.55+S.rep/100-(profileOf(p)-62)*0.022,0.08,0.95);}
function pitchCd(p){return Math.max(0,(p.cd||0)-(S.tw||0));}
function pitchPlayer(pid){openMeeting(pid);} // pitching now happens through a real conversation
function signClient(p){
  p.agent='you';p.ignored=0;
  if(p.trust===undefined)p.trust=R(48,62);   // yeni ilişki, temkinli bir başlangıç
  if(!S.clients.includes(p.id))S.clients.push(p.id);
  S.rep=clamp(S.rep+1,0,100);
  pushNews('sign',{n:p.n,pid:p.id},'good');
  toast(t('pitchOk'));save();render();
}
function releaseClient(pid){
  const p=byId(pid);
  p.agent=null;S.clients=S.clients.filter(c=>c!==pid);
  S.rep=clamp(S.rep-1,0,100);
  save();render();

function inboxAction(i,yes){
  const m=S.inbox[i];if(!m||!m.action)return;
  const p=byId(m.action.pid);
  if(yes){
    if(m.action.type==='sign'){
      if(S.clients.length>=maxClients()){toast(t('full'));return;}
      signClient(p);
    } else if(m.action.type==='bid'){
      if(offerFor(p.id)||pendingFor(p.id)){toast(t('offerPending'));return;}
      const b=S.teams[m.action.tid];
      if(windowOpen())doTransfer(p,b,m.action.fee);
      else{
        S.pending=S.pending||[];
        S.pending.push({pid:p.id,tid:b.id,fee:m.action.fee});
        pushNews('agreedWait',{c:b.n,tid:b.id,n:p.n,pid:p.id,f:fmtM(m.action.fee),w:nextWindowLabel()},'good');
        p.morale=clamp(p.morale+10,0,100);p.ignored=0;
      }
    }
  }
  m.action=null;m.read=true;save();render();
}

/* lock=true iken arka plana dokunmak kapatmaz — karar verilmesi gereken ekranlar
   (olaylar) böyle açılır, yoksa seçim yapmadan atlanabiliyor. */
let modalLock=false;
function openModal(html,lock){
  modalLock=!!lock;
  const sh=document.getElementById('sheet');
  sh.innerHTML=(lock?'':'<div class="handle"></div>')+html;
  if(sh.classList){sh.classList.remove('sin');void (sh.offsetWidth||0);sh.classList.add('sin');}
  document.getElementById('modal').classList.add('open');
}
/* arka plana dokunma yalnızca kilitli değilse kapatır */
function dismissModal(){if(!modalLock)closeModal();}
/* Bir hafta içinde hem rapor hem olay çıkabiliyor; üst üste binmesinler diye sıra.
   Modal kapanınca sıradaki kendiliğinden açılır. */
let modalQueue=[];
function modalOpen(){return document.getElementById('modal').classList.contains('open');}
function pushModal(fn){
  modalQueue.push(fn);
  if(!modalOpen())runNextModal();
}
function runNextModal(){
  const fn=modalQueue.shift();
  if(fn)fn();
}
function closeModal(){
  modalLock=false;
  document.getElementById('modal').classList.remove('open');
  if(modalQueue.length)setTimeout(runNextModal,220);
}

league(){
  if((S.curCon||'eu')==='cup')return cupView();
  const lg=S.curLg;
  const tab=S.ltab||'table';
  /* season browser */
  S.arch=S.arch||LEAGUES.map(()=>[]);
  const archL=S.arch[lg]||[];
  const live=S.season;
  const minSe=archL.length?archL[0].se:live;
  let vSe=S.vSe===undefined?live:S.vSe;
  vSe=Math.max(minSe,Math.min(live,vSe));
  const isLive=vSe===live;
  const aEntry=isLive?null:archL.find(x=>x.se===vSe);
  const selRow=(tab==='table'||tab==='scorers'||tab==='assists')?
   `<div class="card tight" style="margin-bottom:12px"><div class="row" style="justify-content:space-between;padding:5px 0">
     <button class="btn s" style="width:42px;padding:7px" ${vSe<=minSe?'disabled':''} onclick="S.vSe=${vSe-1};render()">‹</button>
     <b style="font-variant-numeric:tabular-nums">${t('season')} ${vSe} <span class="faint" style="font-weight:400">· ${isLive?t('liveLbl'):t('archLbl')}</span></b>
     <button class="btn s" style="width:42px;padding:7px" ${vSe>=live?'disabled':''} onclick="S.vSe=${vSe+1};render()">›</button>
   </div></div>`:'';
  let body='';
  if(tab==='table'){
    const myTeams=new Set(S.clients.map(id=>byId(id).team));
    const l2=LEAGUES[lg];
    const glbl=g=>l2.gl?l2.gl[g][L==='tr'?0:1]:null;
    const toRows=tbl=>tbl.map(tm=>[tm.id,tm.pts,tm.w,tm.d,tm.l,tm.gf,tm.ga]);
    const rowsHtml=(rows,grouped)=>`<table>
    <tr><th></th><th>${t('team')}</th><th class="c">${t('P')}</th><th class="c">${t('W')}</th><th class="c">${t('D')}</th><th class="c">${t('L')}</th><th class="c">${t('GD')}</th><th class="c">${t('PTS')}</th></tr>
    ${rows.map((r,i)=>{
      const tm=S.teams[r[0]];
      const z=grouped?(i===0?'zone1':''):(i===0?'zone1':i<4?'zone2':i>=rows.length-3?'zoneR':'');
      return `<tr class="click ${myTeams.has(tm.id)?'hl':''}" onclick="pushV('team',${tm.id})">
      <td><span class="posn ${z}">${i+1}</span></td>
      <td><div class="row" style="gap:8px;min-width:0">${tmBadge(tm,22)}
        <b style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${tm.n}</b></div></td>
      <td class="c">${r[2]+r[3]+r[4]}</td><td class="c">${r[2]}</td><td class="c">${r[3]}</td><td class="c">${r[4]}</td>
      <td class="c">${r[5]-r[6]}</td><td class="c"><b>${r[1]}</b></td></tr>`;}).join('')}</table>`;
    let parts=null;
    if(isLive){
      parts=l2.grp?[[glbl(0),toRows(groupTable(lg,0))],[glbl(1),toRows(groupTable(lg,1))]]
                  :[[null,toRows(leagueTable(lg))]];
    } else if(aEntry){
      parts=aEntry.tabs?[[glbl(0),aEntry.tabs[0]],[glbl(1),aEntry.tabs[1]]]:[[null,aEntry.tab]];
    }
    /* final result banner for grouped leagues */
    let finHtml='';
    if(l2.grp){
      let f=null;
      if(isLive){const ff=(S.finals||{})[lg];if(ff&&ff.se===S.season)f=ff;}
      else if(aEntry&&aEntry.fin)f={h:aEntry.fin[0],a:aEntry.fin[1],hg:aEntry.fin[2],ag:aEntry.fin[3]};
      if(f){
        const th=S.teams[f.h],ta=S.teams[f.a];
        finHtml=`<div class="card"><div class="sect">${t('finalLbl')}</div>
        <div class="matchrow" style="border:none;padding:2px 0">
          <span class="tn r" onclick="pushV('team',${th.id})">${th.n}</span>
          ${tmBadge(th,20)}<span class="sc">${f.hg} : ${f.ag}</span>${tmBadge(ta,20)}
          <span class="tn" onclick="pushV('team',${ta.id})">${ta.n}</span></div></div>`;
      }
    }
    body=parts?finHtml+parts.map(([lbl,rows])=>`<div class="card tight">
      ${lbl?`<div class="sect" style="margin:12px 0 0">${lbl}</div>`:''}${rowsHtml(rows,!!lbl)}</div>`).join('')
      :`<div class="card">${emptyState('league',t('notArch'),'')}</div>`;
  } else if(tab==='fix'){
    const len=lgWeeks(lg);
    const lim=len-1+(LEAGUES[lg].grp?1:0); // grouped leagues get an extra "Final" page
    const wk=Math.min(S.fxWeek!==undefined?S.fxWeek:Math.min(S.week-1,lim),lim);
    const lbl=wk<len?`${t('week')} ${wk+1}<span class="faint">/${len}</span>`:t('finalLbl');
    body=`<div class="card"><div class="row" style="justify-content:space-between;margin-bottom:10px">
      <button class="btn s" style="width:42px;padding:7px" onclick="S.fxWeek=${Math.max(0,wk-1)};render()">‹</button>
      <b style="font-variant-numeric:tabular-nums">${lbl}</b>
      <button class="btn s" style="width:42px;padding:7px" onclick="S.fxWeek=${Math.min(lim,wk+1)};render()">›</button></div>
      ${weekFixHtml(lg,wk)}</div>`;
  } else if(tab==='tr'){
    const rows=(S.tlog||[]).filter(x=>(x.a>=0&&S.teams[x.a].lg===lg)||S.teams[x.b].lg===lg);
    if(!rows.length)body=`<div class="card">${emptyState('market',t('noTransfers'),'')}</div>`;
    else body=`<div class="sub" style="margin:0 2px 10px">${t('transfersSub')}</div>
    ${listWrap(rows.map(x=>{
      const from=x.a>=0?S.teams[x.a].n:t('faShort'),to=S.teams[x.b];
      return `<div class="pitem" onclick="pushV('team',${to.id})">
        ${tmBadge(to,34)}
        <div class="pinfo"><div class="pname"><span style="overflow:hidden;text-overflow:ellipsis">${x.n}</span>
          <span class="natc">${POSL[L][x.pos]}</span></div>
        <div class="psub">${from} → <b style="color:var(--txt2)">${to.n}</b> · ${x.age} · S${x.se}/${t('wk')}${x.w}</div></div>
        <div style="text-align:right;flex-shrink:0">
          <div class="num" style="font-size:12px;font-weight:800;color:var(--gold)">${x.f?fmtM(x.f):t('freeFee')}</div>
          <div class="l" style="font-size:9px;color:var(--txt3)">${t('feeL')}</div></div>
        <div class="rt ${rtClass(x.r)}">${x.r}</div></div>`;
    }).join(''))}`;
  } else if(tab==='hist'){
    const h=((S.lgHist||[])[lg]||[]).slice().reverse();
    if(!h.length)body=`<div class="card"><div class="empty">${t('noHist')}</div></div>`;
    else{
      const counts={};
      ((S.lgHist||[])[lg]||[]).forEach(x=>counts[x.tid]=(counts[x.tid]||0)+1);
      const bestId=+Object.entries(counts).sort((a,b)=>b[1]-a[1])[0][0];
      const bestTm=S.teams[bestId];
      body=`<div class="card">
        <div class="sect">${t('mostTitles')}</div>
        <div class="row" style="cursor:pointer" onclick="pushV('team',${bestId})">
          ${tmBadge(bestTm,36)}
          <div><b>${bestTm.n}</b><div class="sub">${counts[bestId]} ${t('titles')}</div></div>
        </div></div>
      <div class="list">
      ${h.map(x=>{
        const tm=S.teams[x.tid];
        return `<div class="pitem" onclick="pushV('team',${x.tid})">
          <span class="posn" style="width:30px">S${x.se}</span>
          ${tmBadge(tm,30)}
          <div class="pinfo"><div class="pname">${tm.n}</div>
          <div class="psub">${t('topScorer')}: ${x.ts} (${x.g})</div></div>
          <span class="faint">›</span></div>`;
      }).join('')}
      </div>`;
    }
  } else {
    const key=tab==='scorers'?'g':'a';
    let rows;
    if(isLive){
      rows=S.players.filter(p=>p[key]>0&&teamOf(p).lg===lg).sort((a,b)=>b[key]-a[key]).slice(0,15)
        .map(p=>[p.n,p.team,p[key],p.id,p.agent==='you']);
    } else rows=aEntry?(key==='g'?aEntry.sc:aEntry.as).map(r=>[r[0],r[1],r[2],null,false]):null;
    if(!rows)body=`<div class="card">${emptyState('league',t('notArch'),'')}</div>`;
    else body=`<div class="card tight"><table>
    <tr><th></th><th>${t('player')}</th><th>${t('team')}</th><th class="c">${key==='g'?t('goals'):t('assists')}</th></tr>
    ${rows.map((r,i)=>`<tr class="${r[3]?'click':''} ${r[4]?'hl':''} ${i<3?'top3':''}" ${r[3]?`onclick="pushV('player',${r[3]})"`:''}>
    <td><span class="posn ${i===0?'zone1':''}">${i+1}</span></td>
    <td><b>${r[0]}</b>${r[4]?' <span class="star">★</span>':''}</td>
    <td><div class="row" style="gap:6px">${tmBadge(S.teams[r[1]],18)}<span class="sub">${S.teams[r[1]].n}</span></div></td>
    <td class="c"><b>${r[2]}</b></td></tr>`).join('')}
    ${!rows.length?`<tr><td colspan="4" class="empty">—</td></tr>`:''}</table></div>`;
  }
  const con=S.curCon||'eu';
  const ctryList=[...new Set(LEAGUES.filter(l2=>l2.con===con).map(l2=>l2.ctry))];
  let ctry=S.curCtry;
  if(!ctryList.includes(ctry)){ctry=ctryList[0];S.curCtry=ctry;}
  if(LEAGUES[lg].ctry!==ctry){
    const first=LEAGUES.findIndex(l2=>l2.ctry===ctry);
    S.curLg=first;return VIEWS.league();
  }
  const conChips=`<div class="chips">${CONTS.map(([cc,nm])=>
    `<button class="${con===cc?'on':''}" onclick="setCon('${cc}')">${nm[L]}</button>`).join('')}</div>`;
  const ctryChips=`<div class="chips">${ctryList.map(cc=>
    `<button class="${ctry===cc?'on':''}" onclick="setCtry('${cc}')">${CTRYS[cc][L]}</button>`).join('')}</div>`;
  const lgRow=`<div class="chips">${LEAGUES.map((l2,i)=>l2.ctry===ctry?
    `<button class="${lg===i?'on':''}" onclick="setCurLg(${i})">${lgName(i)}</button>`:'').join('')}</div>`;
  return `${conChips}${ctryChips}${lgRow}
  <div class="tabs">
    <button class="${tab==='table'?'on':''}" onclick="S.ltab='table';render()">${t('standings')}</button>
    <button class="${tab==='fix'?'on':''}" onclick="S.ltab='fix';render()">${t('fixtures')}</button>
    <button class="${tab==='scorers'?'on':''}" onclick="S.ltab='scorers';render()">${t('scorers')}</button>
    <button class="${tab==='assists'?'on':''}" onclick="S.ltab='assists';render()">${t('assistsT')}</button>
    <button class="${tab==='tr'?'on':''}" onclick="S.ltab='tr';render()">${t('transfersT')}</button>
    <button class="${tab==='hist'?'on':''}" onclick="S.ltab='hist';render()">${t('history')}</button>
  </div>${selRow}${body}`;
},

team(id){
  const tm=S.teams[id];
  const pos=teamPos(id);
  const squad=S.players.filter(p=>p.team===id);
  const avg=Math.round(teamStr(id));
  const groups=[['KL','gk'],['DF','df'],['OS','mf'],['FV','fw']];
  const played=[];
  for(let w=0;w<S.week-1&&w<totalWeeks();w++){
    S.fx[tm.lg][w].forEach(m=>{if((m.h===id||m.a===id)&&m.hg!==null)played.push(m);});
  }
  const last5=played.slice(-5);
  const formHtml=last5.map(m=>{
    const mine=m.h===id?m.hg:m.ag, opp=m.h===id?m.ag:m.hg;
    const win=mine>opp, loss=mine<opp;
    const col=win?'var(--acc)':loss?'var(--bad)':'var(--warn)';
    const bg=win?'rgba(13,159,110,.11)':loss?'rgba(220,38,38,.09)':'rgba(192,124,16,.11)';
    const ch=L==='en'?(win?'W':loss?'L':'D'):(win?'G':loss?'M':'B');
    return `<span class="formsq" style="color:${col};background:${bg}">${ch}</span>`;
  }).join('');
  return `

      ${tmBadge(tm,48)}
      <div style="flex:1"><div class="hname">${tm.n}</div>
      <div class="hsub">${lgName(tm.lg)}${LEAGUES[tm.lg].gl?' · '+LEAGUES[tm.lg].gl[tm.grp||0][L==='tr'?0:1]:''} · #${pos} · ${tm.pts} ${t('PTS')} · ${tm.w}${t('W')} ${tm.d}${t('D')} ${tm.l}${t('L')} · ${tm.gf}:${tm.ga}</div></div>
      <div class="bigrt"><span class="n">${avg}</span><span class="l">${t('avgRating')}</span></div>

    ${last5.length?`<div style="margin-top:14px" class="row"><span class="sub">${t('form')}</span><span>${formHtml}</span></div>`:''}
  </div>
  ${groups.map(([pk,lk])=>{
    const ps=squad.filter(p=>p.pos===pk).sort((a,b)=>b.r-a.r);
    if(!ps.length)return '';
    return `<div class="sect" style="margin:16px 2px 8px">${t(lk)}</div>${listWrap(ps.map(p=>playerRow(p,{noBadge:true})).join(''))}`;
  }).join('')}`;

function evChoose(i){
  const ref=S.evCur;
  if(!ref)return;
  const ev=evById(ref.id),c=evCtx(ref.pid);
  const opt=ev.opts[i];
  if(!opt)return;
  const r=opt.eff(c)||{};
  const changes=applyEff(r,c);
  S.evCur=null;
  const lbl={cash:t('cash'),rep:t('rep'),morale:t('morale'),trust:t('trustL'),form:t('form')};
  const chips=changes.map(x=>{
    const good=x.v>0, val=x.k==='cash'?fmtK(Math.abs(x.v)):Math.abs(x.v);
    return `<span class="tag ${good?'g':'b'}">${lbl[x.k]} ${good?'+':'−'}${val}</span>`;
  }).join('');
  openModal(`<h2>${ev.ttl(c)[L]}</h2>
    <div class="dquote ${changes.some(x=>x.v<0)?(changes.some(x=>x.v>0)?'mid':'bad'):'good'}" style="margin-top:12px">${r.msg?r.msg[L]:''}</div>
    ${chips?`<div style="margin-top:14px">${chips}</div>`:''}
    <button class="btn p" style="margin-top:16px" onclick="closeModal()">${t('gotIt')}</button>`);
  save();render();
}
