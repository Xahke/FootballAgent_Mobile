<body>
<header>
  <div class="hrow">
    <button class="hback" id="hBack" onclick="back()">‹</button>
    <div class="htitle"><div class="t1" id="hT1">Menajer</div><div class="t2" id="hT2"></div></div>
    <div class="hstat cash"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5v9"/><path d="M14.8 9.2c-.6-.8-1.7-1.2-2.8-1.2-1.6 0-2.8.8-2.8 2s1 1.7 2.8 2c1.8.3 2.8 1 2.8 2s-1.2 2-2.8 2c-1.1 0-2.2-.4-2.8-1.2"/></svg><span class="v" id="hCash">—</span><span class="l" id="hCashL">Kasa</span></div>
    <div class="hstat rep"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m12 3 2.7 5.6 6.1.8-4.5 4.2 1.1 6-5.4-2.9-5.4 2.9 1.1-6L3.2 9.4l6.1-.8z"/></svg><span class="v" id="hRep">—</span><span class="l" id="hRepL">İtibar</span></div>
    <button class="hback show" id="btnSet" onclick="pushV('settings')" aria-label="Ayarlar"></button>
    <button id="btnNext" onclick="nextWeek()">Devam</button>
  </div>
</header>
<main id="view"></main>
<nav id="nav"></nav>

<div class="toast" id="toast"></div>
